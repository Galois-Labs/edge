version: v2
modules:
  - path: .
    name: buf.build/galois-labs/daemon
lint:
  use:
    - STANDARD
  except:
    # Allow "Request"/"Response" suffix convention we already use.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
deps:
  - buf.build/googleapis/googleapis
