    setter: ":SENSe:RESistance:REFerence {value}"
    type: property
    params:
      value:
        type: float
        unit: Ohm
        min: 0
        max: 120e6
    returns:
      type: float
      unit: Ohm
    description: "2-wire resistance reference for relative measurements"

  sense_resistance_reference_state:
    getter: ":SENSe:RESistance:REFerence:STATe?"
    setter: ":SENSe:RESistance:REFerence:STATe {state}"
    type: property
    params:
