    type: property
    params:
      value:
        type: int
        min: 4
        max: 7
        default: 6
    returns:
      type: int
    description: "AC voltage display resolution (4-7 digits)"

  sense_voltage_ac_bandwidth:
    getter: ":SENSe:VOLTage:AC:DETector:BANDwidth?"
    setter: ":SENSe:VOLTage:AC:DETector:BANDwidth {value}"
    type: property
    params:
      value:
        type: float
        unit: Hz
        min: 3
        max: 300000
        default: 30
    returns:
      type: float
      unit: Hz
    description: "AC voltage detector bandwidth"

  sense_voltage_ac_reference:
    getter: ":SENSe:VOLTage:AC:REFerence?"
    setter: ":SENSe:VOLTage:AC:REFerence {value}"
    type: property
    params:
