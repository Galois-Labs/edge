        type: float
        unit: V
        min: -757.5
        max: 757.5
    returns:
      type: float
      unit: V
    description: "AC voltage reference for relative measurements"

  sense_voltage_ac_reference_state:
    getter: ":SENSe:VOLTage:AC:REFerence:STATe?"
    setter: ":SENSe:VOLTage:AC:REFerence:STATe {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable AC voltage reference"

  sense_voltage_ac_average_state:
    getter: ":SENSe:VOLTage:AC:AVERage:STATe?"
    setter: ":SENSe:VOLTage:AC:AVERage:STATe {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable AC voltage filter"

  sense_voltage_ac_average_tcontrol:
    getter: ":SENSe:VOLTage:AC:AVERage:TCONtrol?"
    setter: ":SENSe:VOLTage:AC:AVERage:TCONtrol {type}"
    type: property
    params:
      type:
        type: enum
        options: ["MOV", "REP"]
    returns:
