instrument:
  manufacturer: "Keithley"
  model: "2010"
  class: dmm
  description: "7½-digit High-Performance Digital Multimeter with 0.0018% basic DCV accuracy"

identity:
  query: "*IDN?"
  pattern: "KEITHLEY INSTRUMENTS.*2010"

interfaces:
  - type: gpib
    default_address: 16
  - type: serial

settings:
  timeout_ms: 5000
  terminator: "\n"
  opc_query: false

commands:
  # ============================================================================
  # IEEE-488.2 Common Commands
  # ============================================================================
  reset:
    scpi: "*RST"
    type: write
    description: "Reset instrument to *RST default conditions"

  clear_status:
    scpi: "*CLS"
    type: write
    description: "Clear all event registers and Error Queue"

  identify:
    scpi: "*IDN?"
    type: query
    returns:
      type: string
    description: "Query instrument identification"

  operation_complete:
    scpi: "*OPC"
    type: write
    description: "Set OPC bit in Standard Event Register after all pending operations complete"

  operation_complete_query:
    scpi: "*OPC?"
    type: query
    returns:
      type: int
    description: "Return '1' when all pending operations complete"

  self_test:
    scpi: "*TST?"
    type: query
    returns:
      type: int
    description: "Perform self-test and return result (0 = pass, 1 = fail)"

  wait:
    scpi: "*WAI"
    type: write
    description: "Wait until all previous commands are executed"

  trigger:
    scpi: "*TRG"
    type: write
    description: "Send bus trigger to instrument"

  save_setup:
    scpi: "*SAV {location}"
    type: write
    params:
      location:
        type: int
        min: 0
        max: 4
    description: "Save present setup to memory location (0-4)"

  recall_setup:
    scpi: "*RCL {location}"
    type: write
    params:
      location:
        type: int
        min: 0
        max: 4
    description: "Recall setup from memory location (0-4)"

  event_status_enable:
    getter: "*ESE?"
    setter: "*ESE {mask}"
    type: property
    params:
      mask:
        type: int
        min: 0
        max: 255
    returns:
      type: int
    description: "Event status enable register"

  event_status_register:
    scpi: "*ESR?"
    type: query
    returns:
      type: int
    description: "Read and clear event status register"

  service_request_enable:
    getter: "*SRE?"
    setter: "*SRE {mask}"
    type: property
    params:
      mask:
        type: int
        min: 0
        max: 255
    returns:
      type: int
    description: "Service request enable register"

  status_byte:
    scpi: "*STB?"
    type: query
    returns:
      type: int
    description: "Read status byte register"

  option_identification:
    scpi: "*OPT?"
    type: query
    returns:
      type: string
    description: "Query installed options (scanner card)"

  # ============================================================================
  # Signal Oriented Measurement Commands
  # ============================================================================
  configure_voltage_dc:
    scpi: "CONFigure:VOLTage:DC"
    type: write
    description: "Configure for DC voltage measurement"

  configure_voltage_ac:
    scpi: "CONFigure:VOLTage:AC"
    type: write
    description: "Configure for AC voltage measurement"

  configure_current_dc:
    scpi: "CONFigure:CURRent:DC"
    type: write
    description: "Configure for DC current measurement"

  configure_current_ac:
    scpi: "CONFigure:CURRent:AC"
    type: write
    description: "Configure for AC current measurement"

  configure_resistance:
    scpi: "CONFigure:RESistance"
    type: write
    description: "Configure for 2-wire resistance measurement"

  configure_fresistance:
    scpi: "CONFigure:FRESistance"
    type: write
    description: "Configure for 4-wire resistance measurement"

  configure_frequency:
    scpi: "CONFigure:FREQuency"
    type: write
    description: "Configure for frequency measurement"

  configure_period:
    scpi: "CONFigure:PERiod"
    type: write
    description: "Configure for period measurement"

  configure_temperature:
    scpi: "CONFigure:TEMPerature"
    type: write
    description: "Configure for temperature measurement"

  configure_diode:
    scpi: "CONFigure:DIODe"
    type: write
    description: "Configure for diode test"

  configure_continuity:
    scpi: "CONFigure:CONTinuity"
    type: write
    description: "Configure for continuity test"

  fetch:
    scpi: "FETCh?"
    type: query
    returns:
      type: array
      element_type: float
      separator: ","
    description: "Request the latest reading"

  read:
    scpi: "READ?"
    type: query
    returns:
      type: array
      element_type: float
      separator: ","
    description: "Trigger and fetch readings"
    streamable: true

  measure_voltage_dc:
    scpi: "MEASure:VOLTage:DC?"
    type: query
    returns:
      type: float
      unit: V
    description: "Configure, trigger, and read DC voltage"

  measure_voltage_ac:
    scpi: "MEASure:VOLTage:AC?"
    type: query
    returns:
      type: float
      unit: V
    description: "Configure, trigger, and read AC voltage"

  measure_current_dc:
    scpi: "MEASure:CURRent:DC?"
    type: query
    returns:
      type: float
      unit: A
    description: "Configure, trigger, and read DC current"

  measure_current_ac:
    scpi: "MEASure:CURRent:AC?"
    type: query
    returns:
      type: float
      unit: A
    description: "Configure, trigger, and read AC current"

  measure_resistance:
    scpi: "MEASure:RESistance?"
    type: query
    returns:
      type: float
      unit: Ohm
    description: "Configure, trigger, and read 2-wire resistance"

  measure_fresistance:
    scpi: "MEASure:FRESistance?"
    type: query
    returns:
      type: float
      unit: Ohm
    description: "Configure, trigger, and read 4-wire resistance"

  measure_frequency:
    scpi: "MEASure:FREQuency?"
    type: query
    returns:
      type: float
      unit: Hz
    description: "Configure, trigger, and read frequency"

  measure_period:
    scpi: "MEASure:PERiod?"
    type: query
    returns:
      type: float
      unit: s
    description: "Configure, trigger, and read period"

  measure_temperature:
    scpi: "MEASure:TEMPerature?"
    type: query
    returns:
      type: float
    description: "Configure, trigger, and read temperature"

  # ============================================================================
  # SENSe Subsystem - Function Selection
  # ============================================================================
  sense_function:
    getter: ":SENSe:FUNCtion?"
    setter: ":SENSe:FUNCtion \"{function}\""
    type: property
    params:
      function:
        type: enum
        options: ["VOLT:DC", "VOLT:AC", "CURR:DC", "CURR:AC", "RES", "FRES", "FREQ", "PER", "TEMP", "DIOD", "CONT"]
    returns:
      type: string
    description: "Select measurement function"

  sense_data:
    scpi: ":SENSe:DATA?"
    type: query
    returns:
      type: float
    description: "Return latest reading"

  sense_data_fresh:
    scpi: ":SENSe:DATA:FRESh?"
    type: query
    returns:
      type: float
    description: "Return new (fresh) reading"

  # ============================================================================
  # SENSe - DC Voltage Commands
  # ============================================================================
  sense_voltage_dc_range:
    getter: ":SENSe:VOLTage:DC:RANGe?"
    setter: ":SENSe:VOLTage:DC:RANGe {value}"
    type: property
    params:
      value:
        type: float
        unit: V
        min: 0
        max: 1010
    returns:
      type: float
      unit: V
    description: "DC voltage measurement range"

  sense_voltage_dc_range_auto:
    getter: ":SENSe:VOLTage:DC:RANGe:AUTO?"
    setter: ":SENSe:VOLTage:DC:RANGe:AUTO {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable DC voltage auto-ranging"

  sense_voltage_dc_nplc:
    getter: ":SENSe:VOLTage:DC:NPLCycles?"
    setter: ":SENSe:VOLTage:DC:NPLCycles {value}"
    type: property
    params:
      value:
        type: float
        min: 0.01
        max: 10
        default: 1.0
    returns:
      type: float
    description: "DC voltage integration time in power line cycles"

  sense_voltage_dc_digits:
    getter: ":SENSe:VOLTage:DC:DIGits?"
    setter: ":SENSe:VOLTage:DC:DIGits {value}"
    type: property
    params:
      value:
        type: int
        min: 4
        max: 8
        default: 8
    returns:
      type: int
    description: "DC voltage display resolution (4-8 digits)"

  sense_voltage_dc_reference:
    getter: ":SENSe:VOLTage:DC:REFerence?"
    setter: ":SENSe:VOLTage:DC:REFerence {value}"
    type: property
    params:
      value:
        type: float
        unit: V
        min: -1010
        max: 1010
    returns:
      type: float
      unit: V
    description: "DC voltage reference for relative measurements"

  sense_voltage_dc_reference_state:
    getter: ":SENSe:VOLTage:DC:REFerence:STATe?"
    setter: ":SENSe:VOLTage:DC:REFerence:STATe {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable DC voltage reference"

  sense_voltage_dc_reference_acquire:
    scpi: ":SENSe:VOLTage:DC:REFerence:ACQuire"
    type: write
    description: "Use current DC voltage reading as reference"

  sense_voltage_dc_average_state:
    getter: ":SENSe:VOLTage:DC:AVERage:STATe?"
    setter: ":SENSe:VOLTage:DC:AVERage:STATe {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable DC voltage filter"

  sense_voltage_dc_average_tcontrol:
    getter: ":SENSe:VOLTage:DC:AVERage:TCONtrol?"
    setter: ":SENSe:VOLTage:DC:AVERage:TCONtrol {type}"
    type: property
    params:
      type:
        type: enum
        options: ["MOV", "REP"]
    returns:
      type: string
    description: "DC voltage filter type (moving or repeat)"

  sense_voltage_dc_average_count:
    getter: ":SENSe:VOLTage:DC:AVERage:COUNt?"
    setter: ":SENSe:VOLTage:DC:AVERage:COUNt {count}"
    type: property
    params:
      count:
        type: int
        min: 1
        max: 100
        default: 10
    returns:
      type: int
    description: "DC voltage filter count"

  # ============================================================================
  # SENSe - AC Voltage Commands
  # ============================================================================
  sense_voltage_ac_range:
    getter: ":SENSe:VOLTage:AC:RANGe?"
    setter: ":SENSe:VOLTage:AC:RANGe {value}"
