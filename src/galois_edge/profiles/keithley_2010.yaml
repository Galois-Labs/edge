        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable 2-wire resistance reference"

  sense_resistance_ocompensated:
    getter: ":SENSe:RESistance:OCOMpensated?"
    setter: ":SENSe:RESistance:OCOMpensated {state}"
