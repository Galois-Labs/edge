status:
  stb:
    bit2: "Error queue not empty"
    bit3: "Questionable status summary"
    bit4: "Message available"
    bit5: "Event status bit"
    bit6: "Master status summary"
    bit7: "Operation status summary"
  esr:
    bit0: "Operation complete"
    bit2: "Query error"
    bit3: "Device dependent error"
    bit4: "Execution error"
    bit5: "Command error"
    bit6: "User request"
    bit7: "Power on"