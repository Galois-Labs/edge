sequences:
  measure_voltage_sweep:
    description: "Measure DC voltage across a range with multiple samples"
    params:
      range:
        type: float
        unit: V
        default: 10
      resolution:
        type: float
        unit: V
        default: 0.001
      count:
        type: int
        default: 10
    steps:
      - command: configure_voltage_dc
        args:
          range: "{range}"
          resolution: "{resolution}"
      - command: sample_count
        args:
          count: "{count}"
      - command: read
        capture: result
    returns: result

  measure_resistance_fast:
    description: "Fast resistance measurement with minimum integration time"
    params:
      range:
        type: float
        unit: Ohm
        default: 1000
    steps:
      - command: configure_resistance_4wire
        args:
          range: "{range}"
          resolution: "1"
      - command: fresistance_nplc
        args:
          nplc: "0.02"
      - command: read
        capture: result
    returns: result

  measure_temperature_rtd:
    description: "Measure temperature using 4-wire RTD"
    params:
      rtd_type:
        type: int
        default: 85
    steps:
      - command: configure_temperature
        args:
          transducer: "FRTD"
          type: "{rtd_type}"
          resolution: "0.001"
      - command: read
        capture: result
    returns: result

  continuous_monitoring:
    description: "Continuous measurement with statistics"
    params:
      function:
        type: string
        default: "VOLTage:DC"
      count:
        type: int
        default: 100
    steps:
      - command: sense_function
        args:
          function: "{function}"
      - command: calculate_average_state
        args:
          state: "ON"
      - command: sample_count
        args:
          count: "{count}"
      - command: initiate
      - scpi: "*WAI"
      - command: calculate_average_all
        capture: stats
      - command: fetch
        capture: readings
    returns: stats

status:
  stb:
    bit2: "Error Available"
    bit3: "Questionable Summary"
    bit4: "Message Available"
    bit5: "Event Summary"
    bit6: "Request Service"
    bit7: "Operation Summary"
  esr:
    bit0: "Operation Complete"
    bit2: "Query Error"
    bit3: "Device Error"
    bit4: "Execution Error"
    bit5: "Command Error"
    bit7: "Power On"