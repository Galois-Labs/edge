    description: "HeaterRange"
  coordsys:
    getter: "READ:SYS:VRM:COO"
    setter: "SET:SYS:VRM:COO:{value}"
    type: property
    force_query: true
    params:
      value:
        type: enum
        options: ["Cartesian", "Cylindrical", "Spherical"]
        map:
          "Cartesian": "CART"
          "Cylindrical": "CYL"
          "Spherical": "SPH"
    returns:
      type: string
      parser:
        type: regex
        pattern: ".*:([\\d.A-Za-z]+)$"
        group: 1
    description: "CoordSys"
  bx:
    getter: "READ:SYS:VRM:VECT"
    setter: "SET:SYS:VRM:RVST:MODE:ASAP:VSET:[{value}]"
    type: property
    force_query: true
    requires_sweep: true
    sweep:
      rate_param: sweep_rate
      command: "SET:SYS:VRM:RVST:MODE:RATE:RATE:{sweep_rate}:VSET:[{value}]"
      check_command: "READ:SYS:VRM:ACTN"
      check_idle_match: "IDLE"
      stop_command: "SET:SYS:VRM:ACTN:HOLD"
      poll_interval_ms: 1000
    params:
