  controlloop:
    getter: "READ:DEV:T{channel}:TEMP:LOOP:MODE"
    setter: "SET:DEV:T{channel}:TEMP:LOOP:MODE:{value}"
    type: property
    force_query: true
    params:
      channel:
        type: string
        description: "Temperature channel (e.g., 5, 8)"
      value:
        type: enum
        options: ["ON", "OFF"]
    returns:
      type: string
      parser:
        type: regex
        pattern: ".*:([\\d.A-Za-z]+)$"
        group: 1
    description: "ControlLoop"
  tset:
    getter: "READ:DEV:T{channel}:TEMP:LOOP:TSET"
    setter: "SET:DEV:T{channel}:TEMP:LOOP:TSET:{value}"
    type: property
    force_query: true
    params:
      channel:
        type: string
        description: "Temperature channel (e.g., 5, 8)"
      value:
        type: float
        unit: K
        max: 300.0
    returns:
      type: float
      unit: K
      parser:
        type: regex
        pattern: ".*:([\\d.]+)[A-Za-z]*$"
        group: 1
    description: "TSet"
  heaterrange:
    getter: "READ:DEV:T{channel}:TEMP:LOOP:RANGE"
    setter: "SET:DEV:T{channel}:TEMP:LOOP:RANGE:{value}"
    type: property
    force_query: true
    params:
      channel:
        type: string
        description: "Temperature channel (e.g., 5, 8)"
      value:
        type: enum
        options: ["Off", "31.6 uA", "100 uA", "316 uA", "1 mA", "3.16 mA", "10 mA", "31.6 mA", "100 mA"]
        map:
          "Off": "0.0"
          "31.6 uA": "0.0316"
          "100 uA": "0.1"
          "316 uA": "0.316"
          "1 mA": "1.0"
          "3.16 mA": "3.16"
          "10 mA": "10.0"
          "31.6 mA": "31.6"
          "100 mA": "100.0"
    returns:
