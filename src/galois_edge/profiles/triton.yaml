# Triton 200 dilution fridge Instrument Profile
# Converted from Labber driver (MIT licensed, (c) 2015 Lab Control Software Scandinavia AB)
# Original driver: Triton
# NOTE: Original Labber driver includes custom Python logic not captured here

instrument:
  manufacturer: "Triton"
  model: "200 dilution fridge"
  class: cryostat
  description: "Triton 200 dilution fridge"

identity:
  query: "*IDN?"
  pattern: "Triton.*Triton"

interfaces:
  - type: ethernet

settings:
  timeout_ms: 5000
  terminator: "\n"
  opc_query: false

commands:
  # IEEE-488.2 Common Commands
  reset:
    scpi: "*RST"
    type: write
    description: "Reset instrument to default settings"
  clear_status:
    scpi: "*CLS"
    type: write
    description: "Clear all event registers and error queue"
  identify:
    scpi: "*IDN?"
    type: query
    returns:
      type: string
    description: "Query instrument identification"
  operation_complete:
    scpi: "*OPC"
    type: write
    description: "Set OPC bit when all pending operations complete"
  operation_complete_query:
    scpi: "*OPC?"
    type: query
    returns:
      type: int
    description: "Return 1 when all pending operations complete"
  self_test:
    scpi: "*TST?"
    type: query
    returns:
      type: int
    description: "Perform self-test (0=pass)"

  # Instrument-Specific Commands (converted from Labber)
  t1:
    scpi: "READ:DEV:T1:TEMP:SIG:TEMP"
    type: query
    force_query: true
    returns:
      type: float
      unit: K
      parser:
        type: regex
        pattern: ".*:([\\d.]+)[A-Za-z]*$"
        group: 1
    description: "T1"
  t2:
    scpi: "READ:DEV:T2:TEMP:SIG:TEMP"
    type: query
    force_query: true
    returns:
      type: float
