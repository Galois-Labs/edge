    description: "Current reference (relative) value"

  current_reference_state:
    getter: ":SENS:CURR:REF:STAT?"
    setter: ":SENS:CURR:REF:STAT {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable current reference"

  current_reference_acquire:
    scpi: ":SENS:CURR:REF:ACQ"
    type: write
    description: "Use input signal as current reference"

  current_digits:
    getter: ":SENS:CURR:DIG?"
    setter: ":SENS:CURR:DIG {value}"
    type: property
    params:
      value:
        type: int
        min: 4
        max: 7
        default: 6
    returns:
      type: int
    description: "Current display resolution"

  current_digits_auto:
    getter: ":SENS:CURR:DIG:AUTO?"
    setter: ":SENS:CURR:DIG:AUTO {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable auto resolution for current"

  current_damping:
    getter: ":SENS:CURR:DAMP?"
    setter: ":SENS:CURR:DAMP {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable current damping"

  measure_current:
    scpi: ":MEAS:CURR?"
    type: query
    returns:
      type: float
      unit: A
    description: "Perform current measurement"
    streamable: true

  resistance_mode:
    getter: ":SENS:RES:MODE?"
    setter: ":SENS:RES:MODE {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["AUTO", "MAN"]
    returns:
      type: string
    description: "Resistance measurement mode (auto or manual V-source)"

  resistance_range:
    getter: ":SENS:RES:RANG?"
    setter: ":SENS:RES:RANG {value}"
    type: property
    params:
      value:
        type: float
        unit: Ohm
        min: 2e6
        max: 100e18
    returns:
      type: float
      unit: Ohm
    description: "Resistance measurement range"

  resistance_range_auto:
    getter: ":SENS:RES:RANG:AUTO?"
    setter: ":SENS:RES:RANG:AUTO {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable resistance auto-ranging"

  resistance_range_auto_ulimit:
    getter: ":SENS:RES:RANG:AUTO:ULIM?"
    setter: ":SENS:RES:RANG:AUTO:ULIM {value}"
    type: property
    params:
      value:
        type: float
        unit: Ohm
        min: 0
        max: 100e18
    returns:
      type: float
      unit: Ohm
    description: "Upper limit for resistance auto-range"

  resistance_range_auto_llimit:
    getter: ":SENS:RES:RANG:AUTO:LLIM?"
    setter: ":SENS:RES:RANG:AUTO:LLIM {value}"
    type: property
    params:
      value:
        type: float
        unit: Ohm
        min: 0
        max: 100e18
    returns:
      type: float
      unit: Ohm
    description: "Lower limit for resistance auto-range"

  resistance_nplc:
    getter: ":SENS:RES:NPLC?"
    setter: ":SENS:RES:NPLC {value}"
    type: property
    params:
      value:
        type: float
        min: 0.01
        max: 10
        default: 1.0
    returns:
      type: float
    description: "Resistance integration time in power line cycles"

  resistance_nplc_auto:
    getter: ":SENS:RES:NPLC:AUTO?"
    setter: ":SENS:RES:NPLC:AUTO {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable auto NPLC for resistance"

  resistance_aperture:
    getter: ":SENS:RES:APER?"
    setter: ":SENS:RES:APER {value}"
    type: property
    params:
      value:
        type: float
        unit: s
        min: 0.00016667
        max: 0.2
    returns:
      type: float
      unit: s
    description: "Resistance integration time in seconds"

  resistance_aperture_auto:
    getter: ":SENS:RES:APER:AUTO?"
    setter: ":SENS:RES:APER:AUTO {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable auto aperture for resistance"

  resistance_vsource_range:
    getter: ":SENS:RES:VSOU:RANG?"
    setter: ":SENS:RES:VSOU:RANG {value}"
    type: property
    params:
      value:
        type: float
        unit: V
        min: 100
        max: 1000
    returns:
      type: float
      unit: V
    description: "V-source range for resistance measurements"

  resistance_vsource_amplitude:
    getter: ":SENS:RES:VSOU?"
    setter: ":SENS:RES:VSOU {value}"
    type: property
    params:
      value:
        type: float
        unit: V
        min: -1000
        max: 1000
    returns:
      type: float
      unit: V
    description: "V-source level for resistance measurements"

  resistance_vsource_operate:
    getter: ":SENS:RES:VSOU:OPER?"
    setter: ":SENS:RES:VSOU:OPER {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable V-source for resistance"

  resistance_reference:
    getter: ":SENS:RES:REF?"
    setter: ":SENS:RES:REF {value}"
    type: property
    params:
      value:
        type: float
        unit: Ohm
        min: -100e18
        max: 100e18
    returns:
      type: float
      unit: Ohm
    description: "Resistance reference (relative) value"

  resistance_reference_state:
    getter: ":SENS:RES:REF:STAT?"
    setter: ":SENS:RES:REF:STAT {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable resistance reference"

  resistance_reference_acquire:
    scpi: ":SENS:RES:REF:ACQ"
    type: write
    description: "Use input signal as resistance reference"

  resistance_iref_state:
    getter: ":SENS:RES:IREF?"
    setter: ":SENS:RES:IREF {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable current reference for resistance"

  resistance_digits:
    getter: ":SENS:RES:DIG?"
    setter: ":SENS:RES:DIG {value}"
    type: property
    params:
      value:
        type: int
        min: 4
        max: 7
        default: 6
    returns:
      type: int
    description: "Resistance display resolution"

  resistance_digits_auto:
    getter: ":SENS:RES:DIG:AUTO?"
    setter: ":SENS:RES:DIG:AUTO {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable auto resolution for resistance"

  resistance_damping:
    getter: ":SENS:RES:DAMP?"
    setter: ":SENS:RES:DAMP {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable resistance damping"

  measure_resistance:
    scpi: ":MEAS:RES?"
    type: query
    returns:
      type: float
      unit: Ohm
    description: "Perform resistance measurement"
    streamable: true

  charge_range:
    getter: ":SENS:CHAR:RANG?"
    setter: ":SENS:CHAR:RANG {value}"
    type: property
    params:
      value:
        type: float
        unit: C
        min: 0
        max: 2.1e-6
    returns:
      type: float
      unit: C
    description: "Charge measurement range"

  charge_range_auto:
    getter: ":SENS:CHAR:RANG:AUTO?"
    setter: ":SENS:CHAR:RANG:AUTO {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable charge auto-ranging"

  charge_range_auto_lgroup:
    getter: ":SENS:CHAR:RANG:AUTO:LGRO?"
    setter: ":SENS:CHAR:RANG:AUTO:LGRO {group}"
    type: property
    params:
      group:
        type: enum
        options: ["HIGH", "LOW"]
    returns:
      type: string
    description: "Select high or low auto-range limit group for charge"

  charge_nplc:
    getter: ":SENS:CHAR:NPLC?"
    setter: ":SENS:CHAR:NPLC {value}"
    type: property
    params:
      value:
        type: float
        min: 0.01
        max: 10
        default: 1.0
    returns:
      type: float
    description: "Charge integration time in power line cycles"

  charge_nplc_auto:
    getter: ":SENS:CHAR:NPLC:AUTO?"
    setter: ":SENS:CHAR:NPLC:AUTO {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable auto NPLC for charge"

  charge_aperture:
    getter: ":SENS:CHAR:APER?"
    setter: ":SENS:CHAR:APER {value}"
    type: property
    params:
      value:
        type: float
        unit: s
        min: 0.00016667
        max: 0.2
    returns:
      type: float
      unit: s
    description: "Charge integration time in seconds"

  charge_aperture_auto:
    getter: ":SENS:CHAR:APER:AUTO?"
    setter: ":SENS:CHAR:APER:AUTO {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable auto aperture for charge"

  charge_reference:
    getter: ":SENS:CHAR:REF?"
    setter: ":SENS:CHAR:REF {value}"
    type: property
    params:
      value:
        type: float
        unit: C
        min: -2.1e-6
        max: 2.1e-6
    returns:
      type: float
      unit: C
    description: "Charge reference (relative) value"

  charge_reference_state:
    getter: ":SENS:CHAR:REF:STAT?"
    setter: ":SENS:CHAR:REF:STAT {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable charge reference"

  charge_reference_acquire:
    scpi: ":SENS:CHAR:REF:ACQ"
    type: write
    description: "Use input signal as charge reference"

  charge_digits:
    getter: ":SENS:CHAR:DIG?"
    setter: ":SENS:CHAR:DIG {value}"
    type: property
    params:
      value:
        type: int
        min: 4
        max: 7
        default: 6
    returns:
      type: int
    description: "Charge display resolution"

  charge_digits_auto:
    getter: ":SENS:CHAR:DIG:AUTO?"
    setter: ":SENS:CHAR:DIG:AUTO {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable auto resolution for charge"

  charge_auto_discharge:
    getter: ":SENS:CHAR:ADIS?"
    setter: ":SENS:CHAR:ADIS {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable charge auto-discharge"

  charge_auto_discharge_level:
    getter: ":SENS:CHAR:ADIS:LEV?"
    setter: ":SENS:CHAR:ADIS:LEV {value}"
    type: property
    params:
      value:
        type: float
        unit: C
        min: -2.2e-6
        max: 2.2e-6
    returns:
      type: float
      unit: C
    description: "Charge auto-discharge threshold level"

  measure_charge:
    scpi: ":MEAS:CHAR?"
    type: query
    returns:
      type: float
      unit: C
    description: "Perform charge measurement"
    streamable: true

  guard:
    getter: ":SENS:GUAR?"
    setter: ":SENS:GUAR {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable guard"

  external_feedback:
    getter: ":SENS:XFEE?"
    setter: ":SENS:XFEE {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable external feedback"

  filter_type:
    getter: ":SENS:AVER:TYPE?"
    setter: ":SENS:AVER:TYPE {type}"
    type: property
    params:
      type:
        type: enum
        options: ["NONE", "SCAL", "ADV"]
    returns:
      type: string
    description: "Select filter type"

  filter_state:
    getter: ":SENS:AVER?"
    setter: ":SENS:AVER {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable digital filter"

  filter_count:
    getter: ":SENS:AVER:COUN?"
    setter: ":SENS:AVER:COUN {count}"
    type: property
    params:
      count:
        type: int
        min: 1
        max: 100
        default: 10
    returns:
      type: int
    description: "Filter count (number of readings to average)"

  filter_tcontrol:
    getter: ":SENS:AVER:TCON?"
    setter: ":SENS:AVER:TCON {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["MOV", "REP"]
    returns:
      type: string
    description: "Filter mode (moving or repeating average)"

  filter_advanced_ntolerance:
    getter: ":SENS:AVER:ADV:NTOL?"
    setter: ":SENS:AVER:ADV:NTOL {value}"
    type: property
    params:
      value:
        type: float
        unit: "%"
        min: 0
        max: 100
        default: 1
    returns:
      type: float
      unit: "%"
    description: "Advanced filter noise tolerance"

  median_filter_state:
    getter: ":SENS:MED?"
    setter: ":SENS:MED {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable median filter"

  median_filter_rank:
    getter: ":SENS:MED:RANK?"
