  display_text2:
    getter: ":DISP:WIND2:TEXT:DATA?"
    setter: ":DISP:WIND2:TEXT:DATA \"{text}\""
    type: property
    params:
      text:
        type: string
    returns:
      type: string
    description: "Bottom display text message"

  display_text2_state:
    getter: ":DISP:WIND2:TEXT:STAT?"
    setter: ":DISP:WIND2:TEXT:STAT {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable bottom display text"

  display_clear_next:
    scpi: ":DISP:CND"
    type: write
    description: "Clear NEXT display messages"

  display_status_message:
    getter: ":DISP:SMES?"
    setter: ":DISP:SMES {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable status message mode"

  calculate_format:
    getter: ":CALC:FORM?"
    setter: ":CALC:FORM {format}"
    type: property
    params:
      format:
        type: enum
        options: ["NONE", "PERC", "POL", "RAT", "DEV", "PDEV", "LOG10"]
    returns:
      type: string
    description: "CALC1 math format"