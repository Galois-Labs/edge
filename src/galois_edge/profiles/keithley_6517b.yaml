instrument:
  manufacturer: "Keithley Instruments"
  model: "6517B"
  class: smu
  description: "Electrometer with 1000V Source - High Resistance, Low Current, Charge Measurements"

identity:
  query: "*IDN?"
  pattern: "KEITHLEY INSTRUMENTS INC.,MODEL 6517B"

interfaces:
  - type: gpib
    default_address: 27
  - type: serial
    port: 9600

settings:
  timeout_ms: 5000
  terminator: "\n"
  opc_query: false

commands:
  reset:
    scpi: "*RST"
    type: write
    description: "Reset instrument to default conditions"

  clear_status:
    scpi: "*CLS"
    type: write
    description: "Clear all event registers and error queue"

  identify:
    scpi: "*IDN?"
    type: query
    returns:
      type: string
    description: "Query instrument identification"

  operation_complete:
    scpi: "*OPC"
    type: write
    description: "Set operation complete bit after all pending operations"

  operation_complete_query:
    scpi: "*OPC?"
    type: query
    returns:
      type: int
    description: "Query operation complete status"

  self_test:
    scpi: "*TST?"
    type: query
    returns:
      type: int
    description: "Perform self-test (0=pass, 1=fail)"

  wait:
    scpi: "*WAI"
    type: write
    description: "Wait until all previous commands are executed"

  trigger:
    scpi: "*TRG"
    type: write
    description: "Send bus trigger"

  save_setup:
    scpi: "*SAV {location}"
    type: write
    params:
      location:
        type: int
        min: 0
        max: 9
    description: "Save present setup to memory location"

  recall_setup:
    scpi: "*RCL {location}"
    type: write
    params:
      location:
        type: int
        min: 0
        max: 9
    description: "Recall setup from memory location"

  event_status_enable:
    getter: "*ESE?"
    setter: "*ESE {mask}"
    type: property
    params:
      mask:
        type: int
        min: 0
        max: 255
    returns:
      type: int
    description: "Event status enable register"

  event_status_register:
    scpi: "*ESR?"
    type: query
    returns:
      type: int
    description: "Read and clear event status register"

  service_request_enable:
    getter: "*SRE?"
    setter: "*SRE {mask}"
    type: property
    params:
      mask:
        type: int
        min: 0
        max: 255
    returns:
      type: int
    description: "Service request enable register"

  status_byte:
    scpi: "*STB?"
    type: query
    returns:
      type: int
    description: "Read status byte register"

  option_identification:
    scpi: "*OPT?"
    type: query
    returns:
      type: string
    description: "Query installed options"

  measure_function:
    getter: ":SENS:FUNC?"
    setter: ":SENS:FUNC \"{function}\""
    type: property
    params:
      function:
        type: enum
        options: ["VOLT:DC", "CURR:DC", "RES", "CHAR"]
    returns:
      type: string
    description: "Select measurement function"

  voltage_range:
    getter: ":SENS:VOLT:RANG?"
    setter: ":SENS:VOLT:RANG {value}"
    type: property
    params:
      value:
        type: float
        unit: V
        min: 0.2
        max: 210
    returns:
      type: float
      unit: V
    description: "Voltage measurement range"

  voltage_range_auto:
    getter: ":SENS:VOLT:RANG:AUTO?"
    setter: ":SENS:VOLT:RANG:AUTO {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable voltage auto-ranging"

  voltage_range_auto_ulimit:
    getter: ":SENS:VOLT:RANG:AUTO:ULIM?"
    setter: ":SENS:VOLT:RANG:AUTO:ULIM {value}"
    type: property
    params:
      value:
        type: float
        unit: V
        min: 0
        max: 210
    returns:
      type: float
      unit: V
    description: "Upper limit for voltage auto-range"

  voltage_range_auto_llimit:
    getter: ":SENS:VOLT:RANG:AUTO:LLIM?"
    setter: ":SENS:VOLT:RANG:AUTO:LLIM {value}"
    type: property
    params:
      value:
        type: float
        unit: V
        min: 0
        max: 210
    returns:
      type: float
      unit: V
    description: "Lower limit for voltage auto-range"

  voltage_nplc:
    getter: ":SENS:VOLT:NPLC?"
    setter: ":SENS:VOLT:NPLC {value}"
    type: property
    params:
      value:
        type: float
        min: 0.01
        max: 10
        default: 1.0
    returns:
      type: float
    description: "Voltage integration time in power line cycles"

  voltage_nplc_auto:
    getter: ":SENS:VOLT:NPLC:AUTO?"
    setter: ":SENS:VOLT:NPLC:AUTO {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable auto NPLC for voltage"

  voltage_aperture:
    getter: ":SENS:VOLT:APER?"
    setter: ":SENS:VOLT:APER {value}"
    type: property
    params:
      value:
        type: float
        unit: s
        min: 0.00016667
        max: 0.2
    returns:
      type: float
      unit: s
    description: "Voltage integration time in seconds"

  voltage_aperture_auto:
    getter: ":SENS:VOLT:APER:AUTO?"
    setter: ":SENS:VOLT:APER:AUTO {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable auto aperture for voltage"

  voltage_reference:
    getter: ":SENS:VOLT:REF?"
    setter: ":SENS:VOLT:REF {value}"
    type: property
    params:
      value:
        type: float
        unit: V
        min: -210
        max: 210
    returns:
      type: float
      unit: V
    description: "Voltage reference (relative) value"

  voltage_reference_state:
    getter: ":SENS:VOLT:REF:STAT?"
    setter: ":SENS:VOLT:REF:STAT {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable voltage reference"

  voltage_reference_acquire:
    scpi: ":SENS:VOLT:REF:ACQ"
    type: write
    description: "Use input signal as voltage reference"

  voltage_digits:
    getter: ":SENS:VOLT:DIG?"
    setter: ":SENS:VOLT:DIG {value}"
    type: property
    params:
      value:
        type: int
        min: 4
        max: 7
        default: 6
    returns:
      type: int
    description: "Voltage display resolution"

  voltage_digits_auto:
    getter: ":SENS:VOLT:DIG:AUTO?"
    setter: ":SENS:VOLT:DIG:AUTO {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable auto resolution for voltage"

  measure_voltage:
    scpi: ":MEAS:VOLT?"
    type: query
    returns:
      type: float
      unit: V
    description: "Perform voltage measurement"
    streamable: true

  current_range:
    getter: ":SENS:CURR:RANG?"
    setter: ":SENS:CURR:RANG {value}"
    type: property
    params:
      value:
        type: float
        unit: A
        min: 2e-12
        max: 0.021
    returns:
      type: float
      unit: A
    description: "Current measurement range"

  current_range_auto:
    getter: ":SENS:CURR:RANG:AUTO?"
    setter: ":SENS:CURR:RANG:AUTO {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable current auto-ranging"

  current_range_auto_ulimit:
    getter: ":SENS:CURR:RANG:AUTO:ULIM?"
    setter: ":SENS:CURR:RANG:AUTO:ULIM {value}"
    type: property
    params:
      value:
        type: float
        unit: A
        min: 0
        max: 0.021
    returns:
      type: float
      unit: A
    description: "Upper limit for current auto-range"

  current_range_auto_llimit:
    getter: ":SENS:CURR:RANG:AUTO:LLIM?"
    setter: ":SENS:CURR:RANG:AUTO:LLIM {value}"
    type: property
    params:
      value:
        type: float
        unit: A
        min: 0
        max: 0.021
    returns:
      type: float
      unit: A
    description: "Lower limit for current auto-range"

  current_nplc:
    getter: ":SENS:CURR:NPLC?"
    setter: ":SENS:CURR:NPLC {value}"
    type: property
    params:
      value:
        type: float
        min: 0.01
        max: 10
        default: 1.0
    returns:
      type: float
    description: "Current integration time in power line cycles"

  current_nplc_auto:
    getter: ":SENS:CURR:NPLC:AUTO?"
    setter: ":SENS:CURR:NPLC:AUTO {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable auto NPLC for current"

  current_aperture:
    getter: ":SENS:CURR:APER?"
    setter: ":SENS:CURR:APER {value}"
    type: property
    params:
      value:
        type: float
        unit: s
        min: 0.00016667
        max: 0.2
    returns:
      type: float
      unit: s
    description: "Current integration time in seconds"

  current_aperture_auto:
    getter: ":SENS:CURR:APER:AUTO?"
    setter: ":SENS:CURR:APER:AUTO {state}"
    type: property
    params:
      state:
        type: bool
    returns:
      type: bool
    description: "Enable/disable auto aperture for current"

  current_reference:
    getter: ":SENS:CURR:REF?"
    setter: ":SENS:CURR:REF {value}"
    type: property
    params:
      value:
        type: float
        unit: A
        min: -0.021
        max: 0.021
    returns:
      type: float
