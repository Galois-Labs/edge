---
instrument:
  manufacturer: "Hewlett-Packard"
  model: "33120A"
  class: function_generator
  description: "15 MHz Arbitrary Waveform Function Generator with 12-bit resolution and 40 MSa/s sample rate"

identity:
  query: "*IDN?"
  pattern: "(HEWLETT-PACKARD|AGILENT|Agilent Technologies),33120A"

interfaces:
  - type: gpib
    default_address: 10
  - type: serial
    port: 9600

settings:
  timeout_ms: 5000
  terminator: "\n"
  opc_query: false

commands:
  # IEEE-488.2 Common Commands
  reset:
    scpi: "*RST"
    type: write
    description: "Reset instrument to factory default state"

  clear_status:
    scpi: "*CLS"
    type: write
    description: "Clear status registers and error queue"

  identify:
    scpi: "*IDN?"
    type: query
    returns:
      type: string
    description: "Query instrument identification string"

  operation_complete:
    scpi: "*OPC"
    type: write
    description: "Set operation complete bit after all pending operations complete"

  operation_complete_query:
    scpi: "*OPC?"
    type: query
    returns:
      type: int
    description: "Return 1 when all pending operations complete"

  self_test:
    scpi: "*TST?"
    type: query
    returns:
      type: int
    description: "Perform self-test, return 0 if pass or 1 if fail"

  wait:
    scpi: "*WAI"
    type: write
    description: "Wait for all pending operations to complete"

  trigger:
    scpi: "*TRG"
    type: write
    description: "Send bus trigger"

  power_on_status_clear:
    getter: "*PSC?"
    setter: "*PSC {state}"
    type: property
    params:
      state:
        type: enum
        options: ["0", "1"]
    returns:
      type: int
    description: "Clear status byte and event registers on power-on (1=clear, 0=preserve)"

  save_state:
    scpi: "*SAV {location}"
    type: write
    params:
      location:
        type: int
        min: 0
        max: 3
    description: "Save instrument state to memory location (0-3)"

  recall_state:
    scpi: "*RCL {location}"
    type: write
    params:
      location:
        type: int
        min: 0
        max: 3
    description: "Recall instrument state from memory location (0-3)"

  service_request_enable:
    getter: "*SRE?"
    setter: "*SRE {mask}"
    type: property
    params:
      mask:
        type: int
        min: 0
        max: 255
    returns:
      type: int
    description: "Service request enable register"

  event_status_enable:
    getter: "*ESE?"
    setter: "*ESE {mask}"
    type: property
    params:
      mask:
        type: int
        min: 0
        max: 255
    returns:
      type: int
    description: "Event status enable register"

  status_byte:
    scpi: "*STB?"
    type: query
    returns:
      type: int
    description: "Read status byte register"

  event_status_register:
    scpi: "*ESR?"
    type: query
    returns:
      type: int
    description: "Read and clear event status register"

  # APPLy Commands
  apply_sine:
    scpi: "APPLy:SINusoid {frequency},{amplitude},{offset}"
    type: write
    params:
      frequency:
        type: float
        unit: Hz
        min: 0.0001
        max: 15000000
      amplitude:
        type: float
        unit: Vpp
        min: 0.05
        max: 10
      offset:
        type: float
        unit: V
        min: -5
        max: 5
    description: "Configure and output sine wave"

  apply_square:
    scpi: "APPLy:SQUare {frequency},{amplitude},{offset}"
    type: write
    params:
      frequency:
        type: float
        unit: Hz
        min: 0.0001
        max: 15000000
      amplitude:
        type: float
        unit: Vpp
        min: 0.05
        max: 10
      offset:
        type: float
        unit: V
        min: -5
        max: 5
    description: "Configure and output square wave"

  apply_triangle:
    scpi: "APPLy:TRIangle {frequency},{amplitude},{offset}"
    type: write
    params:
      frequency:
        type: float
        unit: Hz
        min: 0.0001
        max: 100000
      amplitude:
        type: float
        unit: Vpp
        min: 0.05
        max: 10
      offset:
        type: float
        unit: V
        min: -5
        max: 5
    description: "Configure and output triangle wave"

  apply_ramp:
    scpi: "APPLy:RAMP {frequency},{amplitude},{offset}"
    type: write
    params:
      frequency:
        type: float
        unit: Hz
        min: 0.0001
        max: 100000
      amplitude:
        type: float
        unit: Vpp
        min: 0.05
        max: 10
      offset:
        type: float
        unit: V
        min: -5
        max: 5
    description: "Configure and output ramp wave"

  apply_noise:
    scpi: "APPLy:NOISe DEF,{amplitude},{offset}"
    type: write
    params:
      amplitude:
        type: float
        unit: Vpp
        min: 0.05
        max: 10
      offset:
        type: float
        unit: V
        min: -5
        max: 5
    description: "Configure and output noise"

  apply_dc:
    scpi: "APPLy:DC DEF,DEF,{offset}"
    type: write
    params:
      offset:
        type: float
        unit: V
        min: -5
        max: 5
    description: "Configure and output DC voltage"

  apply_user:
    scpi: "APPLy:USER {frequency},{amplitude},{offset}"
    type: write
    params:
      frequency:
        type: float
        unit: Hz
        min: 0.0001
        max: 5000000
      amplitude:
        type: float
        unit: Vpp
        min: 0.05
        max: 10
      offset:
        type: float
        unit: V
        min: -5
        max: 5
    description: "Configure and output arbitrary waveform"

  apply_query:
    scpi: "APPLy?"
    type: query
    returns:
      type: string
    description: "Query current output configuration"

  # Output Configuration
  function_shape:
    getter: "FUNCtion:SHAPe?"
    setter: "FUNCtion:SHAPe {shape}"
    type: property
    params:
      shape:
        type: enum
        options: ["SINusoid", "SQUare", "TRIangle", "RAMP", "NOISe", "DC", "USER"]
    returns:
      type: string
    description: "Select output waveform function"

  frequency:
    getter: "FREQuency?"
    setter: "FREQuency {value}"
    type: property
    params:
      value:
        type: float
        unit: Hz
        min: 0.0001
        max: 15000000
    returns:
      type: float
      unit: Hz
    description: "Set output frequency"

  pulse_duty_cycle:
    getter: "PULSe:DCYCle?"
    setter: "PULSe:DCYCle {value}"
    type: property
    params:
      value:
        type: float
        unit: "%"
        min: 20
        max: 80
    returns:
      type: float
      unit: "%"
    description: "Square wave duty cycle"

  amplitude:
    getter: "VOLTage?"
    setter: "VOLTage {value}"
    type: property
    params:
      value:
        type: float
        unit: Vpp
        min: 0.05
        max: 10
    returns:
      type: float
      unit: Vpp
    description: "Output amplitude (peak-to-peak)"

  offset:
    getter: "VOLTage:OFFSet?"
    setter: "VOLTage:OFFSet {value}"
    type: property
    params:
      value:
        type: float
        unit: V
        min: -5
        max: 5
    returns:
      type: float
      unit: V
    description: "DC offset voltage"

  voltage_unit:
    getter: "VOLTage:UNIT?"
    setter: "VOLTage:UNIT {unit}"
    type: property
    params:
      unit:
        type: enum
        options: ["VPP", "VRMS", "DBM", "DEFault"]
    returns:
      type: string
    description: "Voltage amplitude units"

  output_load:
    getter: "OUTPut:LOAD?"
    setter: "OUTPut:LOAD {value}"
    type: property
    params:
      value:
        type: float
        unit: Ohm
        min: 50
        max: 10000
    returns:
      type: float
      unit: Ohm
    description: "Output termination impedance (use INFinity for high-Z)"

  output_sync:
    getter: "OUTPut:SYNC?"
    setter: "OUTPut:SYNC {state}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON"]
    returns:
      type: bool
    description: "Enable/disable sync output"

  # AM Modulation
  am_depth:
    getter: "AM:DEPTh?"
    setter: "AM:DEPTh {value}"
    type: property
    params:
      value:
        type: float
        unit: "%"
        min: 0
        max: 120
    returns:
      type: float
      unit: "%"
    description: "AM modulation depth"

  am_internal_function:
    getter: "AM:INTernal:FUNCtion?"
    setter: "AM:INTernal:FUNCtion {shape}"
    type: property
    params:
      shape:
        type: enum
        options: ["SINusoid", "SQUare", "TRIangle", "RAMP", "NOISe", "USER"]
    returns:
      type: string
    description: "AM internal modulation waveform shape"

  am_internal_frequency:
    getter: "AM:INTernal:FREQuency?"
    setter: "AM:INTernal:FREQuency {value}"
    type: property
    params:
      value:
        type: float
        unit: Hz
        min: 0.00001
        max: 20000
    returns:
      type: float
      unit: Hz
    description: "AM internal modulation frequency"

  am_source:
    getter: "AM:SOURce?"
    setter: "AM:SOURce {source}"
    type: property
    params:
      source:
        type: enum
        options: ["BOTH", "EXTernal"]
    returns:
      type: string
    description: "AM modulation source"

  am_state:
    getter: "AM:STATe?"
    setter: "AM:STATe {state}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON"]
    returns:
      type: bool
    description: "Enable/disable AM modulation"

  # FM Modulation
  fm_deviation:
    getter: "FM:DEViation?"
    setter: "FM:DEViation {value}"
    type: property
    params:
      value:
        type: float
        unit: Hz
        min: 0.00001
        max: 7500000
    returns:
      type: float
      unit: Hz
    description: "FM peak frequency deviation"

  fm_internal_function:
    getter: "FM:INTernal:FUNCtion?"
    setter: "FM:INTernal:FUNCtion {shape}"
    type: property
    params:
      shape:
        type: enum
        options: ["SINusoid", "SQUare", "TRIangle", "RAMP", "NOISe", "USER"]
    returns:
      type: string
    description: "FM internal modulation waveform shape"

  fm_internal_frequency:
    getter: "FM:INTernal:FREQuency?"
    setter: "FM:INTernal:FREQuency {value}"
    type: property
    params:
      value:
        type: float
        unit: Hz
        min: 0.00001
        max: 10000
    returns:
      type: float
      unit: Hz
    description: "FM internal modulation frequency"

  fm_state:
    getter: "FM:STATe?"
    setter: "FM:STATe {state}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON"]
    returns:
      type: bool
    description: "Enable/disable FM modulation"

  # Burst Modulation
  burst_ncycles:
    getter: "BM:NCYCles?"
    setter: "BM:NCYCles {value}"
    type: property
    params:
      value:
        type: int
        min: 1
        max: 50000
    returns:
      type: int
    description: "Number of cycles per burst"

  burst_phase:
    getter: "BM:PHASe?"
    setter: "BM:PHASe {value}"
    type: property
    params:
      value:
        type: float
        unit: deg
        min: -360
        max: 360
    returns:
      type: float
      unit: deg
    description: "Burst starting phase"

  burst_internal_rate:
    getter: "BM:INTernal:RATE?"
    setter: "BM:INTernal:RATE {value}"
    type: property
    params:
      value:
        type: float
        unit: Hz
        min: 0.00001
        max: 50000
    returns:
      type: float
      unit: Hz
    description: "Internal burst rate"

  burst_source:
    getter: "BM:SOURce?"
    setter: "BM:SOURce {source}"
    type: property
    params:
      source:
        type: enum
        options: ["INTernal", "EXTernal"]
    returns:
      type: string
    description: "Burst modulation source (gated mode if external)"

  burst_state:
    getter: "BM:STATe?"
    setter: "BM:STATe {state}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON"]
    returns:
      type: bool
    description: "Enable/disable burst modulation"

  # FSK Modulation
  fsk_frequency:
    getter: "FSKey:FREQuency?"
    setter: "FSKey:FREQuency {value}"
    type: property
    params:
      value:
        type: float
        unit: Hz
        min: 0.00001
        max: 15000000
    returns:
      type: float
      unit: Hz
    description: "FSK hop frequency"

  fsk_internal_rate:
    getter: "FSKey:INTernal:RATE?"
    setter: "FSKey:INTernal:RATE {value}"
    type: property
    params:
      value:
        type: float
        unit: Hz
        min: 0.00001
        max: 50000
    returns:
      type: float
      unit: Hz
    description: "FSK internal shift rate"

  fsk_source:
    getter: "FSKey:SOURce?"
    setter: "FSKey:SOURce {source}"
    type: property
    params:
      source:
        type: enum
        options: ["INTernal", "EXTernal"]
    returns:
      type: string
    description: "FSK modulation source"

  fsk_state:
    getter: "FSKey:STATe?"
    setter: "FSKey:STATe {state}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON"]
    returns:
      type: bool
    description: "Enable/disable FSK modulation"

  # Frequency Sweep
  sweep_start_frequency:
    getter: "FREQuency:STARt?"
    setter: "FREQuency:STARt {value}"
    type: property
    params:
      value:
        type: float
        unit: Hz
        min: 0.00001
        max: 15000000
    returns:
      type: float
      unit: Hz
    description: "Sweep start frequency"

  sweep_stop_frequency:
    getter: "FREQuency:STOP?"
    setter: "FREQuency:STOP {value}"
    type: property
    params:
      value:
        type: float
        unit: Hz
        min: 0.00001
        max: 15000000
    returns:
      type: float
      unit: Hz
    description: "Sweep stop frequency"

  sweep_spacing:
    getter: "SWEep:SPACing?"
    setter: "SWEep:SPACing {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["LINear", "LOGarithmic"]
    returns:
      type: string
    description: "Sweep spacing (linear or logarithmic)"

  sweep_time:
    getter: "SWEep:TIME?"
    setter: "SWEep:TIME {value}"
    type: property
    params:
      value:
        type: float
        unit: s
        min: 0.001
        max: 500
    returns:
      type: float
      unit: s
    description: "Sweep time duration"

  sweep_state:
    getter: "SWEep:STATe?"
    setter: "SWEep:STATe {state}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON"]
    returns:
      type: bool
    description: "Enable/disable sweep mode"

  # Triggering
  trigger_source:
    getter: "TRIGger:SOURce?"
    setter: "TRIGger:SOURce {source}"
    type: property
    params:
      source:
        type: enum
        options: ["IMMediate", "EXTernal", "BUS"]
    returns:
      type: string
    description: "Trigger source for burst and sweep"

  trigger_slope:
    getter: "TRIGger:SLOPe?"
    setter: "TRIGger:SLOPe {slope}"
    type: property
    params:
      slope:
        type: enum
        options: ["POSitive", "NEGative"]
    returns:
      type: string
    description: "External trigger edge polarity"

  # Arbitrary Waveforms
  function_user:
    getter: "FUNCtion:USER?"
    setter: "FUNCtion:USER {name}"
    type: property
    params:
      name:
        type: string
    returns:
      type: string
    description: "Select arbitrary waveform by name"

  data_volatile:
    scpi: "DATA VOLATILE,{values}"
    type: write
    params:
      values:
        type: string
    description: "Download floating-point values (-1 to +1) to volatile memory"

  data_dac_volatile:
    scpi: "DATA:DAC VOLATILE,{values}"
    type: write
    params:
      values:
        type: string
    description: "Download binary integer values (-2047 to +2047) to volatile memory"

  data_attribute_average:
    scpi: "DATA:ATTRibute:AVERage? {name}"
    type: query
    params:
      name:
        type: string
        default: ""
    returns:
      type: float
    description: "Query arithmetic average of waveform data points"

  data_attribute_cfactor:
    scpi: "DATA:ATTRibute:CFACtor? {name}"
    type: query
    params:
      name:
        type: string
        default: ""
    returns:
      type: float
    description: "Query crest factor of waveform"

  data_attribute_points:
    scpi: "DATA:ATTRibute:POINts? {name}"
    type: query
    params:
      name:
        type: string
        default: ""
    returns:
      type: int
    description: "Query number of points in waveform"

  data_attribute_ptpeak:
    scpi: "DATA:ATTRibute:PTPeak? {name}"
    type: query
    params:
      name:
        type: string
        default: ""
    returns:
      type: float
    description: "Query peak-to-peak value of waveform"

  data_catalog:
    scpi: "DATA:CATalog?"
    type: query
    returns:
      type: string
    description: "List all stored arbitrary waveform names"

  data_copy:
    scpi: "DATA:COPY {destination},VOLATILE"
    type: write
    params:
      destination:
        type: string
    description: "Copy waveform from volatile to non-volatile memory"

  data_delete:
    scpi: "DATA:DELete {name}"
    type: write
    params:
      name:
        type: string
    description: "Delete arbitrary waveform from memory"

  data_delete_all:
    scpi: "DATA:DELete:ALL"
    type: write
    description: "Delete all user-defined waveforms from memory"

  data_nvolatile_catalog:
    scpi: "DATA:NVOLatile:CATalog?"
    type: query
    returns:
      type: string
    description: "List user-defined waveforms in non-volatile memory"

  data_nvolatile_free:
    scpi: "DATA:NVOLatile:FREE?"
    type: query
    returns:
      type: int
    description: "Query number of free non-volatile memory slots"

  format_border:
    getter: "FORMat:BORDer?"
    setter: "FORMat:BORDer {order}"
    type: property
    params:
      order:
        type: enum
        options: ["NORMal", "SWAPped"]
    returns:
      type: string
    description: "Binary data byte order"

  # System Commands
  display_enable:
    getter: "DISPlay?"
    setter: "DISPlay {state}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON"]
    returns:
      type: bool
    description: "Enable/disable front panel display"

  display_text:
    getter: "DISPlay:TEXT?"
    setter: "DISPlay:TEXT \"{text}\""
    type: property
    params:
      text:
        type: string
    returns:
      type: string
    description: "Display text message on front panel (up to 11 characters)"

  display_text_clear:
    scpi: "DISPlay:TEXT:CLEar"
    type: write
    description: "Clear displayed text message"

  beeper:
    scpi: "SYSTem:BEEPer"
    type: write
    description: "Issue a single beep"

  system_error:
    scpi: "SYSTem:ERRor?"
    type: query
    returns:
      type: string
    description: "Read one error from error queue"

  system_version:
    scpi: "SYSTem:VERSion?"
    type: query
    returns:
      type: string
    description: "Query SCPI version compliance"

  system_local:
    scpi: "SYSTem:LOCal"
    type: write
    description: "Place instrument in local mode (RS-232 only)"

  system_remote:
    scpi: "SYSTem:REMote"
    type: write
    description: "Place instrument in remote mode (RS-232 only)"

  system_rwlock:
    scpi: "SYSTem:RWLock"
    type: write
    description: "Place instrument in remote mode with locked front panel (RS-232 only)"

  memory_state_delete:
    scpi: "MEMory:STATe:DELete {location}"
    type: write
    params:
      location:
        type: int
        min: 0
        max: 3
    description: "Delete stored instrument state"

  # Calibration Commands
  calibration_query:
    scpi: "CALibration?"
    type: query
    returns:
      type: string
    description: "Perform calibration using specified value"

  calibration_count:
    scpi: "CALibration:COUNt?"
    type: query
    returns:
      type: int
    description: "Query number of times instrument has been calibrated"

  calibration_secure_code:
    scpi: "CALibration:SECure:CODE {code}"
    type: write
    params:
      code:
        type: string
    description: "Enter new calibration security code"

  calibration_secure_state:
    getter: "CALibration:SECure:STATe?"
    setter: "CALibration:SECure:STATe {state},{code}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON"]
      code:
        type: string
    returns:
      type: bool
    description: "Secure/unsecure instrument for calibration"

  calibration_setup:
    getter: "CALibration:SETup?"
    setter: "CALibration:SETup {step}"
    type: property
    params:
      step:
        type: int
        min: 0
        max: 84
    returns:
      type: int
    description: "Configure internal state for calibration step"

  calibration_string:
    getter: "CALibration:STRing?"
    setter: "CALibration:STRing \"{text}\""
    type: property
    params:
      text:
        type: string
    returns:
      type: string
    description: "Store/retrieve calibration message (up to 40 characters)"

  calibration_value:
    getter: "CALibration:VALue?"
    setter: "CALibration:VALue {value}"
    type: property
    params:
      value:
        type: float
    returns:
      type: float
    description: "Specify value of known calibration signal"

sequences:
  output_sine_wave:
    description: "Configure and output a sine wave"
    params:
      frequency:
        type: float
        unit: Hz
      amplitude:
        type: float
        unit: Vpp
      offset:
        type: float
        unit: V
        default: 0
    steps:
      - command: apply_sine
        args:
          frequency: "{frequency}"
          amplitude: "{amplitude}"
          offset: "{offset}"

  output_square_wave:
    description: "Configure and output a square wave with duty cycle"
    params:
      frequency:
        type: float
        unit: Hz
      amplitude:
        type: float
        unit: Vpp
      duty_cycle:
        type: float
        unit: "%"
        default: 50
    steps:
      - command: apply_square
        args:
          frequency: "{frequency}"
          amplitude: "{amplitude}"
          offset: "0"
      - command: pulse_duty_cycle
        args:
          value: "{duty_cycle}"

  frequency_sweep:
    description: "Configure and run a frequency sweep"
    params:
      start_freq:
        type: float
        unit: Hz
      stop_freq:
        type: float
        unit: Hz
      sweep_time:
        type: float
        unit: s
      spacing:
        type: string
        default: "LINear"
    steps:
      - command: function_shape
        args:
          shape: "SINusoid"
      - command: sweep_start_frequency
        args:
          value: "{start_freq}"
      - command: sweep_stop_frequency
        args:
          value: "{stop_freq}"
      - command: sweep_time
        args:
          value: "{sweep_time}"
      - command: sweep_spacing
        args:
          mode: "{spacing}"
      - command: trigger_source
        args:
          source: "IMMediate"
      - command: sweep_state
        args:
          state: "ON"

  amplitude_modulation:
    description: "Configure AM modulation"
    params:
      carrier_freq:
        type: float
        unit: Hz
      modulation_freq:
        type: float
        unit: Hz
      depth:
        type: float
        unit: "%"
        default: 100
    steps:
      - command: frequency
        args:
          value: "{carrier_freq}"
      - command: am_internal_frequency
        args:
          value: "{modulation_freq}"
      - command: am_depth
        args:
          value: "{depth}"
      - command: am_state
        args:
          state: "ON"

  frequency_modulation:
    description: "Configure FM modulation"
    params:
      carrier_freq:
        type: float
        unit: Hz
      modulation_freq:
        type: float
        unit: Hz
      deviation:
        type: float
        unit: Hz
    steps:
      - command: frequency
        args:
          value: "{carrier_freq}"
      - command: fm_internal_frequency
        args:
          value: "{modulation_freq}"
      - command: fm_deviation
        args:
          value: "{deviation}"
      - command: fm_state
        args:
          state: "ON"

  burst_output:
    description: "Configure burst modulation"
    params:
      frequency:
        type: float
        unit: Hz
      ncycles:
        type: int
      phase:
        type: float
        unit: deg
        default: 0
    steps:
      - command: frequency
        args:
          value: "{frequency}"
      - command: burst_ncycles
        args:
          value: "{ncycles}"
      - command: burst_phase
        args:
          value: "{phase}"
      - command: trigger_source
        args:
          source: "IMMediate"
      - command: burst_state
        args:
          state: "ON"

  stop_output:
    description: "Disable all modulations"
    steps:
      - command: am_state
        args:
          state: "OFF"
      - command: fm_state
        args:
          state: "OFF"
      - command: burst_state
        args:
          state: "OFF"
      - command: fsk_state
        args:
          state: "OFF"
      - command: sweep_state
        args:
          state: "OFF"

status:
  stb:
    bit4: MAV
    bit5: ESB
    bit6: RQS
  esr:
    bit0: OPC
    bit2: QYE
    bit3: DDE
    bit4: EXE
    bit5: CME
    bit7: PON