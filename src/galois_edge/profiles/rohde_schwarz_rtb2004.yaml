  wgen_sweep_type:
    getter: "WGENerator:SWEep:TYPE?"
    setter: "WGENerator:SWEep:TYPE {sweep_type}"
    type: property
    params:
      sweep_type:
        type: enum
        options: ["LINear", "LOGarithmic", "TRIangle"]
    returns:
      type: string
    description: "Sweep shape (linear, logarithmic, or triangle)"

  # ============================================================
  # Pattern Generator - General Settings (Section 16.13.2.1)
  # ============================================================
  pgen_function:
    getter: "PGENerator:FUNCtion?"
    setter: "PGENerator:FUNCtion {function}"
    type: property
    params:
      function:
        type: enum
        options: ["SQUarewave", "COUNter", "ARBitrary", "SPI", "I2C", "UART", "CAN", "LIN", "MANual", "I2S", "TDM"]
        default: "SQUarewave"
    returns:
      type: string
    description: "Pattern generator function/protocol selection"

  pgen_state:
    getter: "PGENerator:PATTern:STATe?"
    setter: "PGENerator:PATTern:STATe {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF"]
        default: "ON"
    returns:
      type: bool
    description: "Enable/disable pattern generator output"

  pgen_trigger_extern_slope:
    getter: "PGENerator:PATTern:TRIGger:EXTern:SLOPe?"
    setter: "PGENerator:PATTern:TRIGger:EXTern:SLOPe {slope}"
    type: property
    params:
      slope:
        type: enum
        options: ["POSitive", "NEGative", "EITHer"]
        default: "POSitive"
    returns:
      type: string
    description: "External trigger slope for arbitrary pattern (rising, falling, both)"

  # ============================================================
  # Pattern Generator - Square Wave (Section 16.13.2.2)
  # ============================================================
  pgen_squarewave_polarity:
    getter: "PGENerator:PATTern:SQUarewave:POLarity?"
    setter: "PGENerator:PATTern:SQUarewave:POLarity {polarity}"
    type: property
    params:
      polarity:
        type: enum
        options: ["NORMal", "INVerted"]
        default: "NORMal"
    returns:
      type: string
    description: "Square wave polarity"

  pgen_squarewave_duty_cycle:
    getter: "PGENerator:PATTern:SQUarewave:DCYCle?"
    setter: "PGENerator:PATTern:SQUarewave:DCYCle {duty_cycle}"
    type: property
    params:
      duty_cycle:
        type: float
        unit: "%"
        min: 1.0
        max: 99.0
        default: 50.0
    returns:
      type: float
      unit: "%"
    description: "Square wave duty cycle"

  pgen_pattern_period:
    getter: "PGENerator:PATTern:PERiod?"
    setter: "PGENerator:PATTern:PERiod {period}"
    type: property
    params:
      period:
        type: float
        unit: s
        min: 20.0e-9
        max: 10416.0
        default: 2.0e-6
    returns:
      type: float
      unit: s
    description: "Pattern period (= pattern_length * bit_time, range 20ns to ~2.89h)"

  pgen_pattern_frequency:
    getter: "PGENerator:PATTern:FREQuency?"
    setter: "PGENerator:PATTern:FREQuency {frequency}"
    type: property
    params:
      frequency:
        type: float
        unit: Hz
    returns:
      type: float
      unit: Hz
    description: "Pattern frequency (reciprocal of period)"

  # ============================================================
  # Pattern Generator - Counter (Section 16.13.2.3)
  # ============================================================
  pgen_counter_frequency:
    getter: "PGENerator:PATTern:COUNter:FREQuency?"
    setter: "PGENerator:PATTern:COUNter:FREQuency {frequency}"
    type: property
    params:
      frequency:
        type: float
        unit: Hz
        min: 0.0238
        max: 25000000.0
        default: 100000.0
    returns:
      type: float
      unit: Hz
    description: "Counter switching frequency (pin frequencies: S0=f/2, S1=f/4, S2=f/8, S3=f/16)"

  pgen_counter_direction:
    getter: "PGENerator:PATTern:COUNter:DIRection?"
    setter: "PGENerator:PATTern:COUNter:DIRection {direction}"
    type: property
    params:
      direction:
        type: enum
        options: ["UPWard", "DOWNward"]
        default: "UPWard"
    returns:
      type: string
    description: "Counter direction (up or down)"

  # ============================================================
  # Pattern Generator - Arbitrary Pattern (Section 16.13.2.4)
  # ============================================================
  pgen_arb_trigger_mode:
    getter: "PGENerator:PATTern:TRIGger:MODE?"
    setter: "PGENerator:PATTern:TRIGger:MODE {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["CONTinuous", "SINGle"]
        default: "CONTinuous"
    returns:
      type: string
    description: "Arbitrary pattern trigger mode"

  pgen_arb_data:
    scpi: "PGENerator:PATTern:ARBitrary:DATA:SET {data}"
    type: write
    params:
      data:
        type: string
        description: "Comma-separated index,value pairs (e.g. 0,1,1,1,2,0,3,1,4,0)"
    description: "Define arbitrary pattern data"

  pgen_arb_data_length:
    getter: "PGENerator:PATTern:ARBitrary:DATA:LENGth?"
    setter: "PGENerator:PATTern:ARBitrary:DATA:LENGth {length}"
    type: property
    params:
      length:
        type: int
        min: 1
        max: 2048
        default: 1
    returns:
      type: int
    description: "Arbitrary pattern length in samples"

  pgen_arb_data_append:
    scpi: "PGENerator:PATTern:ARBitrary:DATA:APPend {data}"
    type: write
    params:
      data:
        type: string
        description: "Hex value to append at current index"
    description: "Append data to arbitrary pattern from current index"

  pgen_arb_data_append_or:
    scpi: "PGENerator:PATTern:ARBitrary:DATA:APPend:BOR {data}"
    type: write
    params:
      data:
        type: string
    description: "OR-combine data into existing pattern from current index"

  pgen_arb_data_append_and:
    scpi: "PGENerator:PATTern:ARBitrary:DATA:APPend:BAND {data}"
    type: write
    params:
      data:
        type: string
    description: "AND-combine data into existing pattern from current index"

  pgen_arb_data_append_index:
    getter: "PGENerator:PATTern:ARBitrary:DATA:APPend:INDex?"
    setter: "PGENerator:PATTern:ARBitrary:DATA:APPend:INDex {index}"
    type: property
    params:
      index:
        type: int
    returns:
      type: int
    description: "Set append index for arbitrary pattern data"

  pgen_arb_trigger_single:
    scpi: "PGENerator:PATTern:TRIGger:SINGle"
    type: write
    description: "Fire single pattern output (requires trigger mode = SINGle)"

  pgen_sample_time:
    getter: "PGENerator:PATTern:STIMe?"
    setter: "PGENerator:PATTern:STIMe {sample_time}"
    type: property
    params:
      sample_time:
        type: float
        unit: s
        min: 20.0e-9
        max: 42.0
        default: 20.0e-9
    returns:
      type: float
      unit: s
    description: "Time per sample (bit time) for pattern generator"

  pgen_idle_time:
    getter: "PGENerator:PATTern:ITIMe?"
    setter: "PGENerator:PATTern:ITIMe {idle_time}"
    type: property
    params:
      idle_time:
        type: float
        unit: s
        min: 20.0e-9
        max: 42.0
        default: 0.25
    returns:
      type: float
      unit: s
    description: "Idle time for pattern generator (requires burst enabled)"

  pgen_burst_state:
    getter: "PGENerator:PATTern:BURSt:STATe?"
    setter: "PGENerator:PATTern:BURSt:STATe {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF"]
        default: "OFF"
    returns:
      type: bool
    description: "Enable/disable pattern burst mode"

  pgen_burst_ncycle:
    getter: "PGENerator:PATTern:BURSt:NCYCle?"
    setter: "PGENerator:PATTern:BURSt:NCYCle {cycles}"
    type: property
    params:
      cycles:
        type: int
        min: 1
        max: 4096
        default: 1
    returns:
      type: int
    description: "Number of pattern cycles per burst"

  # ============================================================
  # Pattern Generator - Manual Pattern (Section 16.13.2.5)
  # ============================================================
  pgen_manual_pin_state:
    getter: "PGENerator:MANual:STATe{pin}?"
    setter: "PGENerator:MANual:STATe{pin} {state}"
    type: property
    params:
      pin:
        type: int
        min: 0
        max: 3
      state:
        type: enum
        options: ["ON", "OFF"]
        default: "OFF"
    returns:
      type: bool
    description: "Manual pin state for S0-S3 (ON=High, OFF=Low)"

# ============================================================
# Measurement Sequences
# ============================================================
sequences:
  capture_screenshot:
    description: "Capture and retrieve a PNG screenshot"
    steps:
      - command: screenshot_format
        args:
          format: "PNG"
      - command: screenshot_color
        args:
          scheme: "COLor"
      - command: screenshot_data
        capture: image
    returns: image

  acquire_single:
    description: "Single acquisition with OPC synchronization"
    params:
      channel:
        type: int
        default: 1
    steps:
      - command: channel_state
        args:
          channel: "{channel}"
          state: "ON"
      - command: single
      - scpi: "*OPC?"
        capture: done
      - command: channel_data
        args:
          channel: "{channel}"
        capture: waveform
    returns: waveform

  quick_measurement:
    description: "Run quick measurement on a channel and return all results"
    params:
      channel:
        type: int
        default: 1
    steps:
      - command: channel_state
        args:
          channel: "{channel}"
          state: "ON"
      - command: trigger_find_level
      - command: quick_measure_on
      - scpi: "*OPC?"
        capture: done
      - command: quick_measure_results
        capture: results
    returns: results

  measure_frequency:
    description: "Measure frequency on a channel"
    params:
      channel:
        type: int
        default: 1
    steps:
      - command: channel_state
        args:
          channel: "{channel}"
          state: "ON"
      - command: measurement_enable
        args:
          slot: "1"
          state: "ON"
      - command: measurement_type
        args:
          slot: "1"
          type: "FREQuency"
      - command: measurement_source
        args:
          slot: "1"
          source: "CH{channel}"
      - command: trigger_find_level
      - command: single
      - scpi: "*OPC?"
        capture: done
      - command: measurement_result
        args:
          slot: "1"
        capture: frequency
    returns: frequency

  read_waveform_real:
    description: "Read waveform data in REAL (float32) format with header"
    params:
      channel:
        type: int
        default: 1
    steps:
      - command: channel_state
        args:
          channel: "{channel}"
          state: "ON"
      - command: data_format
        args:
          format: "REAL"
      - command: data_byte_order
        args:
          order: "LSBF"
      - command: channel_data_points
        args:
          channel: "{channel}"
          points: "DMAX"
      - command: single
      - scpi: "*OPC?"
        capture: done
      - command: channel_data_header
        args:
          channel: "{channel}"
        capture: header
      - command: channel_data
        args:
          channel: "{channel}"
        capture: waveform
    returns: waveform

  setup_edge_trigger:
    description: "Configure edge trigger on a channel"
    params:
      channel:
        type: int
        default: 1
      slope:
        type: string
        default: "POSitive"
      level:
        type: float
        default: 0.5
    steps:
      - command: trigger_type
        args:
          type: "EDGE"
      - command: trigger_source
        args:
          source: "CH{channel}"
      - command: trigger_edge_slope
        args:
          slope: "{slope}"
      - command: trigger_level
        args:
          channel: "{channel}"
          level: "{level}"
      - command: trigger_mode
        args:
          mode: "NORMal"
    returns: null

  autoset_and_measure:
    description: "Autoset display then run quick measurements"
    steps:
      - command: autoset
      - scpi: "*OPC?"
        capture: done
      - command: quick_measure_on
      - scpi: "*OPC?"
        capture: done2
      - command: quick_measure_results
        capture: results
    returns: results

  fft_analysis:
    description: "Enable FFT spectrum analysis on a channel"
    params:
      channel:
        type: int
        default: 1
      window:
        type: string
        default: "HANNing"
      scale:
        type: string
        default: "DBM"
    steps:
      - command: channel_state
        args:
          channel: "{channel}"
          state: "ON"
      - command: spectrum_state
        args:
          state: "ON"
      - command: spectrum_source
        args:
          source: "CH{channel}"
      - command: spectrum_window
        args:
          window: "{window}"
      - command: spectrum_scale
        args:
          scale: "{scale}"
      - command: spectrum_fullspan
      - command: single
      - scpi: "*OPC?"
        capture: done
      - command: spectrum_data
        capture: fft_data
    returns: fft_data

  setup_function_generator:
    description: "Configure and enable the function generator with basic settings"
    params:
      function:
        type: string
        default: "SINusoid"
      frequency:
        type: float
        unit: Hz
        default: 10000
      amplitude:
        type: float
        unit: Vpp
        default: 1.0
      offset:
        type: float
        unit: V
        default: 0.0
      load:
        type: string
        default: "HIGHz"
    steps:
      - command: wgen_function
        args:
          function: "{function}"
      - command: wgen_frequency
        args:
          frequency: "{frequency}"
      - command: wgen_voltage
        args:
          amplitude: "{amplitude}"
      - command: wgen_voltage_offset
        args:
          offset: "{offset}"
      - command: wgen_output_load
        args:
          load: "{load}"
      - command: wgen_output_enable
        args:
          state: "ON"

  read_function_generator:
    description: "Read current function generator settings"
    steps:
      - command: wgen_function
        capture: function
      - command: wgen_frequency
        capture: frequency
      - command: wgen_voltage
        capture: amplitude
      - command: wgen_voltage_offset
        capture: offset
      - command: wgen_output_load
        capture: load
      - command: wgen_output_enable
        capture: output_enabled
      - command: wgen_modulation_enable
        capture: modulation_enabled
      # wgen_burst_state hangs on firmware 01.203
      # - command: wgen_burst_state
      #   capture: burst_enabled
      - command: wgen_sweep_enable
        capture: sweep_enabled

  generate_am_signal:
    description: "Generate a sinusoidal carrier with AM modulation"
    params:
      carrier_freq:
        type: float
        unit: Hz
        default: 100000
      amplitude:
        type: float
        unit: Vpp
        default: 1.0
      mod_freq:
        type: float
        unit: Hz
        default: 1000
      mod_depth:
        type: float
        unit: "%"
        default: 50
    steps:
      - command: wgen_function
        args:
          function: "SINusoid"
      - command: wgen_frequency
        args:
          frequency: "{carrier_freq}"
      - command: wgen_voltage
        args:
          amplitude: "{amplitude}"
      - command: wgen_voltage_offset
        args:
          offset: "0"
      - command: wgen_modulation_type
        args:
          mod_type: "AM"
      - command: wgen_modulation_function
        args:
          function: "SINusiod"
      - command: wgen_mod_am_frequency
        args:
          frequency: "{mod_freq}"
      - command: wgen_mod_am_depth
        args:
          depth: "{mod_depth}"
      - command: wgen_modulation_enable
        args:
          state: "ON"
      - command: wgen_output_load
        args:
          load: "HIGHz"
      - command: wgen_output_enable
        args:
          state: "ON"

  # generate_burst_sine: DISABLED — all WGENerator:BURSt commands hang on firmware 01.203
