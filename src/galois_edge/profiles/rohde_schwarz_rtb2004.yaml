    description: "Modulating waveform frequency for FM"

  wgen_mod_fm_deviation:
    getter: "WGENerator:MODulation:FM:DEViation?"
    setter: "WGENerator:MODulation:FM:DEViation {deviation}"
    type: property
    params:
      deviation:
        type: float
        unit: Hz
    returns:
      type: float
      unit: Hz
    description: "FM frequency deviation (max difference from carrier)"

  wgen_mod_ask_frequency:
    getter: "WGENerator:MODulation:ASK:FREQuency?"
    setter: "WGENerator:MODulation:ASK:FREQuency {frequency}"
    type: property
    params:
      frequency:
        type: float
        unit: Hz
    returns:
      type: float
      unit: Hz
    description: "Modulating waveform frequency for ASK"

  wgen_mod_ask_depth:
    getter: "WGENerator:MODulation:ASK:DEPTh?"
    setter: "WGENerator:MODulation:ASK:DEPTh {depth}"
    type: property
    params:
      depth:
        type: float
        unit: "%"
    returns:
      type: float
      unit: "%"
    description: "ASK modulation depth (percentage of amplitude range)"

  wgen_mod_fsk_hop_frequency:
    getter: "WGENerator:MODulation:FSK:HFREquency?"
    setter: "WGENerator:MODulation:FSK:HFREquency {frequency}"
    type: property
    params:
      frequency:
        type: float
        unit: Hz
