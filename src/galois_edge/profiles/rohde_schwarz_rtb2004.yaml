  # ============================================================
  # Function Generator - Modulation Settings (Section 16.13.1.4)
  # ============================================================
  wgen_modulation_enable:
    getter: "WGENerator:MODulation:ENABLE?"
    setter: "WGENerator:MODulation:ENABLE {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF"]
    returns:
      type: bool
    description: "Enable/disable modulation of function generator output"

  wgen_modulation_type:
    getter: "WGENerator:MODulation:TYPE?"
    setter: "WGENerator:MODulation:TYPE {mod_type}"
    type: property
    params:
      mod_type:
        type: enum
        options: ["AM", "FM", "ASK", "FSK"]
    returns:
      type: string
    description: "Modulation type (AM, FM, amplitude shift keying, frequency shift keying)"

  wgen_modulation_function:
    getter: "WGENerator:MODulation:FUNCtion?"
    setter: "WGENerator:MODulation:FUNCtion {function}"
    type: property
    params:
      function:
        type: enum
        options: ["SINusiod", "SQUare", "TRIangle", "RAMP"]
    returns:
      type: string
    description: "Shape of the modulating waveform"

  wgen_mod_am_frequency:
    getter: "WGENerator:MODulation:AM:FREQuency?"
    setter: "WGENerator:MODulation:AM:FREQuency {frequency}"
    type: property
    params:
      frequency:
        type: float
        unit: Hz
    returns:
      type: float
      unit: Hz
    description: "Modulating waveform frequency for AM"

  wgen_mod_am_depth:
    getter: "WGENerator:MODulation:AM:DEPTh?"
    setter: "WGENerator:MODulation:AM:DEPTh {depth}"
    type: property
    params:
      depth:
        type: float
        unit: "%"
    returns:
      type: float
      unit: "%"
