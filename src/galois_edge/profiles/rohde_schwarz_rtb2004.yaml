  generate_frequency_sweep:
    description: "Generate a linear frequency sweep"
    params:
      start_freq:
        type: float
        unit: Hz
        default: 1000
      stop_freq:
        type: float
        unit: Hz
        default: 100000
      sweep_time:
        type: float
        unit: s
        default: 1.0
      amplitude:
        type: float
        unit: Vpp
        default: 1.0
    steps:
      - command: wgen_function
        args:
          function: "SINusoid"
      - command: wgen_voltage
        args:
          amplitude: "{amplitude}"
      - command: wgen_sweep_start
        args:
          frequency: "{start_freq}"
      - command: wgen_sweep_stop
        args:
          frequency: "{stop_freq}"
      - command: wgen_sweep_time
        args:
          time: "{sweep_time}"
      - command: wgen_sweep_type
        args:
          sweep_type: "LINear"
      - command: wgen_sweep_enable
        args:
          state: "ON"
      - command: wgen_output_enable
        args:
          state: "ON"

status:
  stb:
    bit0: unused
    bit2: EAV    # Error Available (error queue entry)
    bit3: QUESt  # Questionable Status
    bit4: MAV    # Message Available
    bit5: ESB    # Event Status Bit
    bit6: RQS    # Request Service / MSS
    bit7: OPER   # Operation Status
  esr:
    bit0: OPC    # Operation Complete
    bit1: RQL    # Request Control
    bit2: QYE    # Query Error
    bit3: DDE    # Device Dependent Error
    bit4: EXE    # Execution Error
    bit5: CME    # Command Error
    bit6: URQ    # User Request
    bit7: PON    # Power On
