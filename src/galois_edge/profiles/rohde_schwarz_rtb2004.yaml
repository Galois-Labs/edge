  #         amplitude: "{amplitude}"
  #     - command: wgen_burst_ncycle
  #       args:
  #         cycles: "{cycles}"
  #     - command: wgen_burst_idle_time
  #       args:
  #         idle_time: "{idle_time}"
  #     - command: wgen_burst_trigger_mode
