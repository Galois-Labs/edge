  wgen_mod_fm_frequency:
    getter: "WGENerator:MODulation:FM:FREQuency?"
    setter: "WGENerator:MODulation:FM:FREQuency {frequency}"
    type: property
    params:
      frequency:
        type: float
        unit: Hz
    returns:
      type: float
