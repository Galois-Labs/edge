# MuSwitchEX Instrument Profile
# Extended multi-channel RF switch matrix via serial/USB interface

instrument:
  manufacturer: "MuSwitchEX"
  model: "MuSwitchEX"
  class: switch
  description: "MuSwitchEX extended multi-channel RF switch matrix via serial interface"

sdk:
  package: "pyserial"
  import_path: "galois_edge.sdk_wrappers.muswitch_wrapper"
  class_name: "MuSwitchClient"
  connect:
    method: "connect"
    args:
      address: "{address}"
      num_channels: "{num_channels}"
    defaults:
      num_channels: 8
  disconnect:
    method: "disconnect"
  identity:
    method: "get_identity"
    pattern: "MuSwitchEX"

identity:
  query: "SDK_IDENTITY"
  pattern: "MuSwitchEX"

interfaces:
  - type: serial
    baud_rate: 115200
    parity: none
    data_bits: 8
    stop_bits: 1

settings:
  timeout_ms: 5000

commands:
  set_switch:
    sdk_call:
      method: "set_switch"
      args_map:
        channel: "channel"
        state: "state"
    type: write
    params:
      channel:
        type: int
        min: 1
        max: 16
        description: "Switch channel number"
      state:
        type: int
        min: 0
        max: 1
        description: "Switch state (0 or 1)"
    description: "Set a switch channel to the given state"

  get_switch:
    sdk_call:
      method: "get_switch"
      args_map:
        channel: "channel"
    type: query
    params:
      channel:
        type: int
        min: 1
        max: 16
        description: "Switch channel number"
    returns:
      type: string
    description: "Read the current state of a switch channel"

  set_all_switches:
    sdk_call:
      method: "set_all_switches"
      args_map:
        state: "state"
    type: write
    params:
      state:
        type: int
        min: 0
        max: 1
        description: "State to apply to all switches"
    description: "Set all switch channels to the same state"

  get_all_switches:
    sdk_call:
      method: "get_all_switches"
    type: query
    returns:
      type: string
    description: "Read all switch channel states (JSON)"
