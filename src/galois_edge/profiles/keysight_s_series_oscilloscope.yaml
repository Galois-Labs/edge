    description: "Ch3 - Offset"
  ch3_coupling:
    getter: ":CHAN3:INP?"
    setter: ":CHAN3:INP {value}"
    type: property
    params:
      value:
        type: enum
        options: ["DC50", "DC", "AC"]
    returns:
