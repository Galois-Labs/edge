sequences:
  lcr_measurement:
    description: "Configure and perform a basic LCR measurement"
    params:
      function:
        type: enum
        options: ["CPD", "LSRS", "RX"]
        default: "CPD"
      frequency:
        type: float
        unit: Hz
        default: 1000
      voltage:
        type: float
        unit: V
        default: 1.0
    steps:
      - command: reset
      - command: measurement_function
        args:
          function: "{function}"
      - command: frequency
        args:
          value: "{frequency}"
      - command: voltage_level
        args:
          value: "{voltage}"
      - command: range_auto
        args:
          state: "ON"
      - command: trigger_source
        args:
          source: "INTernal"
      - command: initiate_continuous
        args:
          state: "ON"
      - scpi: "*WAI"
      - command: fetch
        capture: result
    returns: result

  corrected_measurement:
    description: "Perform LCR measurement with OPEN/SHORT correction"
    params:
      function:
        type: enum
        options: ["CPD", "LSRS"]
        default: "CPD"
      frequency:
        type: float
        unit: Hz
        default: 1000
    steps:
      - command: reset
      - command: measurement_function
        args:
          function: "{function}"
      - command: frequency
        args:
          value: "{frequency}"
      - command: correction_open_state
        args:
          state: "ON"
      - command: correction_short_state
        args:
          state: "ON"
      - command: trigger_source
        args:
          source: "BUS"
      - command: initiate
      - command: trigger_immediate
      - command: fetch
        capture: result
    returns: result

  frequency_sweep:
    description: "List sweep measurement across multiple frequencies"
    params:
      frequencies:
        type: string
        default: "100,1000,10000,100000,1000000"
      function:
        type: enum
        options: ["CPD", "LSRS"]
        default: "CPD"
    steps:
      - command: reset
      - command: measurement_function
        args:
          function: "{function}"
      - command: list_frequency
        args:
          values: "{frequencies}"
      - command: list_mode
        args:
          mode: "SEQuence"
      - command: display_page
        args:
          page: "LIST"
      - command: trigger_source
        args:
          source: "BUS"
      - command: initiate
      - command: trigger_immediate
      - scpi: "*WAI"
      - command: fetch
        capture: result
    returns: result

status:
  stb:
    bit7: OSB
    bit5: ESB
    bit4: MAV
  esr:
    bit7: PON
    bit5: CME
    bit4: EXE
    bit3: DDE
    bit2: QYE
    bit0: OPC