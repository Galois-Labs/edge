        type: enum
        options: ["ON", "OFF"]
      code:
        type: string
    returns:
      type: string
    description: "Secure/unsecure instrument for calibration"

  calibration_secure_code:
    scpi: "CAL:SEC:CODE {code}"
    type: write
    params:
      code:
        type: string
    description: "Change calibration security code"

  calibration_string:
    getter: "CAL:STR?"
    setter: "CAL:STR '{message}'"
    type: property
    params:
      message:
        type: string
    returns:
      type: string
    description: "Store/read calibration message"

  calibration_count:
    scpi: "CAL:COUN?"
    type: query
    returns:
      type: int
    description: "Query number of calibrations performed"

sequences:
  scan_dc_voltage:
    description: "Scan multiple channels for DC voltage"
    params:
      channels:
        type: string
      range:
        type: float
        unit: V
        default: 10
      nplc:
        type: float
        default: 1
    steps:
      - command: configure_dc_voltage
        args:
          range: "{range}"
          resolution: "DEF"
          channels: "{channels}"
      - command: sense_voltage_dc_nplc
        args:
          nplc: "{nplc}"
          channels: "{channels}"
      - command: route_scan
        args:
          channels: "{channels}"
      - command: trigger_count
        args:
          count: "1"
      - command: initiate
      - scpi: "*WAI"
      - command: fetch
        capture: result
    returns: result

  scan_temperature:
    description: "Scan multiple channels for temperature"
    params:
      channels:
        type: string
      tc_type:
        type: string
        default: "J"
    steps:
      - command: configure_temperature_tc
        args:
          type: "{tc_type}"
          channels: "{channels}"
      - command: route_scan
        args:
          channels: "{channels}"
      - command: trigger_count
        args:
          count: "1"
      - command: initiate
      - scpi: "*WAI"
      - command: fetch
        capture: result
    returns: result

  continuous_scan:
    description: "Continuous interval scanning with specified channels"
    params:
      channels:
        type: string
      interval:
        type: float
        unit: s
        default: 10
    steps:
      - command: route_scan
        args:
          channels: "{channels}"
      - command: trigger_source
        args:
          source: "TIM"
      - command: trigger_timer
        args:
          interval: "{interval}"
      - command: trigger_count_infinite
      - command: initiate
    returns: null

  monitor_channel:
    description: "Monitor single channel continuously"
    params:
      channel:
        type: string
    steps:
      - command: route_monitor
        args:
          channel: "{channel}"
      - command: route_monitor_state
        args:
          state: "ON"
    returns: null

  read_with_scaling:
    description: "Read channel with Mx+B scaling applied"
    params:
      channel:
        type: string
      gain:
        type: float
        default: 1
      offset:
        type: float
        default: 0
      label:
        type: string
        default: "SCALED"
    steps:
      - command: calculate_scale_gain
        args:
          gain: "{gain}"
          channels: "{channel}"
      - command: calculate_scale_offset
        args:
          offset: "{offset}"
          channels: "{channel}"
      - command: calculate_scale_unit
        args:
          label: "{label}"
          channels: "{channel}"
      - command: calculate_scale_state
        args:
          state: "ON"
          channels: "{channel}"
      - command: route_scan
        args:
          channels: "{channel}"
      - command: initiate
      - scpi: "*WAI"
      - command: fetch
        capture: result
    returns: result