instrument:
  manufacturer: "Keysight"
  model: "34970A"
  class: daq
  description: "Data Acquisition/Switch Unit with 6½-digit multimeter, 3 module slots, scanning up to 60 channels"

identity:
  query: "*IDN?"
  pattern: "(HEWLETT-PACKARD|Agilent Technologies),34970A"

interfaces:
  - type: gpib
    default_address: 9
  - type: serial
    port: 57600

settings:
  timeout_ms: 5000
  terminator: "\n"
  opc_query: false

commands:
  reset:
    scpi: "*RST"
    type: write
    description: "Reset instrument to factory default conditions"

  clear_status:
    scpi: "*CLS"
    type: write
    description: "Clear all event registers and error queue"

  identify:
    scpi: "*IDN?"
    type: query
    returns:
      type: string
    description: "Query instrument identification"

  operation_complete:
    scpi: "*OPC"
    type: write
    description: "Set OPC bit in Standard Event Register after all pending operations complete"

  operation_complete_query:
    scpi: "*OPC?"
    type: query
    returns:
      type: int
    description: "Return '1' to output queue when all pending operations complete"

  self_test:
    scpi: "*TST?"
    type: query
    returns:
      type: int
    description: "Perform self-test and return result (0 = pass, 1 = fail)"

  wait:
    scpi: "*WAI"
    type: write
    description: "Wait until all previous commands are executed"

  trigger:
    scpi: "*TRG"
    type: write
    description: "Send bus trigger to instrument"

  save_setup:
    scpi: "*SAV {location}"
    type: write
    params:
      location:
        type: int
        min: 0
        max: 5
    description: "Save present setup to memory location (0-5)"

  recall_setup:
    scpi: "*RCL {location}"
    type: write
    params:
      location:
        type: int
        min: 0
        max: 5
    description: "Recall setup from memory location (0-5)"

  status_byte:
    scpi: "*STB?"
    type: query
    returns:
      type: int
    description: "Read status byte register"

  service_request_enable:
    getter: "*SRE?"
    setter: "*SRE {mask}"
    type: property
    params:
      mask:
        type: int
        min: 0
        max: 255
    returns:
      type: int
    description: "Service request enable register"

  event_status_enable:
    getter: "*ESE?"
    setter: "*ESE {mask}"
    type: property
    params:
      mask:
        type: int
        min: 0
        max: 255
    returns:
      type: int
    description: "Event status enable register"

  event_status_register:
    scpi: "*ESR?"
    type: query
    returns:
      type: int
    description: "Read and clear event status register"

  configure_dc_voltage:
    scpi: "CONF:VOLT:DC {range},{resolution},(@{channels})"
    type: write
    params:
      range:
        type: float
        unit: V
        min: 0.1
        max: 300
      resolution:
        type: float
        unit: V
      channels:
        type: string
    description: "Configure channels for DC voltage measurement"

  configure_ac_voltage:
    scpi: "CONF:VOLT:AC {range},{resolution},(@{channels})"
    type: write
    params:
      range:
        type: float
        unit: V
        min: 0.1
        max: 300
      resolution:
        type: float
        unit: V
      channels:
        type: string
    description: "Configure channels for AC voltage measurement"

  configure_dc_current:
    scpi: "CONF:CURR:DC {range},{resolution},(@{channels})"
    type: write
    params:
      range:
        type: float
        unit: A
        min: 0.01
        max: 1
      resolution:
        type: float
        unit: A
      channels:
        type: string
    description: "Configure channels for DC current measurement"

  configure_ac_current:
    scpi: "CONF:CURR:AC {range},{resolution},(@{channels})"
    type: write
    params:
      range:
        type: float
        unit: A
        min: 0.01
        max: 1
      resolution:
        type: float
        unit: A
      channels:
        type: string
    description: "Configure channels for AC current measurement"

  configure_resistance:
    scpi: "CONF:RES {range},{resolution},(@{channels})"
    type: write
    params:
      range:
        type: float
        unit: Ohm
        min: 100
        max: 100000000
      resolution:
        type: float
        unit: Ohm
      channels:
        type: string
    description: "Configure channels for 2-wire resistance measurement"

  configure_fresistance:
    scpi: "CONF:FRES {range},{resolution},(@{channels})"
    type: write
    params:
      range:
        type: float
        unit: Ohm
        min: 100
        max: 100000000
      resolution:
        type: float
        unit: Ohm
      channels:
        type: string
    description: "Configure channels for 4-wire resistance measurement"

  configure_temperature_tc:
    scpi: "CONF:TEMP TC,{type},(@{channels})"
    type: write
    params:
      type:
        type: enum
        options: ["B", "E", "J", "K", "N", "R", "S", "T"]
      channels:
        type: string
    description: "Configure channels for thermocouple temperature measurement"

  configure_temperature_rtd:
    scpi: "CONF:TEMP RTD,{type},(@{channels})"
    type: write
    params:
      type:
        type: enum
        options: ["85", "91"]
      channels:
        type: string
    description: "Configure channels for RTD temperature measurement"

  configure_temperature_thermistor:
    scpi: "CONF:TEMP THER,{type},(@{channels})"
    type: write
    params:
      type:
        type: enum
        options: ["2252", "5000", "10000"]
      channels:
        type: string
    description: "Configure channels for thermistor temperature measurement"

  configure_frequency:
    scpi: "CONF:FREQ {range},{resolution},(@{channels})"
    type: write
    params:
      range:
        type: float
        unit: Hz
      resolution:
        type: float
        unit: Hz
      channels:
        type: string
    description: "Configure channels for frequency measurement"

  configure_period:
    scpi: "CONF:PER {range},{resolution},(@{channels})"
    type: write
    params:
      range:
        type: float
        unit: s
      resolution:
        type: float
        unit: s
      channels:
        type: string
    description: "Configure channels for period measurement"

  measure_dc_voltage:
    scpi: "MEAS:VOLT:DC? {range},{resolution},(@{channels})"
    type: query
    params:
      range:
        type: float
        unit: V
        default: 10
      resolution:
        type: float
        unit: V
        default: 0.00001
      channels:
        type: string
    returns:
      type: float
      unit: V
    description: "Measure DC voltage"
    streamable: true

  measure_ac_voltage:
    scpi: "MEAS:VOLT:AC? {range},{resolution},(@{channels})"
    type: query
    params:
      range:
        type: float
        unit: V
        default: 10
      resolution:
        type: float
        unit: V
        default: 0.00001
      channels:
        type: string
    returns:
      type: float
      unit: V
    description: "Measure AC voltage"
    streamable: true

  measure_dc_current:
    scpi: "MEAS:CURR:DC? {range},{resolution},(@{channels})"
    type: query
    params:
      range:
        type: float
        unit: A
        default: 1
      resolution:
        type: float
        unit: A
        default: 0.000001
      channels:
        type: string
    returns:
      type: float
      unit: A
    description: "Measure DC current"
    streamable: true

  measure_ac_current:
    scpi: "MEAS:CURR:AC? {range},{resolution},(@{channels})"
    type: query
    params:
      range:
        type: float
        unit: A
        default: 1
      resolution:
        type: float
        unit: A
        default: 0.000001
      channels:
        type: string
    returns:
      type: float
      unit: A
    description: "Measure AC current"
    streamable: true

  measure_resistance:
    scpi: "MEAS:RES? {range},{resolution},(@{channels})"
    type: query
    params:
      range:
        type: float
        unit: Ohm
        default: 10000
      resolution:
        type: float
        unit: Ohm
        default: 0.001
      channels:
        type: string
    returns:
      type: float
      unit: Ohm
    description: "Measure 2-wire resistance"
    streamable: true

  measure_fresistance:
    scpi: "MEAS:FRES? {range},{resolution},(@{channels})"
    type: query
    params:
      range:
        type: float
        unit: Ohm
        default: 10000
      resolution:
        type: float
        unit: Ohm
        default: 0.001
      channels:
        type: string
    returns:
      type: float
      unit: Ohm
    description: "Measure 4-wire resistance"
    streamable: true

  measure_temperature:
    scpi: "MEAS:TEMP? (@{channels})"
    type: query
    params:
      channels:
        type: string
    returns:
      type: float
      unit: C
    description: "Measure temperature"
    streamable: true

  measure_frequency:
    scpi: "MEAS:FREQ? {range},{resolution},(@{channels})"
    type: query
    params:
      range:
        type: float
        unit: Hz
      resolution:
        type: float
        unit: Hz
      channels:
        type: string
    returns:
      type: float
      unit: Hz
    description: "Measure frequency"
    streamable: true

  read:
    scpi: "READ?"
    type: query
    returns:
      type: array
      element_type: float
      separator: ","
    description: "Initiate and fetch readings (combines INIT and FETCH)"

  fetch:
    scpi: "FETCH?"
    type: query
    returns:
      type: array
      element_type: float
      separator: ","
    description: "Fetch post-processed readings from memory"

  initiate:
    scpi: "INIT"
    type: write
    description: "Initiate scan - take instrument out of idle"

  abort:
    scpi: "ABOR"
    type: write
    description: "Abort and return to idle state"

  route_scan:
    getter: "ROUT:SCAN?"
    setter: "ROUT:SCAN (@{channels})"
    type: property
    params:
      channels:
        type: string
    returns:
      type: string
    description: "Define scan list"

  route_close:
    scpi: "ROUT:CLOSE (@{channels})"
    type: write
    params:
      channels:
        type: string
    description: "Close specified channels"

  route_open:
    scpi: "ROUT:OPEN (@{channels})"
    type: write
    params:
      channels:
        type: string
    description: "Open specified channels"

  route_open_all:
    scpi: "ROUT:OPEN:ALL"
    type: write
    description: "Open all channels in all slots"

  channel_delay:
    getter: "ROUT:CHAN:DEL? (@{channels})"
    setter: "ROUT:CHAN:DEL {delay},(@{channels})"
    type: property
    params:
      delay:
        type: float
        unit: s
        min: 0
        max: 60
      channels:
        type: string
    returns:
      type: float
      unit: s
    description: "Channel delay between relay closure and measurement"

  channel_delay_auto:
    getter: "ROUT:CHAN:DEL:AUTO? (@{channels})"
    setter: "ROUT:CHAN:DEL:AUTO {state},(@{channels})"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
      channels:
        type: string
    returns:
      type: bool
    description: "Enable/disable automatic channel delay"

  channel_advance_source:
    getter: "ROUT:CHAN:ADV:SOUR?"
    setter: "ROUT:CHAN:ADV:SOUR {source}"
    type: property
    params:
      source:
        type: enum
        options: ["IMM", "EXT"]
    returns:
      type: string
    description: "Channel advance source for external scanning"

  channel_fwire:
    getter: "ROUT:CHAN:FWIR? (@{channels})"
    setter: "ROUT:CHAN:FWIR {state},(@{channels})"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
      channels:
        type: string
    returns:
      type: bool
    description: "Enable/disable 4-wire external scanning"

  route_monitor:
    getter: "ROUT:MON?"
    setter: "ROUT:MON (@{channel})"
    type: property
    params:
      channel:
        type: string
    returns:
      type: string
    description: "Select channel to monitor"

  route_monitor_state:
    getter: "ROUT:MON:STAT?"
    setter: "ROUT:MON:STAT {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable monitor function"

  route_monitor_data:
    scpi: "ROUT:MON:DATA?"
    type: query
    returns:
      type: float
    description: "Read monitor data from selected channel"

  trigger_source:
    getter: "TRIG:SOUR?"
    setter: "TRIG:SOUR {source}"
    type: property
    params:
      source:
        type: enum
        options: ["IMM", "EXT", "BUS", "TIM", "ALARM1", "ALARM2", "ALARM3", "ALARM4"]
    returns:
      type: string
    description: "Trigger source for scan"

  trigger_count:
    getter: "TRIG:COUN?"
    setter: "TRIG:COUN {count}"
    type: property
    params:
      count:
        type: int
        min: 1
        max: 50000
    returns:
      type: int
    description: "Trigger count (number of scan sweeps)"

  trigger_count_infinite:
    scpi: "TRIG:COUN INF"
    type: write
    description: "Set trigger count to infinite (continuous scanning)"

  trigger_timer:
    getter: "TRIG:TIM?"
    setter: "TRIG:TIM {interval}"
    type: property
    params:
      interval:
        type: float
        unit: s
        min: 0
        max: 359999
    returns:
      type: float
      unit: s
    description: "Trigger timer interval for interval scanning"

  trigger_delay:
    getter: "TRIG:DEL?"
    setter: "TRIG:DEL {delay}"
    type: property
    params:
      delay:
        type: float
        unit: s
        min: 0
        max: 3600
    returns:
      type: float
      unit: s
    description: "Trigger delay"

  sense_function:
    getter: "SENS:FUNC? (@{channels})"
    setter: "SENS:FUNC \"{function}\",(@{channels})"
    type: property
    params:
      function:
        type: enum
        options: ["VOLT:DC", "VOLT:AC", "CURR:DC", "CURR:AC", "RES", "FRES", "FREQ", "PER", "TEMP"]
      channels:
        type: string
    returns:
      type: string
    description: "Select measurement function"

  sense_voltage_dc_range:
    getter: "SENS:VOLT:DC:RANG? (@{channels})"
    setter: "SENS:VOLT:DC:RANG {range},(@{channels})"
    type: property
    params:
      range:
        type: float
        unit: V
        min: 0.1
        max: 300
      channels:
        type: string
    returns:
      type: float
      unit: V
    description: "DC voltage measurement range"

  sense_voltage_dc_range_auto:
    getter: "SENS:VOLT:DC:RANG:AUTO? (@{channels})"
    setter: "SENS:VOLT:DC:RANG:AUTO {state},(@{channels})"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
      channels:
        type: string
    returns:
      type: bool
    description: "Enable/disable DC voltage auto-ranging"

  sense_voltage_dc_nplc:
    getter: "SENS:VOLT:DC:NPLC? (@{channels})"
    setter: "SENS:VOLT:DC:NPLC {nplc},(@{channels})"
    type: property
    params:
      nplc:
        type: float
        min: 0.02
        max: 200
        default: 1.0
      channels:
        type: string
    returns:
      type: float
    description: "DC voltage integration time in power line cycles"

  sense_voltage_dc_resolution:
    getter: "SENS:VOLT:DC:RES? (@{channels})"
    setter: "SENS:VOLT:DC:RES {resolution},(@{channels})"
    type: property
    params:
      resolution:
        type: float
        unit: V
      channels:
        type: string
    returns:
      type: float
      unit: V
    description: "DC voltage resolution"

  sense_voltage_ac_range:
    getter: "SENS:VOLT:AC:RANG? (@{channels})"
    setter: "SENS:VOLT:AC:RANG {range},(@{channels})"
    type: property
    params:
      range:
        type: float
        unit: V
        min: 0.1
        max: 300
      channels:
        type: string
    returns:
      type: float
      unit: V
    description: "AC voltage measurement range"

  sense_voltage_ac_range_auto:
    getter: "SENS:VOLT:AC:RANG:AUTO? (@{channels})"
    setter: "SENS:VOLT:AC:RANG:AUTO {state},(@{channels})"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
      channels:
        type: string
    returns:
      type: bool
    description: "Enable/disable AC voltage auto-ranging"

  sense_voltage_ac_bandwidth:
    getter: "SENS:VOLT:AC:BAND? (@{channels})"
    setter: "SENS:VOLT:AC:BAND {frequency},(@{channels})"
    type: property
    params:
      frequency:
        type: float
        unit: Hz
        min: 3
        max: 300000
      channels:
        type: string
    returns:
      type: float
      unit: Hz
    description: "AC voltage low frequency filter setting"

  sense_current_dc_range:
    getter: "SENS:CURR:DC:RANG? (@{channels})"
    setter: "SENS:CURR:DC:RANG {range},(@{channels})"
    type: property
    params:
      range:
        type: float
        unit: A
        min: 0.01
        max: 1
      channels:
        type: string
    returns:
      type: float
      unit: A
    description: "DC current measurement range"

  sense_current_dc_range_auto:
    getter: "SENS:CURR:DC:RANG:AUTO? (@{channels})"
    setter: "SENS:CURR:DC:RANG:AUTO {state},(@{channels})"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
      channels:
        type: string
    returns:
      type: bool
    description: "Enable/disable DC current auto-ranging"

  sense_current_dc_nplc:
    getter: "SENS:CURR:DC:NPLC? (@{channels})"
    setter: "SENS:CURR:DC:NPLC {nplc},(@{channels})"
    type: property
    params:
      nplc:
        type: float
        min: 0.02
        max: 200
        default: 1.0
      channels:
        type: string
    returns:
      type: float
    description: "DC current integration time in power line cycles"

  sense_current_ac_range:
    getter: "SENS:CURR:AC:RANG? (@{channels})"
    setter: "SENS:CURR:AC:RANG {range},(@{channels})"
    type: property
    params:
      range:
        type: float
        unit: A
        min: 0.01
        max: 1
      channels:
        type: string
    returns:
      type: float
      unit: A
    description: "AC current measurement range"

  sense_current_ac_range_auto:
    getter: "SENS:CURR:AC:RANG:AUTO? (@{channels})"
    setter: "SENS:CURR:AC:RANG:AUTO {state},(@{channels})"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
      channels:
        type: string
    returns:
      type: bool
    description: "Enable/disable AC current auto-ranging"

  sense_current_ac_bandwidth:
    getter: "SENS:CURR:AC:BAND? (@{channels})"
    setter: "SENS:CURR:AC:BAND {frequency},(@{channels})"
    type: property
    params:
      frequency:
        type: float
        unit: Hz
        min: 3
        max: 300000
      channels:
        type: string
    returns:
      type: float
      unit: Hz
    description: "AC current low frequency filter setting"

  sense_resistance_range:
    getter: "SENS:RES:RANG? (@{channels})"
    setter: "SENS:RES:RANG {range},(@{channels})"
    type: property
    params:
      range:
        type: float
        unit: Ohm
        min: 100
        max: 100000000
      channels:
        type: string
    returns:
      type: float
      unit: Ohm
    description: "2-wire resistance measurement range"

  sense_resistance_range_auto:
    getter: "SENS:RES:RANG:AUTO? (@{channels})"
    setter: "SENS:RES:RANG:AUTO {state},(@{channels})"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
      channels:
        type: string
    returns:
      type: bool
    description: "Enable/disable 2-wire resistance auto-ranging"

  sense_resistance_nplc:
    getter: "SENS:RES:NPLC? (@{channels})"
    setter: "SENS:RES:NPLC {nplc},(@{channels})"
    type: property
    params:
      nplc:
        type: float
        min: 0.02
        max: 200
        default: 1.0
      channels:
        type: string
    returns:
      type: float
    description: "2-wire resistance integration time in power line cycles"

  sense_resistance_offset_compensated:
    getter: "SENS:RES:OCOM? (@{channels})"
    setter: "SENS:RES:OCOM {state},(@{channels})"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
      channels:
        type: string
    returns:
      type: bool
    description: "Enable/disable offset-compensated resistance measurement"

  sense_fresistance_range:
    getter: "SENS:FRES:RANG? (@{channels})"
    setter: "SENS:FRES:RANG {range},(@{channels})"
    type: property
    params:
      range:
        type: float
        unit: Ohm
        min: 100
        max: 100000000
      channels:
        type: string
    returns:
      type: float
      unit: Ohm
    description: "4-wire resistance measurement range"

  sense_fresistance_range_auto:
    getter: "SENS:FRES:RANG:AUTO? (@{channels})"
    setter: "SENS:FRES:RANG:AUTO {state},(@{channels})"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
      channels:
        type: string
    returns:
      type: bool
    description: "Enable/disable 4-wire resistance auto-ranging"

  sense_fresistance_nplc:
    getter: "SENS:FRES:NPLC? (@{channels})"
    setter: "SENS:FRES:NPLC {nplc},(@{channels})"
    type: property
    params:
      nplc:
        type: float
        min: 0.02
        max: 200
        default: 1.0
      channels:
        type: string
    returns:
      type: float
    description: "4-wire resistance integration time in power line cycles"

  sense_fresistance_offset_compensated:
    getter: "SENS:FRES:OCOM? (@{channels})"
    setter: "SENS:FRES:OCOM {state},(@{channels})"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
      channels:
        type: string
    returns:
      type: bool
    description: "Enable/disable offset-compensated 4-wire resistance measurement"

  sense_temperature_transducer_tc_type:
    getter: "SENS:TEMP:TRAN:TC:TYPE? (@{channels})"
    setter: "SENS:TEMP:TRAN:TC:TYPE {type},(@{channels})"
    type: property
    params:
      type:
        type: enum
        options: ["B", "E", "J", "K", "N", "R", "S", "T"]
      channels:
        type: string
    returns:
      type: string
    description: "Thermocouple type"

  sense_temperature_transducer_tc_rjunction_type:
    getter: "SENS:TEMP:TRAN:TC:RJUN:TYPE? (@{channels})"
    setter: "SENS:TEMP:TRAN:TC:RJUN:TYPE {type},(@{channels})"
    type: property
    params:
      type:
        type: enum
        options: ["INT", "EXT", "FIX"]
      channels:
        type: string
    returns:
      type: string
    description: "Thermocouple reference junction type"

  sense_temperature_transducer_tc_rjunction:
    getter: "SENS:TEMP:TRAN:TC:RJUN? (@{channels})"
