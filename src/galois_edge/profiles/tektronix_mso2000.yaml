sequences:
  single_acquisition:
    description: "Perform single sequence acquisition"
    steps:
      - command: acquire_stop_after
        args:
          mode: "SEQuence"
      - command: acquire_state
        args:
          state: "RUN"
      - scpi: "*OPC?"
        capture: complete

  capture_waveform:
    description: "Capture and transfer waveform data"
    params:
      channel:
        type: int
        min: 1
        max: 4
    steps:
      - command: data_source
        args:
          source: "CH{channel}"
      - command: data_start
        args:
          point: "1"
      - scpi: "HORizontal:RECOrdlength?"
        capture: length
      - scpi: "DATa:STOP {length}"
      - command: data_encoding
        args:
          encoding: "RIBinary"
      - command: data_width
        args:
          bytes: "2"
      - scpi: "WFMOutpre?"
        capture: preamble
      - command: curve
        capture: waveform
    returns: waveform

  measure_frequency:
    description: "Measure signal frequency"
    params:
      channel:
        type: int
        min: 1
        max: 4
    steps:
      - command: measurement_immed_type
        args:
          type: "FREQuency"
      - command: measurement_immed_source1
        args:
          source: "CH{channel}"
      - command: measurement_immed_value
        capture: frequency
    returns: frequency

  measure_amplitude:
    description: "Measure signal amplitude"
    params:
      channel:
        type: int
        min: 1
        max: 4
    steps:
      - command: measurement_immed_type
        args:
          type: "AMPlitude"
      - command: measurement_immed_source1
        args:
          source: "CH{channel}"
      - command: measurement_immed_value
        capture: amplitude
    returns: amplitude

  setup_edge_trigger:
    description: "Configure edge trigger"
    params:
      channel:
        type: int
        min: 1
        max: 4
      level:
        type: float
        unit: V
      slope:
        type: string
        default: "RISe"
    steps:
      - command: trigger_type
        args:
          type: "EDGe"
      - command: trigger_edge_source
        args:
          source: "CH{channel}"
      - command: trigger_level
        args:
          voltage: "{level}"
      - command: trigger_edge_slope
        args:
          slope: "{slope}"
      - command: trigger_mode
        args:
          mode: "NORMal"

  screen_capture:
    description: "Capture screen image"
    params:
      filepath:
        type: string
    steps:
      - command: save_image
        args:
          filepath: "{filepath}"
      - scpi: "*OPC?"
        capture: complete

status:
  stb:
    bit4: MAV
    bit5: ESB
    bit6: RQS
  esr:
    bit0: OPC
    bit2: QYE
    bit3: DDE
    bit4: EXE
    bit5: CME
    bit6: URQ
    bit7: PON