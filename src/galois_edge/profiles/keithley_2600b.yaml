  system_line_frequency_auto:
    getter: ":SYST:LFR:AUTO?"
    setter: ":SYST:LFR:AUTO {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable automatic line frequency detection"

  system_preset:
    scpi: ":SYST:PRES"
    type: write
    description: "Return to system preset defaults"

  system_remote_sense:
    getter: ":SYST:RSEN?"
    setter: ":SYST:RSEN {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable 4-wire remote sensing"

  system_time:
    scpi: ":SYST:TIME?"
    type: query
    returns:
      type: float
      unit: s
    description: "Query system time"

  system_time_reset:
    scpi: ":SYST:TIME:RES"
    type: write
    description: "Reset system time to zero"

  system_time_reset_auto:
    getter: ":SYST:TIME:RES:AUTO?"
    setter: ":SYST:TIME:RES:AUTO {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable automatic time reset"

  system_version:
    scpi: ":SYST:VERS?"
    type: query
    returns:
      type: string
    description: "Query SCPI version compliance"

  status_measurement:
    scpi: ":STAT:MEAS?"
    type: query
    returns:
      type: int
    description: "Read measurement event register"

  status_operation:
    scpi: ":STAT:OPER?"
    type: query
    returns:
      type: int
    description: "Read operation event register"

  status_questionable:
    scpi: ":STAT:QUES?"
    type: query
    returns:
      type: int
    description: "Read questionable event register"

  status_preset:
    scpi: ":STAT:PRES"
    type: write
    description: "Reset status registers to default states"

sequences:
  iv_sweep:
    description: "Perform IV sweep - source voltage, measure current"
    params:
      start_v:
        type: float
        unit: V
      stop_v:
        type: float
        unit: V
      points:
        type: int
      compliance_i:
        type: float
        unit: A
        default: 0.1
    steps:
      - command: reset
      - command: source_function
        args:
          mode: "VOLT"
      - command: source_voltage_mode
        args:
          mode: "SWE"
      - command: source_voltage_start
        args:
          value: "{start_v}"
      - command: source_voltage_stop
        args:
          value: "{stop_v}"
      - command: source_sweep_points
        args:
          points: "{points}"
      - command: source_sweep_spacing
        args:
          spacing: "LIN"
      - command: sense_current_protection
        args:
          value: "{compliance_i}"
      - command: trigger_count
        args:
          count: "{points}"
      - command: format_elements
        args:
          elements: "VOLT,CURR"
      - command: output_state
        args:
          state: "ON"
      - command: trigger_initiate
      - scpi: "*WAI"
      - command: fetch
        capture: result
      - command: output_state
        args:
          state: "OFF"
    returns: result

  vi_sweep:
    description: "Perform VI sweep - source current, measure voltage"
    params:
      start_i:
        type: float
        unit: A
      stop_i:
        type: float
        unit: A
      points:
        type: int
      compliance_v:
        type: float
        unit: V
        default: 20
    steps:
      - command: reset
      - command: source_function
        args:
          mode: "CURR"
      - command: source_current_mode
        args:
          mode: "SWE"
      - command: source_current_start
        args:
          value: "{start_i}"
      - command: source_current_stop
        args:
          value: "{stop_i}"
      - command: source_sweep_points
        args:
          points: "{points}"
      - command: source_sweep_spacing
        args:
          spacing: "LIN"
      - command: sense_voltage_protection
        args:
          value: "{compliance_v}"
      - command: trigger_count
        args:
          count: "{points}"
      - command: format_elements
        args:
          elements: "VOLT,CURR"
      - command: output_state
        args:
          state: "ON"
      - command: trigger_initiate
      - scpi: "*WAI"
      - command: fetch
        capture: result
      - command: output_state
        args:
          state: "OFF"
    returns: result

  resistance_measurement:
    description: "Perform resistance measurement"
    params:
      current:
        type: float
        unit: A
        default: 0.001
      compliance:
        type: float
        unit: V
        default: 20
    steps:
      - command: reset
      - command: source_function
        args:
          mode: "CURR"
      - command: source_current
        args:
          value: "{current}"
      - command: sense_voltage_protection
        args:
          value: "{compliance}"
      - command: sense_function
        args:
          function: "RES"
      - command: format_elements
        args:
          elements: "RES"
      - command: output_state
        args:
          state: "ON"
      - command: read
        capture: resistance
      - command: output_state
        args:
          state: "OFF"
    returns: resistance

status:
  stb:
    bit0: MSB
    bit2: EAV
    bit3: QSB
    bit4: MAV
    bit5: ESB
    bit6: RQS
    bit7: OSB
  esr:
    bit0: OPC
    bit2: QYE
    bit3: DDE
    bit4: EXE
    bit5: CME
    bit6: URQ
    bit7: PON