  system_beeper_state:
    getter: ":SYST:BEEP:STAT?"
    setter: ":SYST:BEEP:STAT {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable beeper"

  system_clear:
    scpi: ":SYST:CLE"
    type: write
