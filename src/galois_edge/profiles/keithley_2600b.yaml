  system_error_all:
    scpi: ":SYST:ERR:ALL?"
    type: query
    returns:
      type: string
    description: "Read and clear all error messages"

  system_error_count:
    scpi: ":SYST:ERR:COUN?"
    type: query
    returns:
      type: int
    description: "Query number of errors in queue"

  system_line_frequency:
    getter: ":SYST:LFR?"
    setter: ":SYST:LFR {frequency}"
    type: property
    params:
      frequency:
        type: enum
        options: ["50", "60"]
    returns:
