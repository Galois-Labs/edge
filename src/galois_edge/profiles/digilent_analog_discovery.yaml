# Digilent Analog Discovery
# Multi-function USB instrument: oscilloscope, waveform generator,
# power supply, logic analyzer, pattern generator, digital I/O,
# protocol analyzers (UART, SPI, I2C).
# Driven via DWF SDK (dwfpy wrapper over libdwf.so).
#
# Physical pin mapping (2x15 header, flywire colors):
#   Scope Ch1: 1+ (orange) / 1- (orange-white)  = API channel 0
#   Scope Ch2: 2+ (blue)   / 2- (blue-white)    = API channel 1
#   WaveGen 1: W1 (yellow)                       = API channel 0
#   WaveGen 2: W2 (yellow-white)                 = API channel 1
#   Power:     V+ (red), V- (white)
#   Digital:   DIO 0-7 (top row), DIO 8-15 (bottom row)
#   Trigger:   T1 (top), T2 (bottom)
#   Ground:    4x GND (black)

instrument:
  manufacturer: "Digilent"
  model: "Analog Discovery"
  class: oscilloscope
  description: "Digilent Analog Discovery — scope, AWG, PSU, logic analyzer, pattern gen, UART/SPI/I2C"

sdk:
  package: "dwfpy"
  import_path: "galois_edge.sdk_wrappers.digilent_dwf_wrapper"
  class_name: "DigilentDwfClient"
  connect:
    method: "connect"
    args:
      serial_number: "{serial_number}"
    defaults:
      serial_number: ""
  disconnect:
    method: "disconnect"
  identity:
    method: "get_identity"
    pattern: "Digilent.*"

identity:
  query: "SDK_IDENTITY"
  pattern: "Digilent.*"

interfaces:
  - type: usb

settings:
  timeout_ms: 10000

commands:

  # -- Device Info -----------------------------------------------------------

  get_device_info:
    sdk_call:
      method: "get_device_info"
    type: query
    returns:
      type: string
    description: "Device capabilities as JSON (channels, buffer sizes, limits)"

  # -- Power Supply (V+ red wire, V- white wire) ----------------------------

  enable_positive_supply:
    sdk_call:
      method: "enable_positive_supply"
    type: write
    is_dangerous: true
    description: "Enable V+ supply rail (red wire)"

  disable_positive_supply:
    sdk_call:
      method: "disable_positive_supply"
    type: write
    description: "Disable V+ supply rail (red wire)"

  set_positive_supply_voltage:
    sdk_call:
      method: "set_positive_supply_voltage"
      args_map:
        value: "value"
    type: write
    params:
      value:
        type: float
        unit: V
        min: 0
        max: 5
        default: 5.0
        description: "V+ output voltage (red wire)"
    description: "Set V+ supply voltage (red wire, 0-5V)"

  get_positive_supply_voltage:
    sdk_call:
      method: "get_positive_supply_voltage"
    type: query
    returns:
      type: float
      unit: V
    streamable: true
    description: "Read V+ supply voltage (red wire)"

  get_positive_supply_current:
    sdk_call:
      method: "get_positive_supply_current"
    type: query
    returns:
      type: float
      unit: A
    streamable: true
    description: "Read V+ supply current (red wire)"

  enable_negative_supply:
    sdk_call:
      method: "enable_negative_supply"
    type: write
    is_dangerous: true
    description: "Enable V- supply rail (white wire)"

  disable_negative_supply:
    sdk_call:
      method: "disable_negative_supply"
    type: write
    description: "Disable V- supply rail (white wire)"

  set_negative_supply_voltage:
    sdk_call:
      method: "set_negative_supply_voltage"
      args_map:
        value: "value"
    type: write
    params:
      value:
        type: float
        unit: V
        min: -5
        max: 0
        default: -5.0
        description: "V- output voltage (white wire)"
    description: "Set V- supply voltage (white wire, 0 to -5V)"

  get_negative_supply_voltage:
    sdk_call:
      method: "get_negative_supply_voltage"
    type: query
    returns:
      type: float
      unit: V
    streamable: true
    description: "Read V- supply voltage (white wire)"

  get_negative_supply_current:
    sdk_call:
      method: "get_negative_supply_current"
    type: query
    returns:
      type: float
      unit: A
    streamable: true
    description: "Read V- supply current (white wire)"

  enable_supplies:
    sdk_call:
      method: "enable_supplies"
    type: write
    is_dangerous: true
    description: "Enable master supply switch (both V+ and V- rails)"

  disable_supplies:
    sdk_call:
      method: "disable_supplies"
    type: write
    description: "Disable master supply switch (both V+ and V- rails)"

  # -- System Monitor --------------------------------------------------------

  get_usb_voltage:
    sdk_call:
      method: "get_usb_voltage"
    type: query
    returns:
      type: float
      unit: V
    streamable: true
    description: "Read USB bus voltage (internal, ~5V)"

  get_usb_current:
    sdk_call:
      method: "get_usb_current"
    type: query
    returns:
      type: float
      unit: A
    streamable: true
    description: "Read USB bus current draw"

  get_temperature:
    sdk_call:
      method: "get_temperature"
    type: query
    returns:
      type: float
      unit: "°C"
    streamable: true
    description: "Read device internal temperature"

  # -- Oscilloscope (Ch1: 1+/1- orange, Ch2: 2+/2- blue) --------------------

  scope_acquire:
    sdk_call:
      method: "scope_acquire"
      args_map:
        channel: "channel"
        v_range: "v_range"
        samples: "samples"
        sample_rate: "sample_rate"
        trigger_level: "trigger_level"
        trigger_channel: "trigger_channel"
        offset: "offset"
        coupling: "coupling"
    type: query
    params:
      channel:
        type: int
        min: 0
        max: 1
        default: 0
        description: "0 = Ch1 pins 1+/1- (orange), 1 = Ch2 pins 2+/2- (blue)"
      v_range:
        type: float
        unit: V
        min: 0.01
        max: 50
        default: 5.0
        description: "Full-scale voltage range (e.g. 5.0 = +/-2.5V)"
      samples:
        type: int
        min: 16
        max: 8192
        default: 4096
        description: "Number of samples to acquire"
      sample_rate:
        type: float
        unit: Hz
        min: 1
        max: 100000000
        default: 1000000
        description: "Sample rate (max 100 MS/s)"
      trigger_level:
        type: float
        unit: V
        default: 0.0
        description: "Edge trigger level in volts"
      trigger_channel:
        type: int
        default: -1
        description: "Trigger source: 0 = Ch1, 1 = Ch2, -1 = auto (no trigger)"
      offset:
        type: float
        unit: V
        default: 0.0
        description: "DC offset applied to input"
      coupling:
        type: string
        default: "dc"
        options: ["dc", "ac"]
        description: "Input coupling mode"
    returns:
      type: string
    description: "Single-shot oscilloscope acquisition — returns JSON array of voltages"

  scope_measure_dc:
    sdk_call:
      method: "scope_measure_dc"
      args_map:
        channel: "channel"
        v_range: "v_range"
    type: query
    params:
      channel:
        type: int
        min: 0
        max: 1
        default: 0
        description: "0 = Ch1 pins 1+/1- (orange), 1 = Ch2 pins 2+/2- (blue)"
      v_range:
        type: float
        unit: V
        default: 5.0
        description: "Full-scale voltage range"
    returns:
      type: float
      unit: V
    streamable: true
    description: "Measure DC voltage on scope channel (mean of short acquisition)"

  scope_measure_peak_to_peak:
    sdk_call:
      method: "scope_measure_peak_to_peak"
      args_map:
        channel: "channel"
        v_range: "v_range"
        sample_rate: "sample_rate"
    type: query
    params:
      channel:
        type: int
        default: 0
        description: "0 = Ch1 pins 1+/1- (orange), 1 = Ch2 pins 2+/2- (blue)"
      v_range:
        type: float
        unit: V
        default: 5.0
        description: "Full-scale voltage range"
      sample_rate:
        type: float
        unit: Hz
        default: 1000000
        description: "Sample rate"
    returns:
      type: float
      unit: V
    description: "Measure peak-to-peak voltage on scope channel"

  scope_measure_rms:
    sdk_call:
      method: "scope_measure_rms"
      args_map:
        channel: "channel"
        v_range: "v_range"
        sample_rate: "sample_rate"
    type: query
    params:
      channel:
        type: int
        default: 0
        description: "0 = Ch1 pins 1+/1- (orange), 1 = Ch2 pins 2+/2- (blue)"
      v_range:
        type: float
        unit: V
        default: 5.0
        description: "Full-scale voltage range"
      sample_rate:
        type: float
        unit: Hz
        default: 1000000
        description: "Sample rate"
    returns:
      type: float
      unit: V
    description: "Measure RMS voltage on scope channel"

  scope_measure_frequency:
    sdk_call:
      method: "scope_measure_frequency"
      args_map:
        channel: "channel"
        v_range: "v_range"
        sample_rate: "sample_rate"
    type: query
    params:
      channel:
        type: int
        default: 0
        description: "0 = Ch1 pins 1+/1- (orange), 1 = Ch2 pins 2+/2- (blue)"
      v_range:
        type: float
        unit: V
        default: 5.0
        description: "Full-scale voltage range"
      sample_rate:
        type: float
        unit: Hz
        default: 10000000
        description: "Sample rate (use >= 10x signal frequency)"
    returns:
      type: float
      unit: Hz
    description: "Estimate signal frequency on scope channel via zero-crossing analysis"

  # -- Waveform Generator (W1: yellow wire, W2: yellow-white wire) -----------

  wavegen_setup:
    sdk_call:
      method: "wavegen_setup"
      args_map:
        channel: "channel"
        function: "function"
        frequency: "frequency"
        amplitude: "amplitude"
        offset: "offset"
        symmetry: "symmetry"
        phase: "phase"
    type: write
    params:
      channel:
        type: int
        min: 0
        max: 1
        default: 0
        description: "0 = W1 (yellow wire), 1 = W2 (yellow-white wire)"
      function:
        type: string
        default: "sine"
        options: ["dc", "sine", "square", "triangle", "ramp-up", "ramp-down", "noise", "pulse", "trapezium", "sine-power", "custom"]
        description: "Waveform shape"
      frequency:
        type: float
        unit: Hz
        min: 0
        max: 25000000
        default: 1000
        description: "Output frequency"
      amplitude:
        type: float
        unit: V
        min: 0
        max: 5
        default: 1.0
        description: "Peak amplitude (half of Vpp)"
      offset:
        type: float
        unit: V
        min: -5
        max: 5
        default: 0.0
        description: "DC offset voltage"
      symmetry:
        type: float
        min: 0
        max: 100
        default: 50.0
        description: "Duty cycle / symmetry (%)"
      phase:
        type: float
        min: 0
        max: 360
        default: 0.0
        description: "Phase offset (degrees)"
    description: "Configure and start waveform generator output"

  wavegen_dc:
    sdk_call:
      method: "wavegen_dc"
      args_map:
        channel: "channel"
        offset: "offset"
    type: write
    params:
      channel:
        type: int
        default: 0
        description: "0 = W1 (yellow wire), 1 = W2 (yellow-white wire)"
      offset:
        type: float
        unit: V
        min: -5
        max: 5
        default: 0.0
        description: "DC output voltage"
    description: "Output a DC voltage on waveform generator"

  wavegen_stop:
    sdk_call:
      method: "wavegen_stop"
      args_map:
        channel: "channel"
    type: write
    params:
      channel:
        type: int
        default: 0
        description: "0 = W1 (yellow wire), 1 = W2 (yellow-white wire)"
    description: "Stop waveform generator output"

  wavegen_custom:
    sdk_call:
      method: "wavegen_custom"
      args_map:
        channel: "channel"
        frequency: "frequency"
        amplitude: "amplitude"
        offset: "offset"
        data: "data"
    type: write
    params:
      channel:
        type: int
        default: 0
        description: "0 = W1 (yellow wire), 1 = W2 (yellow-white wire)"
      frequency:
        type: float
        unit: Hz
        default: 1000
        description: "Output frequency"
      amplitude:
        type: float
        unit: V
        default: 1.0
        description: "Peak amplitude"
      offset:
        type: float
        unit: V
        default: 0.0
        description: "DC offset"
      data:
        type: string
        description: "JSON array of normalized floats (-1.0 to 1.0) defining one cycle"
    description: "Output arbitrary waveform from custom sample data"

  # -- Logic Analyzer (DIO 0-15, 3.3V CMOS) ---------------------------------

  la_acquire:
    sdk_call:
      method: "la_acquire"
      args_map:
        sample_rate: "sample_rate"
        samples: "samples"
        sample_format: "sample_format"
        trigger_channel: "trigger_channel"
        trigger_edge: "trigger_edge"
    type: query
    params:
      sample_rate:
        type: float
        unit: Hz
        default: 10000000
        description: "Sample rate (max 100 MS/s)"
      samples:
        type: int
        min: 16
        max: 16384
        default: 4096
        description: "Number of samples to capture"
      sample_format:
        type: int
        default: 16
        options: ["8", "16", "32"]
        description: "Bits per sample (8=DIO0-7, 16=DIO0-15, 32=all+padding)"
      trigger_channel:
        type: int
        min: -1
        max: 15
        default: -1
        description: "Trigger on DIO pin N (-1 = no trigger, 0-15 = DIO pin)"
      trigger_edge:
        type: string
        default: "rising"
        options: ["rising", "falling"]
        description: "Trigger edge direction"
    returns:
      type: string
    description: "Logic analyzer acquisition — returns JSON {data: [bitmasks], sample_rate, sample_count}. Extract DIO pin N: (sample >> N) & 1"

  # -- Pattern Generator (DIO 0-15, 3.3V CMOS) ------------------------------

  patgen_clock:
    sdk_call:
      method: "patgen_clock"
      args_map:
        pin: "pin"
        frequency: "frequency"
        duty_cycle: "duty_cycle"
    type: write
    params:
      pin:
        type: int
        min: 0
        max: 15
        default: 0
        description: "DIO pin number (0-15)"
      frequency:
        type: float
        unit: Hz
        default: 1000
        description: "Clock frequency"
      duty_cycle:
        type: float
        min: 0
        max: 100
        default: 50.0
        description: "Duty cycle (%)"
    description: "Output clock signal on DIO pin"

  patgen_pulse:
    sdk_call:
      method: "patgen_pulse"
      args_map:
        pin: "pin"
        low_time: "low_time"
        high_time: "high_time"
        count: "count"
    type: write
    params:
      pin:
        type: int
        min: 0
        max: 15
        default: 0
        description: "DIO pin number (0-15)"
      low_time:
        type: float
        unit: s
        default: 0.001
        description: "Time output stays low"
      high_time:
        type: float
        unit: s
        default: 0.001
        description: "Time output stays high"
      count:
        type: int
        default: 0
        description: "Number of pulses (0 = infinite)"
    description: "Output pulse pattern on DIO pin"

  patgen_stop:
    sdk_call:
      method: "patgen_stop"
      args_map:
        pin: "pin"
    type: write
    params:
      pin:
        type: int
        min: 0
        max: 15
        default: 0
        description: "DIO pin number (0-15)"
    description: "Stop pattern generator on DIO pin"

  patgen_stop_all:
    sdk_call:
      method: "patgen_stop_all"
    type: write
    description: "Stop all pattern generator outputs (DIO 0-15)"

  # -- Digital I/O (DIO 0-15, 3.3V CMOS) ------------------------------------

  dio_write:
    sdk_call:
      method: "dio_write"
      args_map:
        pin: "pin"
        value: "value"
    type: write
    params:
      pin:
        type: int
        min: 0
        max: 15
        description: "DIO pin number (0-15)"
      value:
        type: int
        min: 0
        max: 1
        description: "Output level (0 = low, 1 = high/3.3V)"
    description: "Set DIO pin as output and write value"

  dio_read:
    sdk_call:
      method: "dio_read"
      args_map:
        pin: "pin"
    type: query
    params:
      pin:
        type: int
        default: -1
        description: "DIO pin number (0-15), or -1 to read all 16 pins as hex bitmask"
    returns:
      type: string
    description: "Read DIO pin state (single pin: 0/1, all: 0x0000-0xFFFF)"

  dio_bus_write:
    sdk_call:
      method: "dio_bus_write"
      args_map:
        mask: "mask"
        value: "value"
    type: write
    params:
      mask:
        type: int
        description: "16-bit bitmask selecting which DIO pins to set (bit 0 = DIO0, bit 15 = DIO15)"
      value:
        type: int
        description: "16-bit value for selected DIO pins (bit N = DIO N output level)"
    description: "Set multiple DIO pins simultaneously"

  # -- UART Protocol (uses DIO pins, 3.3V levels) ---------------------------

  uart_setup:
    sdk_call:
      method: "uart_setup"
      args_map:
        pin_rx: "pin_rx"
        pin_tx: "pin_tx"
        baud: "baud"
        data_bits: "data_bits"
        stop_bits: "stop_bits"
        parity: "parity"
    type: write
    params:
      pin_rx:
        type: int
        default: -1
        description: "DIO pin for UART RX (0-15, or -1 to skip RX)"
      pin_tx:
        type: int
        default: -1
        description: "DIO pin for UART TX (0-15, or -1 to skip TX)"
      baud:
        type: int
        default: 9600
        description: "Baud rate"
      data_bits:
        type: int
        default: 8
        description: "Data bits per frame"
      stop_bits:
        type: int
        default: 1
        description: "Stop bits"
      parity:
        type: string
        default: "n"
        options: ["n", "o", "e"]
        description: "Parity: n=none, o=odd, e=even"
    description: "Configure UART on DIO pins (3.3V logic levels)"

  uart_write:
    sdk_call:
      method: "uart_write"
      args_map:
        data: "data"
    type: write
    params:
      data:
        type: string
        description: "Hex-encoded bytes to transmit (e.g. '48656C6C6F' = Hello)"
    description: "Transmit bytes over UART TX pin"

  uart_read:
    sdk_call:
      method: "uart_read"
      args_map:
        buffer_size: "buffer_size"
    type: query
    params:
      buffer_size:
        type: int
        default: 8192
        description: "Max bytes to read"
    returns:
      type: string
    description: "Read buffered UART RX data (JSON: {data: hex_string, parity_errors: count})"

  # -- SPI Protocol (uses DIO pins, 3.3V levels) ----------------------------

  spi_setup:
    sdk_call:
      method: "spi_setup"
      args_map:
        pin_clock: "pin_clock"
        pin_mosi: "pin_mosi"
        pin_miso: "pin_miso"
        pin_select: "pin_select"
        frequency: "frequency"
        mode: "mode"
    type: write
    params:
      pin_clock:
        type: int
        default: 0
        description: "DIO pin for SPI clock (SCLK)"
      pin_mosi:
        type: int
        default: 1
        description: "DIO pin for SPI MOSI (master out)"
      pin_miso:
        type: int
        default: 2
        description: "DIO pin for SPI MISO (master in)"
      pin_select:
        type: int
        default: 3
        description: "DIO pin for SPI chip select (CS, active low)"
      frequency:
        type: float
        unit: Hz
        default: 1000000
        description: "SPI clock frequency"
      mode:
        type: int
        min: 0
        max: 3
        default: 0
        description: "SPI mode (0-3): CPOL/CPHA bit combination"
    description: "Configure SPI master on DIO pins (3.3V logic levels)"

  spi_write_read:
    sdk_call:
      method: "spi_write_read"
      args_map:
        data: "data"
        read_count: "read_count"
    type: query
    params:
      data:
        type: string
        description: "Hex-encoded bytes to transmit (e.g. '9F' for JEDEC ID)"
      read_count:
        type: int
        default: 0
        description: "Bytes to read back (0 = same as write length)"
    returns:
      type: string
    description: "Full-duplex SPI transfer with auto CS assert (JSON: {rx: hex_string})"

  # -- I2C Protocol (uses DIO pins, 3.3V levels, open-drain) ----------------

  i2c_setup:
    sdk_call:
      method: "i2c_setup"
      args_map:
        pin_scl: "pin_scl"
        pin_sda: "pin_sda"
        rate: "rate"
    type: write
    params:
      pin_scl:
        type: int
        default: 0
        description: "DIO pin for I2C clock (SCL)"
      pin_sda:
        type: int
        default: 1
        description: "DIO pin for I2C data (SDA)"
      rate:
        type: float
        unit: Hz
        default: 100000
        description: "I2C clock rate (100000=standard, 400000=fast)"
    description: "Configure I2C master on DIO pins (3.3V, open-drain with pull-ups)"

  i2c_write:
    sdk_call:
      method: "i2c_write"
      args_map:
        address: "address"
        data: "data"
    type: write
    params:
      address:
        type: int
        description: "7-bit I2C device address (0x00-0x7F)"
      data:
        type: string
        description: "Hex-encoded bytes to write (e.g. '00FF' = register 0x00, value 0xFF)"
    description: "Write bytes to I2C device"

  i2c_read:
    sdk_call:
      method: "i2c_read"
      args_map:
        address: "address"
        count: "count"
    type: query
    params:
      address:
        type: int
        description: "7-bit I2C device address (0x00-0x7F)"
      count:
        type: int
        default: 1
        description: "Number of bytes to read"
    returns:
      type: string
    description: "Read bytes from I2C device (JSON: {data: hex_string, nak: 0=ok})"

  i2c_write_read:
    sdk_call:
      method: "i2c_write_read"
      args_map:
        address: "address"
        data: "data"
        count: "count"
    type: query
    params:
      address:
        type: int
        description: "7-bit I2C device address (0x00-0x7F)"
      data:
        type: string
        description: "Hex-encoded bytes to write first (e.g. register address)"
      count:
        type: int
        default: 1
        description: "Number of bytes to read after write"
    returns:
      type: string
    description: "Combined I2C write-then-read (JSON: {data: hex_string, nak: 0=ok})"
