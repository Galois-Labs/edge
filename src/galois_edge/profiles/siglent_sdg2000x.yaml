instrument:
  manufacturer: "Siglent"
  model: "SDG2000X"
  class: function_generator
  description: "Function/Arbitrary Waveform Generator - Up to 120MHz, 2 channels, 1.2GSa/s, 16-bit"

identity:
  query: "*IDN?"
  pattern: "SIGLENT.*SDG2[0-1][0-9][0-9]X"

interfaces:
  - type: gpib
    default_address: 10
  - type: usb
  - type: ethernet
    port: 5025

settings:
  timeout_ms: 5000
  terminator: "\n"
  opc_query: true

commands:
  reset:
    scpi: "*RST"
    type: write
    description: "Reset instrument to factory default state"

  clear_status:
    scpi: "*CLS"
    type: write
    description: "Clear status registers and error queue"

  identify:
    scpi: "*IDN?"
    type: query
    returns:
      type: string
    description: "Query instrument identification"

  operation_complete:
    scpi: "*OPC"
    type: write
    description: "Set OPC bit in Standard Event Register after all pending operations complete"

  operation_complete_query:
    scpi: "*OPC?"
    type: query
    returns:
      type: int
    description: "Return '1' when all pending operations complete"

  self_test:
    scpi: "*TST?"
    type: query
    returns:
      type: int
    description: "Perform self-test (0 = pass)"

  wait:
    scpi: "*WAI"
    type: write
    description: "Wait for pending operations to complete"

  trigger:
    scpi: "*TRG"
    type: write
    description: "Send bus trigger"

  save_setup:
    scpi: "*SAV {location}"
    type: write
    params:
      location:
        type: int
        min: 0
        max: 4
    description: "Save present setup to memory location (0-4)"

  recall_setup:
    scpi: "*RCL {location}"
    type: write
    params:
      location:
        type: int
        min: 0
        max: 4
    description: "Recall setup from memory location (0-4)"

  output_state:
    getter: "C{channel}:OUTPut?"
    setter: "C{channel}:OUTPut {state}"
    type: property
    params:
      channel:
        type: int
        options: ["1", "2"]
        default: 1
      state:
        type: enum
        options: ["ON", "OFF"]
        map:
          "ON": 1
          "OFF": 0
    returns:
      type: bool
    description: "Turn channel output on or off"

  output_load:
    getter: "C{channel}:OUTPut:LOAD?"
    setter: "C{channel}:OUTPut:LOAD {value}"
    type: property
    params:
      channel:
        type: int
        options: ["1", "2"]
        default: 1
      value:
        type: float
        unit: Ohm
        min: 50
        max: 100000
    returns:
      type: float
      unit: Ohm
    description: "Output termination impedance (use HZ for high-Z)"

  output_polarity:
    getter: "C{channel}:OUTPut:POLarity?"
    setter: "C{channel}:OUTPut:POLarity {polarity}"
    type: property
    params:
      channel:
        type: int
        options: ["1", "2"]
        default: 1
      polarity:
        type: enum
        options: ["NORMal", "INVerted"]
    returns:
      type: string
    description: "Output waveform polarity"

  sync_output:
    getter: "OUTPut:SYNC?"
    setter: "OUTPut:SYNC {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF"]
    returns:
      type: string
    description: "Sync output signal on/off"

  function:
    getter: "C{channel}:BaSic_WaVe?"
    setter: "C{channel}:BaSic_WaVe {shape}"
    type: property
    params:
      channel:
        type: int
        options: ["1", "2"]
        default: 1
      shape:
        type: enum
        options: ["SINE", "SQUARE", "RAMP", "PULSE", "NOISE", "ARB", "DC"]
    returns:
      type: string
    description: "Output waveform function/shape"

  frequency:
    getter: "C{channel}:BaSic_WaVe:FReQuency?"
    setter: "C{channel}:BaSic_WaVe:FReQuency {value}"
    type: property
    params:
      channel:
        type: int
        options: ["1", "2"]
        default: 1
      value:
        type: float
        unit: Hz
        min: 0.000001
        max: 120000000
    returns:
      type: float
      unit: Hz
    description: "Output frequency"

  period:
    getter: "C{channel}:BaSic_WaVe:PeRiod?"
    setter: "C{channel}:BaSic_WaVe:PeRiod {value}"
    type: property
    params:
      channel:
        type: int
        options: ["1", "2"]
        default: 1
      value:
        type: float
        unit: s
    returns:
      type: float
      unit: s
    description: "Output period"

  amplitude:
    getter: "C{channel}:BaSic_WaVe:AMPLitude?"
    setter: "C{channel}:BaSic_WaVe:AMPLitude {value}"
    type: property
    params:
      channel:
        type: int
        options: ["1", "2"]
        default: 1
      value:
        type: float
        unit: Vpp
        min: 0.002
        max: 20
    returns:
