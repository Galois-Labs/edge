sequences:
  output_sine:
    description: "Configure and enable a sine wave output"
    params:
      channel:
        type: int
        options: ["1", "2"]
        default: 1
      frequency:
        type: float
        unit: Hz
      amplitude:
        type: float
        unit: Vpp
      offset:
        type: float
        unit: V
        default: 0
    steps:
      - scpi: "C{channel}:BaSic_WaVe SINE"
      - scpi: "C{channel}:BaSic_WaVe:FReQuency {frequency}"
      - scpi: "C{channel}:BaSic_WaVe:AMPLitude {amplitude}"
      - scpi: "C{channel}:BaSic_WaVe:OFFSet {offset}"
      - scpi: "C{channel}:OUTPut ON"

  output_square:
    description: "Configure and enable a square wave output"
    params:
      channel:
        type: int
        options: ["1", "2"]
        default: 1
      frequency:
        type: float
        unit: Hz
      amplitude:
        type: float
        unit: Vpp
      duty_cycle:
        type: float
        unit: "%"
        default: 50
    steps:
      - scpi: "C{channel}:BaSic_WaVe SQUARE"
      - scpi: "C{channel}:BaSic_WaVe:FReQuency {frequency}"
      - scpi: "C{channel}:BaSic_WaVe:AMPLitude {amplitude}"
      - scpi: "C{channel}:BaSic_WaVe:SQUare:DUTYcycle {duty_cycle}"
      - scpi: "C{channel}:OUTPut ON"

  output_pulse:
    description: "Configure and enable a pulse output"
    params:
      channel:
        type: int
        options: ["1", "2"]
        default: 1
      frequency:
        type: float
        unit: Hz
      amplitude:
        type: float
        unit: Vpp
      width:
        type: float
        unit: s
    steps:
      - scpi: "C{channel}:BaSic_WaVe PULSE"
      - scpi: "C{channel}:BaSic_WaVe:FReQuency {frequency}"
      - scpi: "C{channel}:BaSic_WaVe:AMPLitude {amplitude}"
      - scpi: "C{channel}:BaSic_WaVe:PULSe:WIDTh {width}"
      - scpi: "C{channel}:OUTPut ON"

  frequency_sweep:
    description: "Configure and run a frequency sweep"
    params:
      channel:
        type: int
        options: ["1", "2"]
        default: 1
      start_freq:
        type: float
        unit: Hz
      stop_freq:
        type: float
        unit: Hz
      sweep_time:
        type: float
        unit: s
      spacing:
        type: string
        default: "LINear"
    steps:
      - scpi: "C{channel}:BaSic_WaVe SINE"
      - scpi: "C{channel}:SWEep:FREQuency:STARt {start_freq}"
      - scpi: "C{channel}:SWEep:FREQuency:STOP {stop_freq}"
      - scpi: "C{channel}:SWEep:TIME {sweep_time}"
      - scpi: "C{channel}:SWEep:SPACing {spacing}"
      - scpi: "C{channel}:TRIGger:SOURce INTernal"
      - scpi: "C{channel}:SWEep:STATe ON"
      - scpi: "C{channel}:OUTPut ON"

  triggered_burst:
    description: "Configure triggered burst output"
    params:
      channel:
        type: int
        options: ["1", "2"]
        default: 1
      frequency:
        type: float
        unit: Hz
      amplitude:
        type: float
        unit: Vpp
      ncycles:
        type: int
      burst_period:
        type: float
        unit: s
    steps:
      - scpi: "C{channel}:BaSic_WaVe SINE"
      - scpi: "C{channel}:BaSic_WaVe:FReQuency {frequency}"
      - scpi: "C{channel}:BaSic_WaVe:AMPLitude {amplitude}"
      - scpi: "C{channel}:BuRSt:MODE TRIG"
      - scpi: "C{channel}:BuRSt:NCYCles {ncycles}"
      - scpi: "C{channel}:BuRSt:INTernal:PERiod {burst_period}"
      - scpi: "C{channel}:TRIGger:SOURce INTernal"
      - scpi: "C{channel}:BuRSt:STATe ON"
      - scpi: "C{channel}:OUTPut ON"

  stop_output:
    description: "Disable output and reset modulations"
    params:
      channel:
        type: int
        options: ["1", "2"]
        default: 1
    steps:
      - scpi: "C{channel}:OUTPut OFF"
      - scpi: "C{channel}:SWEep:STATe OFF"
      - scpi: "C{channel}:BuRSt:STATe OFF"
      - scpi: "C{channel}:MDWV:AM:STATe OFF"
      - scpi: "C{channel}:MDWV:FM:STATe OFF"

status:
  stb:
    bit4: MAV
    bit5: ESB
    bit6: RQS
  esr:
    bit0: OPC
    bit2: QYE
    bit3: DDE
    bit4: EXE
    bit5: CME
    bit7: PON