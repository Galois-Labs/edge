instrument:
  manufacturer: "Rigol"
  model: "DSA800"
  class: spectrum_analyzer
  description: "DSA800 Series Spectrum Analyzer (DSA815/DSA832/DSA875) - 9 kHz to 7.5 GHz"

identity:
  query: "*IDN?"
  pattern: "RIGOL Technologies,DSA8[0-9]{2}"

interfaces:
  - type: gpib
    default_address: 18
  - type: usb
  - type: ethernet
    port: 5025
  - type: serial
    port: 9600

settings:
  timeout_ms: 5000
  terminator: "\n"
  opc_query: false

commands:
  # IEEE 488.2 Common Commands
  reset:
    scpi: "*RST"
    type: write
    description: "Reset instrument to factory default state"

  clear_status:
    scpi: "*CLS"
    type: write
    description: "Clear all event registers and error queue"

  identify:
    scpi: "*IDN?"
    type: query
    returns:
      type: string
    description: "Query instrument identification"

  operation_complete:
    scpi: "*OPC"
    type: write
    description: "Set operation complete bit in standard event register"

  operation_complete_query:
    scpi: "*OPC?"
    type: query
    returns:
      type: int
    description: "Query operation complete status"

  self_test:
    scpi: "*TST?"
    type: query
    returns:
      type: int
    description: "Perform self-test (0 = pass)"

  trigger:
    scpi: "*TRG"
    type: write
    description: "Send bus trigger"

  wait:
    scpi: "*WAI"
    type: write
    description: "Wait for pending operations to complete"

  save_setup:
    scpi: "*SAV {location}"
    type: write
    params:
      location:
        type: int
        min: 0
        max: 4
    description: "Save present setup to memory location"

  recall_setup:
    scpi: "*RCL {location}"
    type: write
    params:
      location:
        type: int
        min: 0
        max: 4
    description: "Recall setup from memory location"

  event_status_enable:
    getter: "*ESE?"
    setter: "*ESE {mask}"
    type: property
    params:
      mask:
        type: int
        min: 0
        max: 255
    returns:
      type: int
    description: "Event status enable register"

  event_status_register:
    scpi: "*ESR?"
    type: query
    returns:
      type: int
    description: "Read and clear event status register"

  service_request_enable:
    getter: "*SRE?"
    setter: "*SRE {mask}"
    type: property
    params:
      mask:
        type: int
        min: 0
        max: 255
    returns:
      type: int
    description: "Service request enable register"

  status_byte:
    scpi: "*STB?"
    type: query
    returns:
      type: int
    description: "Read status byte register"

  # Abort
  abort:
    scpi: ":ABORt"
    type: write
    description: "Abort current operation and restart sweep"

  # Calculate Subsystem - Bandwidth
  bandwidth_ndb:
    getter: ":CALCulate:BANDwidth:NDB?"
    setter: ":CALCulate:BANDwidth:NDB {rel_ampl}"
    type: property
    params:
      rel_ampl:
        type: float
        unit: dB
        min: -100
        max: 100
        default: -3
    returns:
      type: float
      unit: dB
    description: "N dB bandwidth measurement value"

  bandwidth_result:
    scpi: ":CALCulate:BANDwidth:RESult?"
    type: query
    returns:
      type: int
      unit: Hz
    description: "Query N dB bandwidth measurement result"

  # Calculate Subsystem - Limit Lines
  limit_line_delete_all:
    scpi: ":CALCulate:LLINe:ALL:DELete"
    type: write
    description: "Delete all limit lines"

  limit_line_domain:
    getter: ":CALCulate:LLINe:CONTrol:DOMain?"
    setter: ":CALCulate:LLINe:CONTrol:DOMain {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["FREQuency", "TIME"]
        default: "FREQuency"
    returns:
      type: string
    description: "X axis type for Pass/Fail test"

  limit_line_fail:
    scpi: ":CALCulate:LLINe:FAIL?"
    type: query
    returns:
      type: string
    description: "Query Pass/Fail test result"

  limit_line_fail_ratio:
    scpi: ":CALCulate:LLINe:FAIL:RATIo?"
    type: query
    returns:
      type: float
    description: "Query fail ratio of Pass/Fail test"

  limit_line_fail_stop_state:
    getter: ":CALCulate:LLINe:FAIL:STOP:STATe?"
    setter: ":CALCulate:LLINe:FAIL:STOP:STATe {state}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON", "0", "1"]
        default: "ON"
    returns:
      type: bool
    description: "Stop test if test fails"

  # Calculate Subsystem - Markers
  marker_all_off:
    scpi: ":CALCulate:MARKer:AOFF"
    type: write
    description: "Disable all markers and marker functions"

  marker_freq_counter_resolution:
    getter: ":CALCulate:MARKer:FCOunt:RESolution?"
    setter: ":CALCulate:MARKer:FCOunt:RESolution {freq}"
    type: property
    params:
      freq:
        type: enum
        options: ["1", "10", "100", "1000", "10000", "100000"]
        unit: Hz
        default: "1000"
    returns:
      type: int
      unit: Hz
    description: "Frequency counter resolution"

  marker_freq_counter_resolution_auto:
    getter: ":CALCulate:MARKer:FCOunt:RESolution:AUTO?"
    setter: ":CALCulate:MARKer:FCOunt:RESolution:AUTO {state}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON", "0", "1"]
        default: "ON"
    returns:
      type: bool
    description: "Auto frequency counter resolution"

  marker_freq_counter_value:
    scpi: ":CALCulate:MARKer:FCOunt:X?"
    type: query
    returns:
      type: int
      unit: Hz
    description: "Query frequency counter reading"

  marker_freq_counter_state:
    getter: ":CALCulate:MARKer:FCOunt[:STATe]?"
    setter: ":CALCulate:MARKer:FCOunt[:STATe] {state}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON", "0", "1"]
        default: "OFF"
    returns:
      type: bool
    description: "Enable/disable frequency counter"

  marker_continuous_peak:
    getter: ":CALCulate:MARKer1:CPEak[:STATe]?"
    setter: ":CALCulate:MARKer1:CPEak[:STATe] {state}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON", "0", "1"]
        default: "OFF"
    returns:
      type: bool
    description: "Enable continuous peak search for marker 1"

  marker_delta_set_center:
    scpi: ":CALCulate:MARKer1:DELTa[:SET]:CENTer"
    type: write
    description: "Set center frequency to marker delta frequency"

  marker_delta_set_span:
    scpi: ":CALCulate:MARKer1:DELTa[:SET]:SPAN"
    type: write
    description: "Set span to marker delta frequency"

  marker_function:
    getter: ":CALCulate:MARKer1:FUNCtion?"
    setter: ":CALCulate:MARKer1:FUNCtion {function}"
    type: property
    params:
      function:
        type: enum
        options: ["NDB", "NOISe", "OFF"]
        default: "OFF"
    returns:
      type: string
    description: "Marker special measurement type"

  marker_peak_left:
    scpi: ":CALCulate:MARKer1:MAXimum:LEFT"
    type: write
    description: "Search peak to left of current marker"

  marker_peak_maximum:
    scpi: ":CALCulate:MARKer1:MAXimum:MAX"
    type: write
    description: "Execute peak search and mark with marker"

  marker_peak_next:
    scpi: ":CALCulate:MARKer1:MAXimum:NEXT"
    type: write
    description: "Search next peak"

  marker_peak_right:
    scpi: ":CALCulate:MARKer1:MAXimum:RIGHt"
    type: write
    description: "Search peak to right of current marker"

  marker_minimum:
    scpi: ":CALCulate:MARKer1:MINimum"
    type: write
    description: "Search minimum on trace"

  marker_mode:
    getter: ":CALCulate:MARKer1:MODE?"
    setter: ":CALCulate:MARKer1:MODE {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["POSition", "DELTa", "BAND", "SPAN"]
        default: "POSition"
    returns:
      type: string
    description: "Marker type (Normal/Delta/Delta Pair/Span Pair)"

  marker_peak_excursion:
    getter: ":CALCulate:MARKer1:PEAK:EXCursion?"
    setter: ":CALCulate:MARKer1:PEAK:EXCursion {rel_ampl}"
    type: property
    params:
      rel_ampl:
        type: float
        unit: dB
        min: 0
        max: 200
        default: 10
    returns:
      type: float
      unit: dB
    description: "Peak excursion for peak search"

  marker_peak_search_mode:
    getter: ":CALCulate:MARKer1:PEAK:SEARch:MODE?"
    setter: ":CALCulate:MARKer1:PEAK:SEARch:MODE {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["PARameter", "MAXimum"]
        default: "MAXimum"
    returns:
      type: string
    description: "Peak search mode"

  marker_peak_set_cf:
    scpi: ":CALCulate:MARKer1:PEAK[:SET]:CF"
    type: write
    description: "Peak search and set CF to peak frequency"

  marker_peak_threshold:
    getter: ":CALCulate:MARKer1:PEAK:THReshold?"
    setter: ":CALCulate:MARKer1:PEAK:THReshold {ampl}"
    type: property
    params:
      ampl:
        type: float
        unit: dBm
        min: -200
        max: 0
        default: -90
    returns:
      type: float
      unit: dBm
    description: "Peak threshold"

  marker_peak_to_peak:
    scpi: ":CALCulate:MARKer1:PTPeak"
    type: write
    description: "Execute peak-to-peak search"

  marker_set_center:
    scpi: ":CALCulate:MARKer1[:SET]:CENTer"
    type: write
    description: "Set center frequency to marker frequency"

  marker_set_ref_level:
    scpi: ":CALCulate:MARKer1[:SET]:RLEVel"
    type: write
    description: "Set reference level to marker amplitude"

  marker_set_start:
    scpi: ":CALCulate:MARKer1[:SET]:STARt"
    type: write
    description: "Set start frequency to marker frequency"

  marker_set_step:
    scpi: ":CALCulate:MARKer1[:SET]:STEP"
    type: write
    description: "Set center frequency step to marker frequency"

  marker_set_stop:
    scpi: ":CALCulate:MARKer1[:SET]:STOP"
    type: write
    description: "Set stop frequency to marker frequency"

  marker_state:
    getter: ":CALCulate:MARKer1:STATe?"
    setter: ":CALCulate:MARKer1:STATe {state}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON", "0", "1"]
        default: "OFF"
    returns:
      type: bool
    description: "Enable/disable marker"

  marker_trace:
    getter: ":CALCulate:MARKer1:TRACe?"
    setter: ":CALCulate:MARKer1:TRACe {trace}"
    type: property
    params:
      trace:
        type: enum
        options: ["1", "2", "3", "4"]
        default: "1"
    returns:
      type: int
    description: "Marker trace selection"

  marker_trace_auto:
    getter: ":CALCulate:MARKer1:TRACe:AUTO?"
    setter: ":CALCulate:MARKer1:TRACe:AUTO {state}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON", "0", "1"]
        default: "ON"
    returns:
      type: bool
    description: "Auto marker trace selection"

  marker_x:
    getter: ":CALCulate:MARKer1:X?"
    setter: ":CALCulate:MARKer1:X {value}"
    type: property
    params:
      value:
        type: float
        unit: Hz
    returns:
      type: float
      unit: Hz
    description: "Marker X-axis value"

  marker_x_center:
    getter: ":CALCulate:MARKer1:X:CENTer?"
    setter: ":CALCulate:MARKer1:X:CENTer {value}"
    type: property
    params:
      value:
        type: float
        unit: Hz
    returns:
      type: float
      unit: Hz
    description: "Span Pair marker X-axis center value"

  marker_x_position:
    getter: ":CALCulate:MARKer1:X:POSition?"
    setter: ":CALCulate:MARKer1:X:POSition {position}"
    type: property
    params:
      position:
        type: int
        min: 0
        max: 600
        default: 300
    returns:
      type: int
    description: "Normal marker position"

  marker_x_readout:
    getter: ":CALCulate:MARKer1:X:READout?"
    setter: ":CALCulate:MARKer1:X:READout {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["FREQuency", "TIME", "ITIMe", "PERiod"]
    returns:
      type: string
    description: "Marker X-axis readout mode"

  marker_y:
    scpi: ":CALCulate:MARKer1:Y?"
    type: query
    returns:
      type: float
      unit: dBm
    description: "Query marker Y-axis value"

  marker_table_state:
    getter: ":CALCulate:MARKer:TABLe:STATe?"
    setter: ":CALCulate:MARKer:TABLe:STATe {state}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON", "0", "1"]
        default: "OFF"
    returns:
      type: bool
    description: "Enable/disable marker table"

  marker_tracking_state:
    getter: ":CALCulate:MARKer:TRACking:STATe?"
    setter: ":CALCulate:MARKer:TRACking:STATe {state}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON", "0", "1"]
        default: "OFF"
    returns:
      type: bool
    description: "Enable/disable signal track"

  normalization_state:
    getter: ":CALCulate:NTData[:STATe]?"
    setter: ":CALCulate:NTData[:STATe] {state}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON", "0", "1"]
        default: "OFF"
    returns:
      type: bool
    description: "Enable/disable normalization (tracking generator)"
    enabled: false

  # Calibration Subsystem
  calibration_all:
    scpi: ":CALibration:[ALL]"
    type: write
    description: "Execute self-calibration immediately"

  calibration_auto:
    getter: ":CALibration:AUTO?"
    setter: ":CALibration:AUTO {state}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON", "0", "1"]
        default: "ON"
    returns:
      type: bool
    description: "Enable/disable auto calibration"

  # Configure Subsystem
  configure_query:
    scpi: ":CONFigure?"
    type: query
    returns:
      type: string
    description: "Query current measurement function"

  configure_spectrum_analyzer:
    scpi: ":CONFigure:SANalyzer"
    type: write
    description: "Set to sweep mode"

  configure_pass_fail:
    scpi: ":CONFigure:PF"
    type: write
    description: "Enable Pass/Fail test"

  # Couple Subsystem
  couple:
    getter: ":COUPle?"
    setter: ":COUPle {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["ALL", "NONE"]
        default: "ALL"
    returns:
      type: string
    description: "Coupling linked setting"

  # Display Subsystem
  display_active_function_position:
    getter: ":DISPlay:AFUnction:POSition?"
    setter: ":DISPlay:AFUnction:POSition {position}"
    type: property
    params:
      position:
        type: enum
        options: ["BOTTom", "CENTer", "TOP"]
        default: "TOP"
    returns:
      type: string
    description: "Active function area position"

  display_clock_state:
    getter: ":DISPlay:ANNotation:CLOCk[:STATe]?"
    setter: ":DISPlay:ANNotation:CLOCk[:STATe] {state}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON", "0", "1"]
        default: "ON"
    returns:
      type: bool
    description: "Display time and date"

  display_brightness:
    getter: ":DISPlay:BRIGhtness?"
    setter: ":DISPlay:BRIGhtness {level}"
    type: property
    params:
      level:
        type: int
        min: 1
        max: 10
        default: 2
    returns:
      type: int
    description: "Screen brightness"

  display_enable:
    getter: ":DISPlay:ENABle?"
    setter: ":DISPlay:ENABle {state}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON", "0", "1"]
        default: "ON"
    returns:
      type: bool
    description: "Screen on/off state"

  display_message_switch:
    getter: ":DISPlay:MSGswitch:STATe?"
    setter: ":DISPlay:MSGswitch:STATe {state}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON", "0", "1"]
        default: "ON"
    returns:
      type: bool
    description: "Enable/disable message display"

  display_grid_brightness:
    getter: ":DISPlay:WINdow:TRACe:GRATicule:GRID?"
    setter: ":DISPlay:WINdow:TRACe:GRATicule:GRID {level}"
    type: property
    params:
      level:
        type: int
        min: 0
        max: 10
        default: 3
    returns:
      type: int
    description: "Screen grid brightness"

  display_x_scale_spacing:
    getter: ":DISPlay:WINdow:TRACe:X[:SCALe]:SPACing?"
    setter: ":DISPlay:WINdow:TRACe:X[:SCALe]:SPACing {spacing}"
    type: property
    params:
      spacing:
        type: enum
        options: ["LINear", "LOGarithmic"]
        default: "LINear"
    returns:
      type: string
    description: "X-axis scale type"

  display_line:
    getter: ":DISPlay:WINdow:TRACe:Y:DLINe?"
    setter: ":DISPlay:WINdow:TRACe:Y:DLINe {ampl}"
    type: property
    params:
      ampl:
        type: float
        unit: dBm
        default: 0
    returns:
      type: float
      unit: dBm
    description: "Display line position"

  display_line_state:
    getter: ":DISPlay:WINdow:TRACe:Y:DLINe:STATe?"
    setter: ":DISPlay:WINdow:TRACe:Y:DLINe:STATe {state}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON", "0", "1"]
        default: "OFF"
    returns:
      type: bool
    description: "Enable/disable display line"

  display_y_scale_per_division:
    getter: ":DISPlay:WINdow:TRACe:Y[:SCALe]:PDIVision?"
    setter: ":DISPlay:WINdow:TRACe:Y[:SCALe]:PDIVision {rel_ampl}"
    type: property
    params:
      rel_ampl:
        type: float
        unit: dB
        min: 0.1
        max: 20
        default: 10
    returns:
      type: float
      unit: dB
    description: "Y-axis scale per division"

  reference_level:
    getter: ":DISPlay:WINdow:TRACe:Y[:SCALe]:RLEVel?"
    setter: ":DISPlay:WINdow:TRACe:Y[:SCALe]:RLEVel {ampl}"
    type: property
    params:
      ampl:
        type: float
        unit: dBm
        min: -100
        max: 20
        default: 0
    returns:
      type: float
      unit: dBm
    description: "Reference level"

  reference_level_offset:
    getter: ":DISPlay:WINdow:TRACe:Y[:SCALe]:RLEVel:OFFSet?"
    setter: ":DISPlay:WINdow:TRACe:Y[:SCALe]:RLEVel:OFFSet {rel_ampl}"
    type: property
    params:
      rel_ampl:
        type: float
        unit: dB
        min: -300
        max: 300
        default: 0
    returns:
      type: float
      unit: dB
    description: "Reference level offset"

  display_y_scale_spacing:
    getter: ":DISPlay:WINdow:TRACe:Y[:SCALe]:SPACing?"
    setter: ":DISPlay:WINdow:TRACe:Y[:SCALe]:SPACing {spacing}"
    type: property
    params:
      spacing:
        type: enum
        options: ["LINear", "LOGarithmic"]
        default: "LOGarithmic"
    returns:
      type: string
    description: "Y-axis scale type"

  # Format Subsystem
  format_border:
    getter: ":FORMat:BORDer?"
    setter: ":FORMat:BORDer {order}"
    type: property
    params:
      order:
        type: enum
        options: ["NORMal", "SWAPped"]
        default: "NORMal"
    returns:
      type: string
    description: "Binary data byte order"

  format_trace_data:
    getter: ":FORMat[:TRACe][:DATA]?"
    setter: ":FORMat[:TRACe][:DATA] {format}"
    type: property
    params:
      format:
        type: enum
        options: ["ASCii", "REAL", "REAL,32"]
        default: "ASCii"
    returns:
      type: string
    description: "Trace data format"

  # Initiate Subsystem
  initiate_continuous:
    getter: ":INITiate:CONTinuous?"
    setter: ":INITiate:CONTinuous {state}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON", "0", "1"]
        default: "ON"
    returns:
      type: bool
    description: "Continuous or single sweep/measurement"

  initiate_immediate:
    scpi: ":INITiate[:IMMediate]"
    type: write
    description: "Initialize sweep or trigger measurement"

  # Input Subsystem
  input_impedance:
    getter: ":INPut:IMPedance?"
    setter: ":INPut:IMPedance {impedance}"
    type: property
    params:
      impedance:
        type: enum
        options: ["50", "75"]
        default: "50"
    returns:
      type: int
      unit: Ohm
    description: "Input impedance for voltage-to-power conversion"

  # Memory Subsystem
  memory_delete:
    scpi: ":MMEMory:DELete {file_name}"
    type: write
    params:
      file_name:
        type: string
    description: "Delete file"

  memory_disk_info:
    scpi: ":MMEMory:DISK:INFormation?"
    type: query
    returns:
      type: string
    description: "Query disk information"

  memory_load_correction:
    scpi: ":MMEMory:LOAD:CORRection {type},{file_name}"
    type: write
    params:
      type:
        type: enum
        options: ["ANTenna", "CABLe", "OTHer", "USER"]
      file_name:
        type: string
    description: "Load amplitude correction file"

  memory_load_limit:
    scpi: ":MMEMory:LOAD:LIMit {file_name}"
    type: write
    params:
      file_name:
        type: string
    description: "Load limit line file"

  memory_load_setup:
    scpi: ":MMEMory:LOAD:SETUp {file_name}"
    type: write
    params:
      file_name:
        type: string
    description: "Load setup file"

  memory_load_state:
    scpi: ":MMEMory:LOAD:STATe 1,{file_name}"
    type: write
    params:
      file_name:
        type: string
    description: "Load state file"

  memory_load_trace:
    scpi: ":MMEMory:LOAD:TRACe {file_name}"
    type: write
    params:
      file_name:
        type: string
    description: "Load trace file"

  memory_store_correction:
    scpi: ":MMEMory:STORe:CORRection {type},{file_name}"
    type: write
    params:
      type:
        type: enum
        options: ["ANTenna", "CABLe", "OTHer", "USER"]
      file_name:
        type: string
    description: "Save amplitude correction file"

  memory_store_limit:
    scpi: ":MMEMory:STORe:LIMit {file_name}"
    type: write
    params:
      file_name:
        type: string
    description: "Save limit line file"

  memory_store_screen:
    scpi: ":MMEMory:STORe:SCReen {file_name}"
    type: write
    params:
      file_name:
        type: string
    description: "Save screen image"

  memory_store_setup:
    scpi: ":MMEMory:STORe:SETUp {file_name}"
    type: write
    params:
      file_name:
        type: string
    description: "Save setup file"

  memory_store_state:
    scpi: ":MMEMory:STORe:STATe 1,{file_name}"
