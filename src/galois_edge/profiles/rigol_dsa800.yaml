sequences:
  quick_measurement:
    description: "Quick spectrum measurement at center frequency"
    params:
      center_freq:
        type: float
        unit: Hz
      span:
        type: float
        unit: Hz
      rbw:
        type: float
        unit: Hz
        default: 1000000
    steps:
      - command: reset
      - command: center_frequency
        args:
          freq: "{center_freq}"
      - command: span
        args:
          freq: "{span}"
      - command: resolution_bandwidth
        args:
          freq: "{rbw}"
      - command: initiate_immediate
      - command: wait
      - command: trace_data
        capture: result
    returns: result

  marker_peak_search:
    description: "Perform peak search with marker"
    steps:
      - command: marker_state
        args:
          state: "ON"
      - command: marker_peak_maximum
      - command: marker_x
        capture: frequency
      - command: marker_y
        capture: amplitude
    returns: frequency

  frequency_sweep:
    description: "Sweep between start and stop frequencies"
    params:
      start_freq:
        type: float
        unit: Hz
      stop_freq:
        type: float
        unit: Hz
      points:
        type: int
        default: 601
    steps:
      - command: reset
      - command: start_frequency
        args:
          freq: "{start_freq}"
      - command: stop_frequency
        args:
          freq: "{stop_freq}"
      - command: sweep_points
        args:
          points: "{points}"
      - command: initiate_immediate
      - command: wait
      - command: trace_data
        capture: result
    returns: result

status:
  stb:
    bit4: MAV
    bit5: ESB
    bit6: RQS
  esr:
    bit0: OPC
    bit2: QYE
    bit3: DDE
    bit4: EXE
    bit5: CME
    bit7: PON