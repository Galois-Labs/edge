sequences:
  single_acquisition:
    description: "Acquire a single waveform"
    steps:
      - command: acquire_stopafter
        args:
          mode: "SEQuence"
      - command: acquire_state
        args:
          state: "RUN"
      - scpi: "*OPC?"
        capture: complete
    returns: complete

  measure_frequency:
    description: "Measure frequency of channel 1"
    params:
      channel:
        type: string
        default: "CH1"
    steps:
      - command: measurement_immed_type
        args:
          type: "FREQuency"
      - command: measurement_immed_source1
        args:
          source: "{channel}"
      - command: measurement_immed_value
        capture: frequency
    returns: frequency