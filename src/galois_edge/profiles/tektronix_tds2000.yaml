instrument:
  manufacturer: "Tektronix"
  model: "TDS2000"
  class: oscilloscope
  description: "Digital Storage Oscilloscope - TDS200, TDS1000/2000, TDS1000B/2000B, TPS2000 Series"

identity:
  query: "*IDN?"
  pattern: "TEKTRONIX,.*TDS.*|TEKTRONIX,.*TPS.*"

interfaces:
  - type: gpib
    default_address: 1
  - type: usb
  - type: serial
    port: 9600

settings:
  timeout_ms: 5000
  terminator: "\n"
  opc_query: false

commands:
  # IEEE-488.2 Common Commands
  reset:
    scpi: "*RST"
    type: write
    description: "Reset instrument to default state"

  clear_status:
    scpi: "*CLS"
    type: write
    description: "Clear status registers and error queue"

  identify:
    scpi: "*IDN?"
    type: query
    returns:
      type: string
    description: "Query instrument identification"

  operation_complete:
    scpi: "*OPC"
    type: write
    description: "Set operation complete bit after pending operations finish"

  operation_complete_query:
    scpi: "*OPC?"
    type: query
    returns:
      type: int
    description: "Query operation complete status"

  self_test:
    scpi: "*TST?"
    type: query
    returns:
      type: int
    description: "Perform self-test (0 = pass)"

  wait:
    scpi: "*WAI"
    type: write
    description: "Wait until all pending operations complete"

  trigger:
    scpi: "*TRG"
    type: write
    description: "Execute trigger"

  save_setup:
    scpi: "*SAV {location}"
    type: write
    params:
      location:
        type: int
        min: 1
        max: 10
    description: "Save current setup to memory location"

  recall_setup:
    scpi: "*RCL {location}"
    type: write
    params:
      location:
        type: int
        min: 1
        max: 10
    description: "Recall setup from memory location"

  learn:
    scpi: "*LRN?"
    type: query
    returns:
      type: string
    description: "Query device settings"

  # Acquisition Commands
  acquire_mode:
    getter: "ACQuire:MODe?"
    setter: "ACQuire:MODe {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["SAMple", "PEAKdetect", "AVErage"]
    returns:
      type: string
    description: "Set or query acquisition mode"

  acquire_numavg:
    getter: "ACQuire:NUMAVg?"
    setter: "ACQuire:NUMAVg {count}"
    type: property
    params:
      count:
        type: int
        options: ["4", "16", "64", "128"]
    returns:
      type: int
    description: "Set or query number of acquisitions for averaging"

  acquire_numacq:
    scpi: "ACQuire:NUMACq?"
    type: query
    returns:
      type: int
    description: "Query number of acquisitions since start"

  acquire_state:
    getter: "ACQuire:STATE?"
    setter: "ACQuire:STATE {state}"
    type: property
    params:
      state:
        type: enum
        options: ["OFF", "ON", "RUN", "STOP"]
        map:
          "OFF": 0
          "ON": 1
          "RUN": 1
          "STOP": 0
    returns:
      type: bool
    description: "Start or stop acquisitions"

  acquire_stopafter:
    getter: "ACQuire:STOPAfter?"
    setter: "ACQuire:STOPAfter {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["RUNSTop", "SEQuence"]
    returns:
      type: string
    description: "Set or query when acquisitions stop"

  # Calibration Commands
  calibrate_internal:
    scpi: "CALibrate:INTERNAL"
    type: write
    description: "Perform internal self-calibration"

  calibrate_query:
    scpi: "*CAL?"
    type: query
    returns:
      type: int
    description: "Perform self-calibration and return status"

  calibrate_status:
    scpi: "CALibrate:STATUS?"
    type: query
    returns:
      type: string
    description: "Query calibration status (PASS or FAIL)"

  # Cursor Commands
  cursor_function:
    getter: "CURSor:FUNCtion?"
    setter: "CURSor:FUNCtion {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["HBArs", "OFF", "VBArs"]
    returns:
      type: string
    description: "Set or query cursor type"

  cursor_select_source:
    getter: "CURSor:SELect:SOUrce?"
    setter: "CURSor:SELect:SOUrce {source}"
    type: property
    params:
      source:
        type: string
    returns:
      type: string
    description: "Set or query cursor waveform source"

  cursor_hbars_position1:
    getter: "CURSor:HBArs:POSITION1?"
    setter: "CURSor:HBArs:POSITION1 {value}"
    type: property
    params:
      value:
        type: float
    returns:
      type: float
    description: "Set or query horizontal bar cursor 1 position"

  cursor_hbars_position2:
    getter: "CURSor:HBArs:POSITION2?"
    setter: "CURSor:HBArs:POSITION2 {value}"
    type: property
    params:
      value:
        type: float
    returns:
      type: float
    description: "Set or query horizontal bar cursor 2 position"

  cursor_hbars_delta:
    scpi: "CURSor:HBArs:DELTa?"
    type: query
    returns:
      type: float
    description: "Query difference between horizontal bar cursors"

  cursor_hbars_units:
    scpi: "CURSor:HBArs:UNIts?"
    type: query
    returns:
      type: string
    description: "Query horizontal bar cursor units"

  cursor_vbars_position1:
    getter: "CURSor:VBArs:POSITION1?"
    setter: "CURSor:VBArs:POSITION1 {value}"
    type: property
    params:
      value:
        type: float
        unit: s
    returns:
      type: float
      unit: s
    description: "Set or query vertical bar cursor 1 position"

  cursor_vbars_position2:
    getter: "CURSor:VBArs:POSITION2?"
    setter: "CURSor:VBArs:POSITION2 {value}"
    type: property
    params:
      value:
        type: float
        unit: s
    returns:
      type: float
      unit: s
    description: "Set or query vertical bar cursor 2 position"

  cursor_vbars_delta:
    scpi: "CURSor:VBArs:DELTa?"
    type: query
    returns:
      type: float
      unit: s
    description: "Query time difference between vertical bar cursors"

  cursor_vbars_units:
    getter: "CURSor:VBArs:UNIts?"
    setter: "CURSor:VBArs:UNIts {unit}"
    type: property
    params:
      unit:
        type: enum
        options: ["SECOnds", "HERtz"]
    returns:
      type: string
    description: "Set or query vertical bar cursor units"

  # Channel Commands
  ch1_coupling:
    getter: "CH1:COUPling?"
    setter: "CH1:COUPling {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["AC", "DC", "GND"]
    returns:
      type: string
    description: "Set or query channel 1 input coupling"

  ch1_bandwidth:
    getter: "CH1:BANdwidth?"
    setter: "CH1:BANdwidth {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF"]
        map:
          "ON": 1
          "OFF": 0
    returns:
      type: bool
    description: "Set or query channel 1 bandwidth limit"

  ch1_scale:
    getter: "CH1:SCAle?"
    setter: "CH1:SCAle {value}"
    type: property
    params:
      value:
        type: float
        unit: V
        min: 0.002
        max: 10
    returns:
      type: float
      unit: V
    description: "Set or query channel 1 vertical scale (V/div)"

  ch1_position:
    getter: "CH1:POSition?"
    setter: "CH1:POSition {value}"
    type: property
    params:
      value:
        type: float
        min: -5
        max: 5
    returns:
      type: float
    description: "Set or query channel 1 vertical position (divisions)"

  ch1_probe:
    getter: "CH1:PRObe?"
    setter: "CH1:PRObe {attenuation}"
    type: property
    params:
      attenuation:
        type: enum
        options: ["1", "10", "20", "50", "100", "500", "1000"]
    returns:
      type: float
    description: "Set or query channel 1 probe attenuation"

  ch1_invert:
    getter: "CH1:INVert?"
    setter: "CH1:INVert {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF"]
        map:
          "ON": 1
          "OFF": 0
    returns:
      type: bool
    description: "Set or query channel 1 invert state"

  ch2_coupling:
    getter: "CH2:COUPling?"
    setter: "CH2:COUPling {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["AC", "DC", "GND"]
    returns:
      type: string
    description: "Set or query channel 2 input coupling"

  ch2_bandwidth:
    getter: "CH2:BANdwidth?"
    setter: "CH2:BANdwidth {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF"]
    returns:
      type: bool
    description: "Set or query channel 2 bandwidth limit"

  ch2_scale:
    getter: "CH2:SCAle?"
    setter: "CH2:SCAle {value}"
    type: property
    params:
      value:
        type: float
        unit: V
        min: 0.002
        max: 10
    returns:
      type: float
      unit: V
    description: "Set or query channel 2 vertical scale (V/div)"

  ch2_position:
    getter: "CH2:POSition?"
    setter: "CH2:POSition {value}"
    type: property
    params:
      value:
        type: float
        min: -5
        max: 5
    returns:
      type: float
    description: "Set or query channel 2 vertical position (divisions)"

  ch2_probe:
    getter: "CH2:PRObe?"
    setter: "CH2:PRObe {attenuation}"
    type: property
    params:
      attenuation:
        type: enum
        options: ["1", "10", "20", "50", "100", "500", "1000"]
    returns:
      type: float
    description: "Set or query channel 2 probe attenuation"

  ch2_invert:
    getter: "CH2:INVert?"
    setter: "CH2:INVert {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF"]
    returns:
      type: bool
    description: "Set or query channel 2 invert state"

  # Select Commands
  select_ch1:
    getter: "SELect:CH1?"
    setter: "SELect:CH1 {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF"]
        map:
          "ON": 1
          "OFF": 0
    returns:
      type: bool
    description: "Turn channel 1 display on or off"

  select_ch2:
    getter: "SELect:CH2?"
    setter: "SELect:CH2 {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF"]
    returns:
      type: bool
    description: "Turn channel 2 display on or off"

  select_math:
    getter: "SELect:MATH?"
    setter: "SELect:MATH {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF"]
    returns:
      type: bool
    description: "Turn math waveform display on or off"

  # Horizontal Commands
  horizontal_main_scale:
    getter: "HORizontal:MAIn:SCAle?"
    setter: "HORizontal:MAIn:SCAle {value}"
    type: property
    params:
      value:
        type: float
        unit: s
        min: 5e-9
        max: 50
    returns:
      type: float
      unit: s
    description: "Set or query horizontal time base (s/div)"

  horizontal_main_position:
    getter: "HORizontal:MAIn:POSition?"
    setter: "HORizontal:MAIn:POSition {value}"
    type: property
    params:
      value:
        type: float
        unit: s
    returns:
      type: float
      unit: s
    description: "Set or query horizontal trigger position"

  horizontal_delay_scale:
    getter: "HORizontal:DELay:SCAle?"
    setter: "HORizontal:DELay:SCAle {value}"
    type: property
    params:
      value:
        type: float
        unit: s
    returns:
      type: float
      unit: s
    description: "Set or query window time base scale"

  horizontal_delay_position:
    getter: "HORizontal:DELay:POSition?"
    setter: "HORizontal:DELay:POSition {value}"
    type: property
    params:
      value:
        type: float
        unit: s
    returns:
      type: float
      unit: s
    description: "Set or query window time base position"

  horizontal_view:
    getter: "HORizontal:VIEW?"
    setter: "HORizontal:VIEW {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["MAIn", "WINDOW", "ZONE"]
    returns:
      type: string
    description: "Set or query horizontal view mode"

  horizontal_recordlength:
    scpi: "HORizontal:RECOrdlength?"
    type: query
    returns:
      type: int
    description: "Query waveform record length"

  # Trigger Commands
  trigger_main_type:
    getter: "TRIGger:MAIn:TYPe?"
    setter: "TRIGger:MAIn:TYPe {type}"
    type: property
    params:
      type:
        type: enum
        options: ["EDGE", "VIDeo", "PULse"]
    returns:
      type: string
    description: "Set or query trigger type"

  trigger_main_mode:
    getter: "TRIGger:MAIn:MODe?"
    setter: "TRIGger:MAIn:MODe {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["AUTO", "NORMal"]
    returns:
      type: string
    description: "Set or query trigger mode"

  trigger_main_level:
    getter: "TRIGger:MAIn:LEVel?"
    setter: "TRIGger:MAIn:LEVel {value}"
    type: property
    params:
      value:
        type: float
        unit: V
    returns:
      type: float
      unit: V
    description: "Set or query trigger level"

  trigger_main_edge_source:
    getter: "TRIGger:MAIn:EDGE:SOUrce?"
    setter: "TRIGger:MAIn:EDGE:SOUrce {source}"
    type: property
    params:
      source:
        type: enum
        options: ["CH1", "CH2", "CH3", "CH4", "EXT", "EXT5", "EXT10", "AC LINE"]
    returns:
      type: string
    description: "Set or query edge trigger source"

  trigger_main_edge_slope:
    getter: "TRIGger:MAIn:EDGE:SLOpe?"
    setter: "TRIGger:MAIn:EDGE:SLOpe {slope}"
    type: property
    params:
      slope:
        type: enum
        options: ["FALL", "RISe"]
    returns:
      type: string
    description: "Set or query edge trigger slope"

  trigger_main_edge_coupling:
    getter: "TRIGger:MAIn:EDGE:COUPling?"
    setter: "TRIGger:MAIn:EDGE:COUPling {coupling}"
    type: property
    params:
      coupling:
        type: enum
        options: ["AC", "DC", "HFRej", "LFRej", "NOISErej"]
    returns:
      type: string
    description: "Set or query edge trigger coupling"

  trigger_main_holdoff:
    getter: "TRIGger:MAIn:HOLDOff:VALue?"
    setter: "TRIGger:MAIn:HOLDOff:VALue {value}"
    type: property
    params:
      value:
        type: float
        unit: s
        min: 500e-9
        max: 10
    returns:
      type: float
      unit: s
    description: "Set or query trigger holdoff time"

  trigger_main_video_source:
    getter: "TRIGger:MAIn:VIDeo:SOUrce?"
    setter: "TRIGger:MAIn:VIDeo:SOUrce {source}"
    type: property
    params:
      source:
        type: enum
        options: ["CH1", "CH2", "CH3", "CH4", "EXT", "EXT5", "EXT10"]
    returns:
      type: string
    description: "Set or query video trigger source"

  trigger_main_video_sync:
    getter: "TRIGger:MAIn:VIDeo:SYNC?"
    setter: "TRIGger:MAIn:VIDeo:SYNC {sync}"
    type: property
    params:
      sync:
        type: enum
        options: ["FIELD", "LINE", "ODD", "EVEN", "LINENum"]
    returns:
      type: string
    description: "Set or query video trigger sync type"

  trigger_main_video_polarity:
    getter: "TRIGger:MAIn:VIDeo:POLarity?"
    setter: "TRIGger:MAIn:VIDeo:POLarity {polarity}"
    type: property
    params:
      polarity:
        type: enum
        options: ["NORMal", "INVert", "INVERTed"]
    returns:
      type: string
    description: "Set or query video trigger polarity"

  trigger_main_video_standard:
    getter: "TRIGger:MAIn:VIDeo:STANdard?"
    setter: "TRIGger:MAIn:VIDeo:STANdard {standard}"
    type: property
    params:
      standard:
        type: enum
        options: ["NTSc", "PAL"]
    returns:
      type: string
    description: "Set or query video standard"

  trigger_main_video_line:
    getter: "TRIGger:MAIn:VIDeo:LINE?"
    setter: "TRIGger:MAIn:VIDeo:LINE {line}"
    type: property
    params:
      line:
        type: int
        min: 1
        max: 625
    returns:
      type: int
    description: "Set or query video trigger line number"

  trigger_main_pulse_source:
    getter: "TRIGger:MAIn:PULse:SOUrce?"
    setter: "TRIGger:MAIn:PULse:SOUrce {source}"
    type: property
    params:
      source:
        type: enum
        options: ["CH1", "CH2", "CH3", "CH4", "EXT", "EXT5", "EXT10"]
    returns:
      type: string
    description: "Set or query pulse trigger source"

  trigger_main_pulse_width_polarity:
    getter: "TRIGger:MAIn:PULse:WIDth:POLarity?"
    setter: "TRIGger:MAIn:PULse:WIDth:POLarity {polarity}"
    type: property
    params:
      polarity:
        type: enum
        options: ["POSITIVe", "NEGAtive"]
    returns:
      type: string
    description: "Set or query pulse trigger polarity"

  trigger_main_pulse_width_when:
    getter: "TRIGger:MAIn:PULse:WIDth:WHEN?"
    setter: "TRIGger:MAIn:PULse:WIDth:WHEN {when}"
    type: property
    params:
      when:
        type: enum
        options: ["EQual", "NOTEqual", "INside", "OUTside"]
    returns:
      type: string
    description: "Set or query pulse trigger condition"

  trigger_main_pulse_width_width:
    getter: "TRIGger:MAIn:PULse:WIDth:WIDth?"
    setter: "TRIGger:MAIn:PULse:WIDth:WIDth {value}"
    type: property
    params:
      value:
        type: float
        unit: s
        min: 33e-9
        max: 10
    returns:
      type: float
      unit: s
    description: "Set or query pulse width"

  trigger_force:
    scpi: "TRIGger FORCe"
    type: write
    description: "Force a trigger event"

  trigger_state:
    scpi: "TRIGger:STATE?"
    type: query
    returns:
      type: string
    description: "Query trigger state (ARMED, READY, TRIGGER, AUTO, SAVE, SCAN)"

  trigger_frequency:
    scpi: "TRIGger:MAIn:FREQuency?"
    type: query
    returns:
      type: float
      unit: Hz
    description: "Query trigger frequency"

  trigger_setlevel:
    scpi: "TRIGger:MAIn SETLevel"
    type: write
    description: "Set trigger level to 50% of signal amplitude"

  # Measurement Commands
  measurement_immed_type:
    getter: "MEASUrement:IMMed:TYPe?"
    setter: "MEASUrement:IMMed:TYPe {type}"
    type: property
    params:
      type:
        type: enum
        options: ["FREQuency", "MEAN", "PERIod", "PHAse", "PK2pk", "CRMs", "MINImum", "MAXImum", "RISe", "FALL", "PWIdth", "NWIdth"]
    returns:
      type: string
    description: "Set or query immediate measurement type"

  measurement_immed_source1:
    getter: "MEASUrement:IMMed:SOUrce1?"
    setter: "MEASUrement:IMMed:SOUrce1 {source}"
    type: property
    params:
      source:
        type: string
    returns:
      type: string
    description: "Set or query immediate measurement source"

  measurement_immed_value:
    scpi: "MEASUrement:IMMed:VALue?"
    type: query
    returns:
      type: float
    description: "Query immediate measurement value"

  measurement_immed_units:
    scpi: "MEASUrement:IMMed:UNIts?"
    type: query
    returns:
      type: string
    description: "Query immediate measurement units"

  measurement_meas1_type:
    getter: "MEASUrement:MEAS1:TYPe?"
    setter: "MEASUrement:MEAS1:TYPe {type}"
    type: property
    params:
      type:
        type: enum
        options: ["FREQuency", "MEAN", "PERIod", "PK2pk", "CRMs", "MINImum", "MAXImum", "RISe", "FALL", "PWIdth", "NWIdth", "NONe"]
    returns:
      type: string
    description: "Set or query measurement 1 type"

  measurement_meas1_source:
    getter: "MEASUrement:MEAS1:SOUrce?"
    setter: "MEASUrement:MEAS1:SOUrce {source}"
    type: property
    params:
      source:
        type: string
    returns:
      type: string
    description: "Set or query measurement 1 source"

  measurement_meas1_value:
    scpi: "MEASUrement:MEAS1:VALue?"
    type: query
    returns:
      type: float
    description: "Query measurement 1 value"

  measurement_meas1_units:
    scpi: "MEASUrement:MEAS1:UNIts?"
    type: query
    returns:
      type: string
    description: "Query measurement 1 units"

  measurement_meas2_type:
    getter: "MEASUrement:MEAS2:TYPe?"
    setter: "MEASUrement:MEAS2:TYPe {type}"
    type: property
    params:
      type:
        type: enum
        options: ["FREQuency", "MEAN", "PERIod", "PK2pk", "CRMs", "MINImum", "MAXImum", "RISe", "FALL", "PWIdth", "NWIdth", "NONe"]
    returns:
      type: string
    description: "Set or query measurement 2 type"

  measurement_meas2_source:
    getter: "MEASUrement:MEAS2:SOUrce?"
    setter: "MEASUrement:MEAS2:SOUrce {source}"
    type: property
    params:
      source:
        type: string
    returns:
      type: string
    description: "Set or query measurement 2 source"

  measurement_meas2_value:
    scpi: "MEASUrement:MEAS2:VALue?"
    type: query
    returns:
      type: float
    description: "Query measurement 2 value"

  measurement_meas3_type:
    getter: "MEASUrement:MEAS3:TYPe?"
    setter: "MEASUrement:MEAS3:TYPe {type}"
    type: property
    params:
      type:
        type: enum
        options: ["FREQuency", "MEAN", "PERIod", "PK2pk", "CRMs", "MINImum", "MAXImum", "RISe", "FALL", "PWIdth", "NWIdth", "NONe"]
    returns:
      type: string
    description: "Set or query measurement 3 type"

  measurement_meas3_source:
    getter: "MEASUrement:MEAS3:SOUrce?"
    setter: "MEASUrement:MEAS3:SOUrce {source}"
    type: property
    params:
      source:
        type: string
    returns:
      type: string
    description: "Set or query measurement 3 source"

  measurement_meas3_value:
    scpi: "MEASUrement:MEAS3:VALue?"
    type: query
    returns:
      type: float
    description: "Query measurement 3 value"

  measurement_meas4_type:
    getter: "MEASUrement:MEAS4:TYPe?"
    setter: "MEASUrement:MEAS4:TYPe {type}"
    type: property
    params:
      type:
        type: enum
