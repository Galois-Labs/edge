# Original driver: Newport MM4006
# NOTE: Original Labber driver includes custom Python logic not captured here

instrument:
  manufacturer: "Newport"
  model: "MM4006 Motion Controller"
  class: motion_controller
  description: "Newport MM4006 Motion Controller"

identity:
  query: "*IDN?"
  pattern: "Newport.*MM4006"

interfaces:
  - type: gpib

settings:
  timeout_ms: 5000
  terminator: "\n"
  opc_query: false

commands:
  # IEEE-488.2 Common Commands
  reset:
    scpi: "*RST"
    type: write
    description: "Reset instrument to default settings"
  clear_status:
    scpi: "*CLS"
    type: write
    description: "Clear all event registers and error queue"
  identify:
    scpi: "*IDN?"
    type: query
    returns:
      type: string
    description: "Query instrument identification"
  operation_complete:
    scpi: "*OPC"
    type: write
    description: "Set OPC bit when all pending operations complete"
  operation_complete_query:
    scpi: "*OPC?"
    type: query
    returns:
      type: int
    description: "Return 1 when all pending operations complete"
  self_test:
    scpi: "*TST?"
    type: query
    returns:
      type: int
    description: "Perform self-test (0=pass)"

  # Instrument-Specific Commands (converted from Labber)
  ch1name:
    scpi: "1SF?"
    type: query
    returns:
      type: string
    description: "Ch1Name"
  ch1value:
    getter: "1TP"
    setter: "1PA{value}"
    type: property
    params:
      value:
        type: float
    returns:
      type: float
    description: "Ch1Value"
  ch1position:
    getter: "1TP"
    setter: "1PA{value}"
    type: property
    params:
      value:
        type: float
        unit: m
    returns:
      type: float
      unit: m
    description: "Ch1Position"
  ch1rotation:
    getter: "1TP"
    setter: "1PA{value}"
    type: property
    params:
      value:
        type: float
        unit: deg
    returns:
      type: float
      unit: deg
    description: "Ch1Rotation"
