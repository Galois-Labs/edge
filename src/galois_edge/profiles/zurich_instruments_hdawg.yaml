# Zurich Instruments HDAWG Instrument Profile
# Converted from Labber driver (MIT licensed, (c) 2015 Lab Control Software Scandinavia AB)
# Original driver: Zurich_Instruments_HDAWG
# NOTE: Original Labber driver includes custom Python logic not captured here

instrument:
  manufacturer: "Zurich"
  model: "Instruments HDAWG"
  class: signal_generator
  description: "Zurich Instruments HDAWG"

identity:
  query: "*IDN?"
  pattern: "Zurich.*HDAWG"

interfaces:
  - type: gpib

settings:
  timeout_ms: 5000
  terminator: "\n"
  opc_query: false

commands:
  # IEEE-488.2 Common Commands
  reset:
    scpi: "*RST"
    type: write
    description: "Reset instrument to default settings"
  clear_status:
    scpi: "*CLS"
    type: write
    description: "Clear all event registers and error queue"
  identify:
    scpi: "*IDN?"
    type: query
    returns:
      type: string
    description: "Query instrument identification"
  operation_complete:
    scpi: "*OPC"
    type: write
    description: "Set OPC bit when all pending operations complete"
  operation_complete_query:
    scpi: "*OPC?"
    type: query
    returns:
      type: int
    description: "Return 1 when all pending operations complete"
  self_test:
    scpi: "*TST?"
    type: query
    returns:
      type: int
    description: "Perform self-test (0=pass)"

  # Instrument-Specific Commands (converted from Labber)
  channel_grouping:
    scpi: "/system/awg/channelgrouping"
    type: query
    params:
      value:
        type: enum
        options: ["-1", "0", "1", "2"]
    returns:
      type: string
    description: "Channel grouping"
  sampling_rate_group_1:
    scpi: "/awgs/0/time"
