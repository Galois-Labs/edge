    params:
      source:
        type: enum
        options: ["AUTO", "SINGLE", "EXT"]
    returns:
      type: string
    description: "Trigger source"

  trigger_auto_interval:
    getter: "TRIGger:AUTO:INTErval?"
    setter: "TRIGger:AUTO:INTErval {value}"
    type: property
    params:
      value:
        type: int
        min: 8
        max: 2000
        unit: ms
    returns:
      type: int
    description: "Auto trigger interval"

  trigger_auto_hold:
    getter: "TRIGger:AUTO:HOLD?"
    setter: "TRIGger:AUTO:HOLD {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
