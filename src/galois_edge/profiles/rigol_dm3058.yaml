  system_display_invert:
    scpi: "SYSTem:DISPlay:INVErt"
    type: write
    description: "Invert screen display"

  # Trigger Commands
  trigger_source:
    getter: "TRIGger:SOURce?"
    setter: "TRIGger:SOURce {source}"
