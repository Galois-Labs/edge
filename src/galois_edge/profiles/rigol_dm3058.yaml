      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "LAN Auto IP state"

  utility_lan_manuip:
    getter: "UTILity:INTErface:LAN:MANUip?"
    setter: "UTILity:INTErface:LAN:MANUip {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
