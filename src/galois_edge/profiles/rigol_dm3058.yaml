      type: string
    description: "LAN IP address"

  utility_lan_mask:
    getter: "UTILity:INTErface:LAN:MASK?"
    setter: "UTILity:INTErface:LAN:MASK {mask}"
    type: property
    params:
      mask:
        type: string
        default: "255.255.255.0"
