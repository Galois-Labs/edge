    description: "Auto trigger hold state"

  trigger_auto_hold_sensitivity:
    getter: "TRIGger:AUTO:HOLD:SENSitivity?"
    setter: "TRIGger:AUTO:HOLD:SENSitivity {value}"
    type: property
    params:
      value:
        type: enum
        options: ["0", "1", "2", "3", "MIN", "MAX", "DEF"]
    returns:
      type: int
    description: "Auto trigger hold sensitivity (0=0.01%, 1=0.1%, 2=1%, 3=10%)"

  trigger_single:
    getter: "TRIGger:SINGle?"
    setter: "TRIGger:SINGle {count}"
    type: property
    params:
      count:
        type: int
        min: 1
        max: 2000
        default: 1
    returns:
      type: int
    description: "Single trigger sample count"

  trigger_single_triggered:
    scpi: "TRIGger:SINGle:TRIGgered"
    type: write
    description: "Execute single trigger manually"

  trigger_ext:
    getter: "TRIGger:EXT?"
    setter: "TRIGger:EXT {type}"
    type: property
    params:
      type:
        type: enum
        options: ["RISE", "FALL", "HIGH", "LOW"]
