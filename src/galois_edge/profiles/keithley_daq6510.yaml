---
instrument:
  manufacturer: "Keithley"
  model: "DAQ6510"
  class: daq
  description: "Data Acquisition and Multimeter System - 7.5 digit, scanning, switching, and digitizing"

identity:
  query: "*IDN?"
  pattern: "KEITHLEY INSTRUMENTS.*DAQ6510"

interfaces:
  - type: gpib
    default_address: 26
  - type: usb
  - type: ethernet
    port: 5025
  - type: serial

settings:
  timeout_ms: 5000
  terminator: "\n"
  opc_query: true

commands:
  # IEEE-488.2 Common Commands
  reset:
    scpi: "*RST"
    type: write
    description: "Reset instrument to default state"

  clear_status:
    scpi: "*CLS"
    type: write
    description: "Clear status registers and error queue"

  identify:
    scpi: "*IDN?"
    type: query
    returns:
      type: string
    description: "Return instrument identification string"

  operation_complete:
    scpi: "*OPC"
    type: write
    description: "Set OPC bit when all operations complete"

  operation_complete_query:
    scpi: "*OPC?"
    type: query
    returns:
      type: int
    description: "Query operation complete status"

  self_test:
    scpi: "*TST?"
    type: query
    returns:
      type: int
    description: "Perform self-test (0 = pass)"

  wait:
    scpi: "*WAI"
    type: write
    description: "Wait for all pending operations to complete"

  trigger:
    scpi: "*TRG"
    type: write
    description: "Send bus trigger"

  save_setup:
    scpi: "*SAV {slot}"
    type: write
    params:
      slot:
        type: int
        min: 0
        max: 4
    description: "Save setup to memory slot"

  recall_setup:
    scpi: "*RCL {slot}"
    type: write
    params:
      slot:
        type: int
        min: 0
        max: 4
    description: "Recall setup from memory slot"

  # Status Commands
  status_byte:
    scpi: "*STB?"
    type: query
    returns:
      type: int
    description: "Read status byte register"

  service_request_enable:
    getter: "*SRE?"
    setter: "*SRE {mask}"
    type: property
    params:
      mask:
        type: int
        min: 0
        max: 255
    returns:
      type: int
    description: "Service request enable register"

  event_status_enable:
    getter: "*ESE?"
    setter: "*ESE {mask}"
    type: property
    params:
      mask:
        type: int
        min: 0
        max: 255
    returns:
      type: int
    description: "Event status enable register"

  event_status_register:
    scpi: "*ESR?"
    type: query
    returns:
      type: int
    description: "Read event status register"

  # Measurement Commands
  read:
    scpi: ":READ?"
    type: query
    returns:
      type: array
      element_type: float
      separator: ","
    description: "Initiate measurement and return reading"
    streamable: true

  fetch:
    scpi: ":FETCh?"
    type: query
    returns:
      type: float
    description: "Return latest reading from buffer"

  measure_voltage:
    scpi: ":MEASure:VOLTage?"
    type: query
    returns:
      type: float
      unit: V
    description: "Measure DC voltage"

  measure_voltage_ac:
    scpi: ":MEASure:VOLTage:AC?"
    type: query
    returns:
      type: float
      unit: V
    description: "Measure AC voltage"

  measure_current:
    scpi: ":MEASure:CURRent?"
    type: query
    returns:
      type: float
      unit: A
    description: "Measure DC current"

  measure_current_ac:
    scpi: ":MEASure:CURRent:AC?"
    type: query
    returns:
      type: float
      unit: A
    description: "Measure AC current"

  measure_resistance:
    scpi: ":MEASure:RESistance?"
    type: query
    returns:
      type: float
      unit: Ohm
    description: "Measure 2-wire resistance"

  measure_fresistance:
    scpi: ":MEASure:FRESistance?"
    type: query
    returns:
      type: float
      unit: Ohm
    description: "Measure 4-wire resistance"

  measure_temperature:
    scpi: ":MEASure:TEMPerature?"
    type: query
    returns:
      type: float
      unit: C
    description: "Measure temperature"

  measure_diode:
    scpi: ":MEASure:DIODe?"
    type: query
    returns:
      type: float
      unit: V
    description: "Measure diode voltage"

  measure_continuity:
    scpi: ":MEASure:CONTinuity?"
    type: query
    returns:
      type: float
      unit: Ohm
    description: "Measure continuity"

  measure_frequency:
    scpi: ":MEASure:FREQuency?"
    type: query
    returns:
      type: float
      unit: Hz
    description: "Measure frequency"

  measure_period:
    scpi: ":MEASure:PERiod?"
    type: query
    returns:
      type: float
      unit: s
    description: "Measure period"

  measure_capacitance:
    scpi: ":MEASure:CAPacitance?"
    type: query
    returns:
      type: float
      unit: F
    description: "Measure capacitance"

  measure_digitize_voltage:
    scpi: ":MEASure:DIGitize:VOLTage?"
    type: query
    returns:
      type: array
      element_type: float
      separator: ","
    description: "Digitize voltage measurement"

  measure_digitize_current:
    scpi: ":MEASure:DIGitize:CURRent?"
    type: query
    returns:
      type: array
      element_type: float
      separator: ","
    description: "Digitize current measurement"

  read_digitize:
    scpi: ":READ:DIGitize?"
    type: query
    returns:
      type: array
      element_type: float
      separator: ","
    description: "Initiate digitize and return readings"

  # Sense Function Selection
  sense_function:
    getter: "[:SENSe[1]]:FUNCtion[:ON]?"
    setter: "[:SENSe[1]]:FUNCtion[:ON] \"{function}\""
    type: property
    params:
      function:
        type: enum
        options: ["VOLTage:DC", "VOLTage:AC", "CURRent:DC", "CURRent:AC", "RESistance", "FRESistance", "TEMPerature", "DIODe", "CONTinuity", "FREQuency", "PERiod", "CAPacitance", "VOLTage:DC:RATio"]
    returns:
      type: string
    description: "Select measurement function"

  digitize_function:
    getter: "[:SENSe[1]]:DIGitize:FUNCtion[:ON]?"
    setter: "[:SENSe[1]]:DIGitize:FUNCtion[:ON] \"{function}\""
    type: property
    params:
      function:
        type: enum
        options: ["VOLTage", "CURRent"]
    returns:
      type: string
    description: "Select digitize function"

  measure_count:
    getter: "[:SENSe[1]]:COUNt?"
    setter: "[:SENSe[1]]:COUNt {count}"
    type: property
    params:
      count:
        type: int
        min: 1
        max: 100000000
    returns:
      type: int
    description: "Number of measurements per trigger"

  digitize_count:
    getter: "[:SENSe[1]]:DIGitize:COUNt?"
    setter: "[:SENSe[1]]:DIGitize:COUNt {count}"
    type: property
    params:
      count:
        type: int
        min: 1
        max: 55000000
    returns:
      type: int
    description: "Number of digitize samples per trigger"

  # Voltage Measurement Settings
  voltage_range:
    getter: "[:SENSe[1]]:VOLTage[:DC]:RANGe[:UPPer]?"
    setter: "[:SENSe[1]]:VOLTage[:DC]:RANGe[:UPPer] {value}"
    type: property
    params:
      value:
        type: float
        unit: V
        min: 0.1
        max: 1000
    returns:
      type: float
      unit: V
    description: "DC voltage measurement range"

  voltage_autorange:
    getter: "[:SENSe[1]]:VOLTage[:DC]:RANGe:AUTO?"
    setter: "[:SENSe[1]]:VOLTage[:DC]:RANGe:AUTO {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable voltage autorange"

  voltage_nplc:
    getter: "[:SENSe[1]]:VOLTage[:DC]:NPLCycles?"
    setter: "[:SENSe[1]]:VOLTage[:DC]:NPLCycles {value}"
    type: property
    params:
      value:
        type: float
        min: 0.0005
        max: 12
    returns:
      type: float
    description: "Voltage integration time in NPLCs"

  voltage_aperture:
    getter: "[:SENSe[1]]:VOLTage[:DC]:APERture?"
    setter: "[:SENSe[1]]:VOLTage[:DC]:APERture {value}"
    type: property
    params:
      value:
        type: float
        unit: s
        min: 0.00001
        max: 0.2
    returns:
      type: float
      unit: s
    description: "Voltage measurement aperture time"

  voltage_autozero:
    getter: "[:SENSe[1]]:VOLTage[:DC]:AZERo[:STATe]?"
    setter: "[:SENSe[1]]:VOLTage[:DC]:AZERo[:STATe] {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "ONCE"]
    returns:
      type: string
    description: "Voltage autozero setting"

  voltage_input_impedance:
    getter: "[:SENSe[1]]:VOLTage[:DC]:INPutimpedance?"
    setter: "[:SENSe[1]]:VOLTage[:DC]:INPutimpedance {value}"
    type: property
    params:
      value:
        type: enum
        options: ["AUTO", "10000000000"]
    returns:
      type: string
    description: "Voltage input impedance"

  # AC Voltage Settings
  voltage_ac_range:
    getter: "[:SENSe[1]]:VOLTage:AC:RANGe[:UPPer]?"
    setter: "[:SENSe[1]]:VOLTage:AC:RANGe[:UPPer] {value}"
    type: property
    params:
      value:
        type: float
        unit: V
        min: 0.1
        max: 750
    returns:
      type: float
      unit: V
    description: "AC voltage measurement range"

  voltage_ac_autorange:
    getter: "[:SENSe[1]]:VOLTage:AC:RANGe:AUTO?"
    setter: "[:SENSe[1]]:VOLTage:AC:RANGe:AUTO {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable AC voltage autorange"

  voltage_ac_bandwidth:
    getter: "[:SENSe[1]]:VOLTage:AC:DETector:BANDwidth?"
    setter: "[:SENSe[1]]:VOLTage:AC:DETector:BANDwidth {value}"
    type: property
    params:
      value:
        type: enum
        options: ["3", "30", "300"]
    returns:
      type: int
    description: "AC voltage detector bandwidth (Hz)"

  # Current Measurement Settings
  current_range:
    getter: "[:SENSe[1]]:CURRent[:DC]:RANGe[:UPPer]?"
    setter: "[:SENSe[1]]:CURRent[:DC]:RANGe[:UPPer] {value}"
    type: property
    params:
      value:
        type: float
        unit: A
        min: 0.00001
        max: 10
    returns:
      type: float
      unit: A
    description: "DC current measurement range"

  current_autorange:
    getter: "[:SENSe[1]]:CURRent[:DC]:RANGe:AUTO?"
    setter: "[:SENSe[1]]:CURRent[:DC]:RANGe:AUTO {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable current autorange"

  current_nplc:
    getter: "[:SENSe[1]]:CURRent[:DC]:NPLCycles?"
    setter: "[:SENSe[1]]:CURRent[:DC]:NPLCycles {value}"
    type: property
    params:
      value:
        type: float
        min: 0.0005
        max: 12
    returns:
      type: float
    description: "Current integration time in NPLCs"

  current_autozero:
    getter: "[:SENSe[1]]:CURRent[:DC]:AZERo[:STATe]?"
    setter: "[:SENSe[1]]:CURRent[:DC]:AZERo[:STATe] {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "ONCE"]
    returns:
      type: string
    description: "Current autozero setting"

  # AC Current Settings
  current_ac_range:
    getter: "[:SENSe[1]]:CURRent:AC:RANGe[:UPPer]?"
    setter: "[:SENSe[1]]:CURRent:AC:RANGe[:UPPer] {value}"
    type: property
    params:
      value:
        type: float
        unit: A
        min: 0.001
        max: 10
    returns:
      type: float
      unit: A
    description: "AC current measurement range"

  current_ac_autorange:
    getter: "[:SENSe[1]]:CURRent:AC:RANGe:AUTO?"
    setter: "[:SENSe[1]]:CURRent:AC:RANGe:AUTO {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable AC current autorange"

  current_ac_bandwidth:
    getter: "[:SENSe[1]]:CURRent:AC:DETector:BANDwidth?"
    setter: "[:SENSe[1]]:CURRent:AC:DETector:BANDwidth {value}"
    type: property
    params:
      value:
        type: enum
        options: ["3", "30", "300"]
    returns:
      type: int
    description: "AC current detector bandwidth (Hz)"

  # Resistance Measurement Settings
  resistance_range:
    getter: "[:SENSe[1]]:RESistance:RANGe[:UPPer]?"
    setter: "[:SENSe[1]]:RESistance:RANGe[:UPPer] {value}"
    type: property
    params:
      value:
        type: float
        unit: Ohm
        min: 10
        max: 100000000
    returns:
      type: float
      unit: Ohm
    description: "2-wire resistance range"

  resistance_autorange:
    getter: "[:SENSe[1]]:RESistance:RANGe:AUTO?"
    setter: "[:SENSe[1]]:RESistance:RANGe:AUTO {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable resistance autorange"

  resistance_nplc:
    getter: "[:SENSe[1]]:RESistance:NPLCycles?"
    setter: "[:SENSe[1]]:RESistance:NPLCycles {value}"
    type: property
    params:
      value:
        type: float
        min: 0.0005
        max: 12
    returns:
      type: float
    description: "Resistance integration time in NPLCs"

  resistance_offset_comp:
    getter: "[:SENSe[1]]:RESistance:OCOMpensated?"
    setter: "[:SENSe[1]]:RESistance:OCOMpensated {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "AUTO"]
    returns:
      type: string
    description: "Resistance offset compensation"

  resistance_open_detector:
    getter: "[:SENSe[1]]:RESistance:ODETector?"
    setter: "[:SENSe[1]]:RESistance:ODETector {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable open detector for resistance"

  # 4-Wire Resistance Settings
  fresistance_range:
    getter: "[:SENSe[1]]:FRESistance:RANGe[:UPPer]?"
    setter: "[:SENSe[1]]:FRESistance:RANGe[:UPPer] {value}"
    type: property
    params:
      value:
        type: float
        unit: Ohm
        min: 10
        max: 100000000
    returns:
      type: float
      unit: Ohm
    description: "4-wire resistance range"

  fresistance_autorange:
    getter: "[:SENSe[1]]:FRESistance:RANGe:AUTO?"
    setter: "[:SENSe[1]]:FRESistance:RANGe:AUTO {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable 4-wire resistance autorange"

  fresistance_nplc:
    getter: "[:SENSe[1]]:FRESistance:NPLCycles?"
    setter: "[:SENSe[1]]:FRESistance:NPLCycles {value}"
    type: property
    params:
      value:
        type: float
        min: 0.0005
        max: 12
    returns:
      type: float
    description: "4-wire resistance integration time in NPLCs"

  fresistance_offset_comp:
    getter: "[:SENSe[1]]:FRESistance:OCOMpensated?"
    setter: "[:SENSe[1]]:FRESistance:OCOMpensated {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "AUTO"]
    returns:
      type: string
    description: "4-wire resistance offset compensation"

  # Temperature Measurement Settings
  temperature_transducer:
    getter: "[:SENSe[1]]:TEMPerature:TRANsducer?"
    setter: "[:SENSe[1]]:TEMPerature:TRANsducer {type}"
    type: property
    params:
      type:
        type: enum
        options: ["TC", "RTD", "FRTD", "THER"]
    returns:
      type: string
    description: "Temperature transducer type"

  temperature_thermocouple_type:
    getter: "[:SENSe[1]]:TEMPerature:TCouple:TYPE?"
    setter: "[:SENSe[1]]:TEMPerature:TCouple:TYPE {type}"
    type: property
    params:
      type:
        type: enum
        options: ["B", "E", "J", "K", "N", "R", "S", "T"]
    returns:
      type: string
    description: "Thermocouple type"

  temperature_refjunction:
    getter: "[:SENSe[1]]:TEMPerature:TCouple:RJUNction:RSELect?"
    setter: "[:SENSe[1]]:TEMPerature:TCouple:RJUNction:RSELect {type}"
    type: property
    params:
      type:
        type: enum
        options: ["INTernal", "SIMulated", "EXTernal"]
    returns:
      type: string
    description: "Reference junction type"

  temperature_simulated_ref:
    getter: "[:SENSe[1]]:TEMPerature:TCouple:RJUNction:SIMulated?"
    setter: "[:SENSe[1]]:TEMPerature:TCouple:RJUNction:SIMulated {value}"
    type: property
    params:
      value:
        type: float
        unit: C
        min: -200
        max: 200
    returns:
      type: float
      unit: C
    description: "Simulated reference junction temperature"

  temperature_rtd_type:
    getter: "[:SENSe[1]]:TEMPerature:RTD:FOUR?"
    setter: "[:SENSe[1]]:TEMPerature:RTD:FOUR {type}"
    type: property
    params:
      type:
        type: enum
        options: ["PT100", "PT385", "PT3916", "D100", "F100", "PT1000", "USER"]
    returns:
      type: string
    description: "4-wire RTD type"

  temperature_rtd_alpha:
    getter: "[:SENSe[1]]:TEMPerature:RTD:ALPHa?"
    setter: "[:SENSe[1]]:TEMPerature:RTD:ALPHa {value}"
    type: property
    params:
      value:
        type: float
        min: 0
        max: 0.01
    returns:
      type: float
    description: "RTD alpha coefficient (user-defined RTD)"

  temperature_rtd_beta:
    getter: "[:SENSe[1]]:TEMPerature:RTD:BETA?"
    setter: "[:SENSe[1]]:TEMPerature:RTD:BETA {value}"
    type: property
    params:
      value:
        type: float
        min: 0
        max: 1
    returns:
      type: float
    description: "RTD beta coefficient (user-defined RTD)"

  temperature_rtd_delta:
    getter: "[:SENSe[1]]:TEMPerature:RTD:DELTa?"
    setter: "[:SENSe[1]]:TEMPerature:RTD:DELTa {value}"
    type: property
    params:
      value:
        type: float
        min: 0
        max: 5
    returns:
      type: float
    description: "RTD delta coefficient (user-defined RTD)"

  temperature_rtd_zero:
    getter: "[:SENSe[1]]:TEMPerature:RTD:ZERO?"
    setter: "[:SENSe[1]]:TEMPerature:RTD:ZERO {value}"
    type: property
    params:
      value:
        type: float
        min: 0
        max: 10000
    returns:
      type: float
    description: "RTD zero resistance (user-defined RTD)"

  temperature_thermistor:
    getter: "[:SENSe[1]]:TEMPerature:THERmistor?"
    setter: "[:SENSe[1]]:TEMPerature:THERmistor {value}"
    type: property
    params:
      value:
        type: enum
        options: ["2252", "5000", "10000"]
    returns:
      type: int
    description: "Thermistor resistance at 25°C"

  temperature_unit:
    getter: "[:SENSe[1]]:TEMPerature:UNIT?"
    setter: "[:SENSe[1]]:TEMPerature:UNIT {unit}"
    type: property
    params:
      unit:
        type: enum
        options: ["C", "F", "K"]
    returns:
      type: string
    description: "Temperature unit"

  # Diode Settings
  diode_bias:
    getter: "[:SENSe[1]]:DIODe:BIAS:LEVel?"
    setter: "[:SENSe[1]]:DIODe:BIAS:LEVel {value}"
    type: property
    params:
      value:
        type: enum
        options: ["1e-05", "0.0001", "0.001", "0.01"]
    returns:
      type: float
    description: "Diode bias current level"

  # Capacitance Settings
  capacitance_range:
    getter: "[:SENSe[1]]:CAPacitance:RANGe[:UPPer]?"
    setter: "[:SENSe[1]]:CAPacitance:RANGe[:UPPer] {value}"
    type: property
    params:
      value:
        type: float
        unit: F
        min: 0.000000001
        max: 0.0001
    returns:
      type: float
      unit: F
    description: "Capacitance measurement range"

  capacitance_autorange:
    getter: "[:SENSe[1]]:CAPacitance:RANGe:AUTO?"
    setter: "[:SENSe[1]]:CAPacitance:RANGe:AUTO {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable capacitance autorange"

  # Frequency and Period Settings
  frequency_aperture:
    getter: "[:SENSe[1]]:FREQuency[:VOLTage]:APERture?"
    setter: "[:SENSe[1]]:FREQuency[:VOLTage]:APERture {value}"
    type: property
    params:
      value:
        type: float
        unit: s
        min: 0.01
        max: 10
    returns:
      type: float
      unit: s
    description: "Frequency measurement aperture time"

  frequency_threshold_autorange:
    getter: "[:SENSe[1]]:FREQuency[:VOLTage]:THReshold:RANGe:AUTO?"
    setter: "[:SENSe[1]]:FREQuency[:VOLTage]:THReshold:RANGe:AUTO {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable frequency threshold autorange"

  period_aperture:
    getter: "[:SENSe[1]]:PERiod[:VOLTage]:APERture?"
    setter: "[:SENSe[1]]:PERiod[:VOLTage]:APERture {value}"
    type: property
    params:
      value:
        type: float
        unit: s
        min: 0.01
        max: 10
    returns:
      type: float
      unit: s
    description: "Period measurement aperture time"

  # Digitize Settings
  digitize_voltage_range:
    getter: "[:SENSe[1]]:DIGitize:VOLTage:RANGe?"
    setter: "[:SENSe[1]]:DIGitize:VOLTage:RANGe {value}"
    type: property
    params:
      value:
        type: float
        unit: V
        min: 0.1
        max: 1000
    returns:
      type: float
      unit: V
    description: "Digitize voltage range"

  digitize_current_range:
    getter: "[:SENSe[1]]:DIGitize:CURRent:RANGe?"
