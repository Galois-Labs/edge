instrument:
  manufacturer: Keithley
  model: "2700"
  class: daq
  description: Multimeter/Data Acquisition System with 2-slot switching capability

identity:
  query: "*IDN?"
  pattern: "KEITHLEY.*2700"

interfaces:
  - type: gpib
    default_address: 16
  - type: serial
    port: 9600

settings:
  timeout_ms: 5000
  terminator: "\n"
  opc_query: false

commands:
  # IEEE-488.2 Common Commands
  reset:
    scpi: "*RST"
    type: write
    description: Reset instrument to *RST default conditions

  clear_status:
    scpi: "*CLS"
    type: write
    description: Clear all event registers and error queue

  identify:
    scpi: "*IDN?"
    type: query
    returns:
      type: string
    description: Query instrument identification

  operation_complete:
    scpi: "*OPC"
    type: write
    description: Set OPC bit in Standard Event Register after all pending operations complete

  operation_complete_query:
    scpi: "*OPC?"
    type: query
    returns:
      type: int
    description: Return 1 to output queue when all pending operations complete

  self_test:
    scpi: "*TST?"
    type: query
    returns:
      type: int
    description: Perform self-test and return result (0 = pass, 1 = fail)

  wait:
    scpi: "*WAI"
    type: write
    description: Wait until all previous commands are executed

  trigger:
    scpi: "*TRG"
    type: write
    description: Send bus trigger to instrument

  save_setup:
    scpi: "*SAV {location}"
    type: write
    params:
      location:
        type: int
        min: 0
        max: 3
    description: Save present setup to memory location (0-3)

  recall_setup:
    scpi: "*RCL {location}"
    type: write
    params:
      location:
        type: int
        min: 0
        max: 3
    description: Recall setup from memory location (0-3)

  event_status_enable:
    getter: "*ESE?"
    setter: "*ESE {mask}"
    type: property
    params:
      mask:
        type: int
        min: 0
        max: 255
    returns:
      type: int
    description: Event status enable register

  event_status_register:
    scpi: "*ESR?"
    type: query
    returns:
      type: int
    description: Read and clear event status register

  service_request_enable:
    getter: "*SRE?"
    setter: "*SRE {mask}"
    type: property
    params:
      mask:
        type: int
        min: 0
        max: 255
    returns:
      type: int
    description: Service request enable register

  status_byte:
    scpi: "*STB?"
    type: query
    returns:
      type: int
    description: Read status byte register

  option_query:
    scpi: "*OPT?"
    type: query
    returns:
      type: string
    description: Returns model numbers of installed switching modules

  # SENSe - Measurement Configuration
  sense_function:
    getter: ":SENS:FUNC?"
    setter: ":SENS:FUNC \"{function}\""
    type: property
    params:
      function:
        type: enum
        options: ["VOLT:DC", "VOLT:AC", "CURR:DC", "CURR:AC", "RES", "FRES", "TEMP", "FREQ", "PER", "CONT"]
    returns:
      type: string
    description: Select measurement function

  data_latest:
    scpi: ":SENS:DATA:LAT?"
    type: query
    returns:
      type: float
    description: Return the last reading
    streamable: true

  data_fresh:
    scpi: ":SENS:DATA:FRES?"
    type: query
    returns:
      type: float
    description: Return the last fresh reading
    streamable: true

  # Voltage DC Configuration
  voltage_dc_range:
    getter: ":SENS:VOLT:DC:RANG?"
    setter: ":SENS:VOLT:DC:RANG {value}"
    type: property
    params:
      value:
        type: float
        unit: V
        min: 0
        max: 1010
    returns:
      type: float
      unit: V
    description: DC voltage measurement range

  voltage_dc_range_auto:
    getter: ":SENS:VOLT:DC:RANG:AUTO?"
    setter: ":SENS:VOLT:DC:RANG:AUTO {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: Enable/disable DC voltage auto-ranging

  voltage_dc_nplc:
    getter: ":SENS:VOLT:DC:NPLC?"
    setter: ":SENS:VOLT:DC:NPLC {value}"
    type: property
    params:
      value:
        type: float
        min: 0.01
        max: 60
        default: 5.0
    returns:
      type: float
    description: DC voltage integration rate in power line cycles

  voltage_dc_aperture:
    getter: ":SENS:VOLT:DC:APER?"
    setter: ":SENS:VOLT:DC:APER {value}"
    type: property
    params:
      value:
        type: float
        unit: s
        min: 0.000167
        max: 1
    returns:
      type: float
      unit: s
    description: DC voltage integration rate in seconds

  voltage_dc_digits:
    getter: ":SENS:VOLT:DC:DIG?"
    setter: ":SENS:VOLT:DC:DIG {value}"
    type: property
    params:
      value:
        type: int
        min: 4
        max: 7
        default: 7
    returns:
      type: int
    description: DC voltage measurement resolution in digits

  voltage_dc_reference:
    getter: ":SENS:VOLT:DC:REF?"
    setter: ":SENS:VOLT:DC:REF {value}"
    type: property
    params:
      value:
        type: float
        unit: V
        min: -1010
        max: 1010
    returns:
      type: float
      unit: V
    description: DC voltage relative reference value

  voltage_dc_reference_state:
    getter: ":SENS:VOLT:DC:REF:STAT?"
    setter: ":SENS:VOLT:DC:REF:STAT {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: Enable/disable DC voltage relative

  voltage_dc_reference_acquire:
    scpi: ":SENS:VOLT:DC:REF:ACQ"
    type: write
    description: Use input signal as DC voltage relative reference

  voltage_dc_filter_state:
    getter: ":SENS:VOLT:DC:AVER:STAT?"
    setter: ":SENS:VOLT:DC:AVER:STAT {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: Enable/disable DC voltage filter

  voltage_dc_filter_type:
    getter: ":SENS:VOLT:DC:AVER:TCON?"
    setter: ":SENS:VOLT:DC:AVER:TCON {type}"
    type: property
    params:
      type:
        type: enum
        options: ["MOV", "REP"]
    returns:
      type: string
    description: DC voltage filter type (moving or repeat)

  voltage_dc_filter_count:
    getter: ":SENS:VOLT:DC:AVER:COUN?"
    setter: ":SENS:VOLT:DC:AVER:COUN {count}"
    type: property
    params:
      count:
        type: int
        min: 1
        max: 100
        default: 10
    returns:
      type: int
    description: DC voltage filter count

  voltage_dc_filter_window:
    getter: ":SENS:VOLT:DC:AVER:WIND?"
    setter: ":SENS:VOLT:DC:AVER:WIND {value}"
    type: property
    params:
      value:
        type: float
