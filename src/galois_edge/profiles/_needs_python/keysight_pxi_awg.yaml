instrument:
  manufacturer: "Keysight"
  model: "PXI AWG"
  class: signal_generator
  description: "Keysight PXI AWG"

identity:
  query: "*IDN?"
  pattern: "Keysight.*(M3201|M3202|M3300|M3302)"

interfaces:
  - type: gpib

settings:
  timeout_ms: 1000
  terminator: "\n"
  opc_query: false


