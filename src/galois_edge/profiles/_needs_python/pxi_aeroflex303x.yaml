instrument:
  manufacturer: "Aeroflex"
  model: "303x Digitizer"
  class: digitizer
  description: "Aeroflex 303x Digitizer"

identity:
  query: "*IDN?"
  pattern: "Aeroflex.*303x\ Digitizer"

interfaces:
  - type: gpib

settings:
  timeout_ms: 5000
  terminator: "\n"
  opc_query: false


