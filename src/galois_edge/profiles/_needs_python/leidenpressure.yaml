instrument:
  manufacturer: "Leiden"
  model: "Pressure"
  class: instrument
  description: "Leiden Pressure"

identity:
  query: "*IDN?"
  pattern: "Leiden.*Pressure"

interfaces:
  - type: gpib

settings:
  timeout_ms: 5000
  terminator: "\n"
  opc_query: false


