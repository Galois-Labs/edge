instrument:
  manufacturer: "Ocean"
  model: "Optics Spectrometer"
  class: spectrometer
  description: "Ocean Optics Spectrometer"

identity:
  query: "*IDN?"
  pattern: "Ocean.*Optics\ Spectrometer"

interfaces:
  - type: gpib

settings:
  timeout_ms: 5000
  terminator: "\n"
  opc_query: false


