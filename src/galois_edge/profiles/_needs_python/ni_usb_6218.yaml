instrument:
  manufacturer: "NI"
  model: "USB 6218"
  class: instrument
  description: "NI USB 6218"

identity:
  query: "*IDN?"
  pattern: "NI.*USB\ 6218"

interfaces:
  - type: gpib

settings:
  timeout_ms: 5000
  terminator: "\n"
  opc_query: false


