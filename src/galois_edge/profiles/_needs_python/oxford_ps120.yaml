instrument:
  manufacturer: "Oxford"
  model: "PS 120"
  class: instrument
  description: "Oxford PS 120"

identity:
  query: "*IDN?"
  pattern: "Oxford.*PS\ 120"

interfaces:
  - type: gpib

settings:
  timeout_ms: 5000
  terminator: "\r"
  opc_query: false


