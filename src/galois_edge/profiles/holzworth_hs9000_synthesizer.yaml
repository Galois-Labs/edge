# Holzworth HS9000 Synthesizer Instrument Profile
# Converted from Labber driver (MIT licensed, (c) 2015 Lab Control Software Scandinavia AB)
# Original driver: Holzworth_HS9000_Synthesizer
# NOTE: Original Labber driver includes custom Python logic not captured here

instrument:
  manufacturer: "Holzworth"
  model: "HS9000 Synthesizer"
  class: signal_generator
  description: "Holzworth HS9000 Synthesizer"

identity:
  query: "*IDN?"
  pattern: "Holzworth.*(HS9004A|HS9003A|HS9002A|HS9001A)"

interfaces:
  - type: gpib
  - type: ethernet
    port: 9760

settings:
  timeout_ms: 2000
  terminator: "\n"
  opc_query: false

commands:
  # IEEE-488.2 Common Commands
  reset:
    scpi: "*RST"
    type: write
    description: "Reset instrument to default settings"
  clear_status:
    scpi: "*CLS"
    type: write
    description: "Clear all event registers and error queue"
  identify:
    scpi: "*IDN?"
    type: query
    returns:
      type: string
    description: "Query instrument identification"
  operation_complete:
    scpi: "*OPC"
    type: write
    description: "Set OPC bit when all pending operations complete"
  operation_complete_query:
    scpi: "*OPC?"
    type: query
    returns:
      type: int
    description: "Return 1 when all pending operations complete"
  self_test:
    scpi: "*TST?"
    type: query
    returns:
      type: int
    description: "Perform self-test (0=pass)"

  # Instrument-Specific Commands (converted from Labber)
  ch1_output:
    getter: ":CH1:PWR:RF?"
    setter: ":CH1:PWR:RF:{value}"
    type: property
    params:
      value:
        type: enum
        options: ["ON", "OFF"]
    returns:
      type: bool
    description: "Ch1 - Output"
  ch1_frequency:
    getter: ":CH1:FREQ:<*>Hz?"
    setter: ":CH1:FREQ:{value}Hz"
    type: property
    params:
      value:
        type: float
        unit: Hz
        min: 10000000.0
        max: 12500000000.0
    returns:
      type: float
      unit: Hz
    description: "Ch1 - Frequency"
  ch1_power:
    getter: ":CH1:PWR?"
    setter: ":CH1:PWR:{value}DBM"
    type: property
    params:
      value:
        type: float
        unit: dBm
        min: -23.0
        max: 20.0
    returns:
      type: float
      unit: dBm
    description: "Ch1 - Power"
  ch1_phase:
    getter: ":CH1:PHASE?"
    setter: ":CH1:PHASE:{value}DEG"
    type: property
    params:
      value:
        type: float
        unit: deg
        min: 0.0
        max: 360.0
    returns:
      type: float
      unit: deg
    description: "Ch1 - Phase"
  ch1_modulation:
    getter: ":CH1:MOD:MODE?"
    setter: ":CH1:MOD:MODE:{value}"
    type: property
    params:
      value:
        type: enum
        options: ["OFF", "PULSE:EXT"]
    returns:
      type: string
    description: "Ch1 - Modulation"
  ch2_output:
    getter: ":CH2:PWR:RF?"
    setter: ":CH2:PWR:RF:{value}"
    type: property
    params:
      value:
        type: enum
        options: ["ON", "OFF"]
    returns:
