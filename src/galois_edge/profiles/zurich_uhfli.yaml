sequences:
  frequency_sweep:
    description: "Perform a frequency sweep measurement"
    params:
      demod:
        type: int
        default: 0
      start_freq:
        type: float
        unit: Hz
      stop_freq:
        type: float
        unit: Hz
      num_points:
        type: int
        default: 100
    steps:
      - command: oscillator_frequency
        args:
          n: "{demod}"
          value: "{start_freq}"
      - command: demod_enable
        args:
          n: "{demod}"
          state: "1"
    returns: null

  lock_in_measurement:
    description: "Perform a basic lock-in measurement"
    params:
      demod:
        type: int
        default: 0
      osc_freq:
        type: float
        unit: Hz
      time_constant:
        type: float
        unit: s
        default: 0.001
    steps:
      - command: oscillator_frequency
        args:
          n: "{demod}"
          value: "{osc_freq}"
      - command: demod_timeconstant
        args:
          n: "{demod}"
          value: "{time_constant}"
      - command: demod_enable
        args:
          n: "{demod}"
          state: "1"
      - command: signal_output_on
        args:
          n: "0"
          state: "1"
    returns: null

status:
  stb:
    bit4: MAV
    bit5: ESB
    bit6: RQS
  esr:
    bit0: OPC
    bit2: QYE
    bit3: DDE
    bit4: EXE
    bit5: CME
    bit7: PON