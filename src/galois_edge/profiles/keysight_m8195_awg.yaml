    type: property
    params:
      value:
        type: enum
        options: ["POS", "NEG", "EITH"]
    returns:
      type: string
    description: "Event slope"
  send_trig_event:
    scpi: ":TRIG:BEG"
    type: write
    description: "Send trig event"
  send_advance_event:
    scpi: ":TRIG:ADV"
    type: write
    description: "Send advance event"
  channel_mode:
    getter: ":INST:DACM?"
    setter: ":INST:DACM {value}"
    type: property
    params:
      value:
        type: enum
        options: ["SING", "MARK", "DUAL", "DCD", "DCM", "FOUR"]
    returns:
      type: string
    description: "Channel mode"
  sample_rate_divider_1:
    getter: ":INST:MEM:EXT:RDIV?"
    setter: ":INST:MEM:EXT:RDIV {value}"
    type: property
    params:
      value:
        type: enum
        options: ["DIV1", "DIV2", "DIV4"]
    returns:
      type: string
    description: "Sample rate divider 1"
  sample_rate_divider_2:
    getter: ":INST:MEM:EXT:RDIV?"
    setter: ":INST:MEM:EXT:RDIV {value}"
    type: property
    params:
      value:
        type: enum
        options: ["DIV2", "DIV4"]
    returns:
      type: string
    description: "Sample rate divider 2"
  sample_rate_divider_3:
    getter: ":INST:MEM:EXT:RDIV?"
    setter: ":INST:MEM:EXT:RDIV {value}"
    type: property
    params:
      value:
        type: enum
