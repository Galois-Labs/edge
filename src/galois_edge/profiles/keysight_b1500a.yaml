instrument:
  manufacturer: "Keysight"
  model: "B1500A"
  class: parameter_analyzer
  description: "Semiconductor Device Analyzer with integrated SMU, HRSMU, HCSMU, MCSMU, HVSMU, MFCMU, and SPGU modules"

identity:
  query: "*IDN?"
  pattern: "(Keysight|Agilent) Technologies,B15[0-9][0-9]A"

interfaces:
  - type: gpib
    default_address: 17
  - type: usb
  - type: ethernet
    port: 5025

settings:
  timeout_ms: 5000
  terminator: "\n"
  opc_query: true

commands:
  reset:
    scpi: "*RST"
    type: write
    description: "Reset instrument to initial settings"

  clear_status:
    scpi: "*CLS"
    type: write
    description: "Clear status registers and error queue"

  identify:
    scpi: "*IDN?"
    type: query
    returns:
      type: string
    description: "Query instrument identification"

  operation_complete:
    scpi: "*OPC"
    type: write
    description: "Set OPC bit after all pending operations complete"

  operation_complete_query:
    scpi: "*OPC?"
    type: query
    returns:
      type: int
    description: "Return 1 when all pending operations complete"

  self_test:
    scpi: "*TST? {slot}"
    type: query
    params:
      slot:
        type: int
        min: 0
        max: 11
        default: 0
    returns:
      type: int
    description: "Perform self-test and return result (0=pass)"

  wait:
    scpi: "*WAI"
    type: write
    description: "Wait until all previous commands are executed"

  trigger:
    scpi: "*TRG"
    type: write
    description: "Send bus trigger to instrument"

  save_setup:
    scpi: "*SAV {location}"
    type: write
    params:
      location:
        type: int
        min: 0
        max: 4
    description: "Save present setup to memory location"

  recall_setup:
    scpi: "*RCL {location}"
    type: write
    params:
      location:
        type: int
        min: 0
        max: 4
    description: "Recall setup from memory location"

  service_request_enable:
    getter: "*SRE?"
    setter: "*SRE {mask}"
    type: property
    params:
      mask:
        type: int
        min: 0
        max: 255
    returns:
      type: int
    description: "Service request enable register"

  status_byte:
    scpi: "*STB?"
    type: query
    returns:
      type: int
    description: "Read status byte register"

  calibrate:
    scpi: "CA {slot}"
    type: write
    params:
      slot:
        type: int
        min: 1
        max: 11
    description: "Perform self-calibration for specified slot"

  calibrate_query:
    scpi: "*CAL? {slot}"
    type: query
    params:
      slot:
        type: int
        min: 0
        max: 11
        default: 0
    returns:
      type: int
    description: "Perform self-calibration and return result"

  calibration_mode:
    getter: "CM?"
    setter: "CM {mode}"
    type: property
    params:
      mode:
        type: int
        options: ["0", "1"]
    returns:
      type: int
    description: "Set SMU auto-calibration ON/OFF"

  diagnostics:
    scpi: "DIAG? {item}"
    type: query
    params:
      item:
        type: int
        min: 1
        max: 7
    returns:
      type: int
    description: "Perform diagnostics and return result"

  recover_channels:
    scpi: "RCV {slot}"
    type: write
    params:
      slot:
        type: int
        min: 0
        max: 11
        default: 0
    description: "Enable modules that failed self-test or calibration"

  abort:
    scpi: "AB"
    type: write
    description: "Abort present operation and subsequent command execution"

  channel_enable:
    scpi: "CN {chnum}"
    type: write
    params:
      chnum:
        type: int
        min: 1
        max: 1002
    description: "Enable specified channels"

  channel_disable:
    scpi: "CL {chnum}"
    type: write
    params:
      chnum:
        type: int
        min: 1
        max: 1002
    description: "Disable specified channels"

  channel_zero:
    scpi: "IN {chnum}"
    type: write
    params:
      chnum:
        type: int
        min: 1
        max: 1002
    description: "Set specified channels to 0V"

  channel_store_zero:
    scpi: "DZ {chnum}"
    type: write
    params:
      chnum:
        type: int
        min: 1
        max: 1002
    description: "Store channel setup and set output to 0V"

  channel_restore:
    scpi: "RZ {chnum}"
    type: write
    params:
      chnum:
        type: int
        min: 1
        max: 1002
    description: "Return channel to settings stored by DZ"

  channel_translate:
    scpi: "ACH {actual},{program}"
    type: write
    params:
      actual:
        type: int
        min: 1
        max: 1002
      program:
        type: int
        min: 1
        max: 1002
    description: "Translate channel number for compatibility"

  filter_enable:
    getter: "FL?"
    setter: "FL {mode},{chnum}"
    type: property
    params:
      mode:
        type: int
        options: ["0", "1"]
      chnum:
        type: int
        min: 1
        max: 1002
    returns:
      type: int
    description: "Enable/disable internal filter"

  series_resistor:
    getter: "SSR?"
    setter: "SSR {chnum},{mode}"
    type: property
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      mode:
        type: int
        options: ["0", "1"]
    returns:
      type: int
    description: "Set internal series resistor ON/OFF"

  format:
    getter: "FMT?"
    setter: "FMT {format},{mode}"
    type: property
    params:
      format:
        type: int
        min: 1
        max: 25
      mode:
        type: int
        options: ["0", "1"]
        default: 0
    returns:
      type: int
    description: "Set measurement data output format"

  buffer_clear:
    scpi: "BC"
    type: write
    description: "Clear B1500 output data buffer"

  adc_type:
    getter: "AAD?"
    setter: "AAD {chnum},{type}"
    type: property
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      type:
        type: int
        options: ["0", "1", "2"]
    returns:
      type: int
    description: "Select type of A/D converter"

  integration_time:
    getter: "AIT?"
    setter: "AIT {type},{mode},{N}"
    type: property
    params:
      type:
        type: int
        options: ["0", "1", "2"]
      mode:
        type: int
        options: ["0", "1", "2", "3"]
      N:
        type: float
        min: 0
        max: 100
    returns:
      type: string
    description: "Set operation mode and parameter of ADC"

  averaging:
    getter: "AV?"
    setter: "AV {number},{mode}"
    type: property
    params:
      number:
        type: int
        min: 1
        max: 1023
        default: 1
      mode:
        type: int
        options: ["0", "1"]
        default: 0
    returns:
      type: string
    description: "Set number of samples for averaging"

  auto_zero:
    getter: "AZ?"
    setter: "AZ {mode}"
    type: property
    params:
      mode:
        type: int
        options: ["0", "1"]
    returns:
      type: int
    description: "Enable/disable ADC zero function"

  source_voltage:
    scpi: "DV {chnum},{range},{output},{comp},{polarity},{crange}"
    type: write
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      range:
        type: int
      output:
        type: float
        unit: V
      comp:
        type: float
        unit: A
      polarity:
        type: int
        options: ["0", "1"]
      crange:
        type: int
    description: "Apply DC voltage from SMU"

  source_voltage_timed:
    scpi: "TDV {chnum},{range},{output},{comp},{polarity},{crange}"
    type: query
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      range:
        type: int
      output:
        type: float
        unit: V
      comp:
        type: float
        unit: A
      polarity:
        type: int
        options: ["0", "1"]
      crange:
        type: int
    returns:
      type: float
      unit: s
    description: "Apply voltage and return time from timer reset"

  source_current:
    scpi: "DI {chnum},{range},{output},{comp},{polarity},{vrange}"
    type: write
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      range:
        type: int
      output:
        type: float
        unit: A
      comp:
        type: float
        unit: V
      polarity:
        type: int
        options: ["0", "1"]
      vrange:
        type: int
    description: "Apply DC current from SMU"

  source_current_timed:
    scpi: "TDI {chnum},{range},{output},{comp},{polarity},{vrange}"
    type: query
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      range:
        type: int
      output:
        type: float
        unit: A
      comp:
        type: float
        unit: V
      polarity:
        type: int
        options: ["0", "1"]
      vrange:
        type: int
    returns:
      type: float
      unit: s
    description: "Apply current and return time from timer reset"

  mfcmu_frequency:
    getter: "FC?"
    setter: "FC {chnum},{freq}"
    type: property
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      freq:
        type: float
        unit: Hz
        min: 1000
        max: 5000000
    returns:
      type: float
      unit: Hz
    description: "Set output signal frequency of MFCMU"

  mfcmu_ac_voltage:
    getter: "ACV?"
    setter: "ACV {chnum},{level}"
    type: property
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      level:
        type: float
        unit: V
        min: 0
        max: 0.25
    returns:
      type: float
      unit: V
    description: "Set AC signal level and start output"

  mfcmu_dc_voltage:
    getter: "DCV?"
    setter: "DCV {chnum},{voltage}"
    type: property
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      voltage:
        type: float
        unit: V
    returns:
      type: float
      unit: V
    description: "Apply DC voltage from MFCMU"

  mfcmu_dc_voltage_timed:
    scpi: "TDCV {chnum},{voltage}"
    type: query
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      voltage:
        type: float
        unit: V
    returns:
      type: float
      unit: s
    description: "Apply DC voltage and return time from timer reset"

  voltage_range:
    getter: "RV?"
    setter: "RV {chnum},{range}"
    type: property
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      range:
        type: int
    returns:
      type: int
    description: "Set voltage measurement range"

  current_range:
    getter: "RI?"
    setter: "RI {chnum},{range}"
    type: property
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      range:
        type: int
    returns:
      type: int
    description: "Set current measurement range"

  current_range_mode:
    getter: "RM?"
    setter: "RM {chnum},{mode},{rate}"
    type: property
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      mode:
        type: int
        options: ["1", "2", "3"]
      rate:
        type: int
        min: 11
        max: 100
        default: 50
    returns:
      type: string
    description: "Set auto range operation for current measurement"

  impedance_range:
    getter: "RC?"
    setter: "RC {chnum},{mode},{range}"
    type: property
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      mode:
        type: int
        options: ["0", "2"]
      range:
        type: int
    returns:
      type: string
    description: "Set MFCMU measurement range or ranging type"

  measurement_mode:
    getter: "MM?"
    setter: "MM {mode},{chnum}"
    type: property
    params:
      mode:
        type: int
        min: 1
        max: 28
      chnum:
        type: int
        min: 1
        max: 1002
    returns:
      type: string
    description: "Set measurement mode and measurement channels"

  channel_measurement_mode:
    getter: "CMM?"
    setter: "CMM {chnum},{mode}"
    type: property
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      mode:
        type: int
        options: ["0", "1", "2", "3"]
    returns:
      type: int
    description: "Set SMU measurement operation mode"

  impedance_mode:
    getter: "IMP?"
    setter: "IMP {mode}"
    type: property
    params:
      mode:
        type: int
    returns:
      type: int
    description: "Set impedance measurement parameters"

  monitor_enable:
    getter: "LMN?"
    setter: "LMN {mode}"
    type: property
    params:
      mode:
        type: int
        options: ["0", "1"]
    returns:
      type: int
    description: "Enable/disable OSC level/DC bias monitor output"

  wait_time:
    getter: "WAT?"
    setter: "WAT {type},{time}"
    type: property
    params:
      type:
        type: int
        options: ["0", "1"]
      time:
        type: float
        unit: s
        min: 0
        max: 655.35
    returns:
      type: string
    description: "Set source/measurement wait time"

  sweep_timing:
    getter: "WT?"
    setter: "WT {hold},{delay},{sdelay},{tdelay},{mdelay}"
    type: property
    params:
      hold:
        type: float
        unit: s
        min: 0
        max: 655.35
      delay:
        type: float
        unit: s
        min: 0
        max: 65.535
      sdelay:
        type: float
        unit: s
        min: 0
        max: 1
      tdelay:
        type: float
        unit: s
        min: 0
        max: 65.535
      mdelay:
        type: float
        unit: s
        min: 0
        max: 65.535
    returns:
      type: string
    description: "Set sweep timing parameters"

  pulse_timing:
    getter: "PT?"
    setter: "PT {hold},{width},{period},{tdelay}"
    type: property
    params:
      hold:
        type: float
        unit: s
        min: 0
        max: 655.35
      width:
        type: float
        unit: s
        min: 0.00005
        max: 2
      period:
        type: float
        unit: s
        min: 0.001
        max: 10
      tdelay:
        type: float
        unit: s
        min: 0
        max: 65.535
    returns:
      type: string
    description: "Set pulse timing parameters"

  voltage_sweep:
    scpi: "WV {chnum},{mode},{range},{start},{stop},{step},{comp},{pcomp}"
    type: write
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      mode:
        type: int
        options: ["1", "2", "3"]
      range:
        type: int
      start:
        type: float
        unit: V
      stop:
        type: float
        unit: V
      step:
        type: int
        min: 1
        max: 1001
      comp:
        type: float
        unit: A
      pcomp:
        type: float
    description: "Set staircase voltage sweep source"

  current_sweep:
    scpi: "WI {chnum},{mode},{range},{start},{stop},{step},{comp},{pcomp}"
    type: write
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      mode:
        type: int
        options: ["1", "2", "3"]
      range:
        type: int
      start:
        type: float
        unit: A
      stop:
        type: float
        unit: A
      step:
        type: int
        min: 1
        max: 1001
      comp:
        type: float
        unit: V
      pcomp:
        type: float
    description: "Set staircase current sweep source"

  voltage_sweep_sync:
    scpi: "WSV {chnum},{range},{start},{stop},{comp},{pcomp}"
    type: write
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      range:
        type: int
      start:
        type: float
        unit: V
      stop:
        type: float
        unit: V
      comp:
        type: float
        unit: A
      pcomp:
        type: float
    description: "Set synchronous voltage sweep source"

  current_sweep_sync:
    scpi: "WSI {chnum},{range},{start},{stop},{comp},{pcomp}"
    type: write
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      range:
        type: int
      start:
        type: float
        unit: A
      stop:
        type: float
        unit: A
      comp:
        type: float
        unit: V
      pcomp:
        type: float
    description: "Set synchronous current sweep source"

  pulse_voltage:
    scpi: "PV {chnum},{range},{base},{pulse},{comp}"
    type: write
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      range:
        type: int
      base:
        type: float
        unit: V
      pulse:
        type: float
        unit: V
      comp:
        type: float
        unit: A
    description: "Set pulsed voltage source"

  pulse_current:
    scpi: "PI {chnum},{range},{base},{pulse},{comp}"
    type: write
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      range:
        type: int
      base:
        type: float
        unit: A
      pulse:
        type: float
        unit: A
      comp:
        type: float
        unit: V
    description: "Set pulsed current source"

  pulse_voltage_sweep:
    scpi: "PWV {chnum},{mode},{range},{base},{start},{stop},{step},{comp}"
    type: write
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      mode:
        type: int
        options: ["1", "2", "3"]
      range:
        type: int
      base:
        type: float
        unit: V
      start:
        type: float
        unit: V
      stop:
        type: float
        unit: V
      step:
        type: int
        min: 1
        max: 1001
      comp:
        type: float
        unit: A
    description: "Set pulsed voltage sweep source"

  pulse_current_sweep:
    scpi: "PWI {chnum},{mode},{range},{base},{start},{stop},{step},{comp}"
    type: write
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      mode:
        type: int
        options: ["1", "2", "3"]
      range:
        type: int
      base:
        type: float
        unit: A
      start:
        type: float
        unit: A
      stop:
        type: float
        unit: A
      step:
        type: int
        min: 1
        max: 1001
      comp:
        type: float
        unit: V
    description: "Set pulsed current sweep source"

  sweep_abort:
    getter: "WM?"
    setter: "WM {abort},{post}"
    type: property
    params:
      abort:
        type: int
        options: ["1", "2"]
      post:
        type: int
        options: ["0", "1", "2"]
    returns:
      type: string
    description: "Set automatic abort function for sweep"

  measure_current_fast:
    scpi: "TI {chnum},{range}"
    type: query
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      range:
        type: int
    returns:
      type: float
      unit: A
    description: "Measure current (high speed)"
    streamable: true

  measure_voltage_fast:
    scpi: "TV {chnum},{range}"
    type: query
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      range:
        type: int
    returns:
      type: float
      unit: V
    description: "Measure voltage (high speed)"
    streamable: true

  measure_current_voltage_fast:
    scpi: "TIV {chnum},{irange},{vrange}"
    type: query
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      irange:
        type: int
      vrange:
        type: int
    returns:
      type: array
      element_type: float
      separator: ","
    description: "Measure current and voltage (high speed)"
    streamable: true

  measure_impedance_fast:
    scpi: "TC {chnum},{mode},{range}"
    type: query
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      mode:
        type: int
      range:
        type: int
    returns:
      type: array
      element_type: float
      separator: ","
    description: "Measure impedance (high speed)"
    streamable: true

  measure_current_timed_fast:
    scpi: "TTI {chnum},{range}"
    type: query
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      range:
        type: int
    returns:
      type: array
      element_type: float
      separator: ","
    description: "Measure current with time stamp (high speed)"

  measure_voltage_timed_fast:
    scpi: "TTV {chnum},{range}"
    type: query
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      range:
        type: int
    returns:
      type: array
      element_type: float
      separator: ","
    description: "Measure voltage with time stamp (high speed)"

  measure_current_voltage_timed_fast:
    scpi: "TTIV {chnum},{irange},{vrange}"
    type: query
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      irange:
        type: int
      vrange:
        type: int
    returns:
      type: array
      element_type: float
      separator: ","
    description: "Measure current and voltage with time stamp (high speed)"

  measure_impedance_timed_fast:
    scpi: "TTC {chnum},{mode},{range}"
    type: query
    params:
      chnum:
        type: int
        min: 1
        max: 1002
      mode:
        type: int
      range:
        type: int
    returns:
      type: array
      element_type: float
      separator: ","
    description: "Measure impedance with time stamp (high speed)"

  execute:
    scpi: "XE"
    type: write
    description: "Execute measurement and return data"

  number_of_data:
    scpi: "NUB?"
    type: query
    returns:
      type: int
    description: "Return number of measurement data items in buffer"

  sweep_points:
    scpi: "WNU?"
    type: query
    returns:
      type: int
    description: "Return number of sweep steps"

  output_zero_check:
    scpi: "WZ?"
    type: query
    returns:
      type: int
    description: "Return 0 if all output <=2V, 1 if any >2V"

  time_stamp_enable:
    getter: "TSC?"
    setter: "TSC {enable}"
    type: property
    params:
      enable:
        type: int
        options: ["0", "1"]
    returns:
      type: int
    description: "Enable time stamp function"

  time_stamp_reset:
    scpi: "TSR {chnum}"
    type: write
    params:
      chnum:
        type: int
        min: 1
        max: 10
    description: "Clear timer count"

  time_stamp_query:
    scpi: "TSQ"
    type: query
    returns:
      type: float
      unit: s
    description: "Return time data from timer reset"

  trigger_mode:
    getter: "TM?"
    setter: "TM {mode}"
    type: property
    params:
      mode:
        type: int
        options: ["1", "2", "3", "4"]
    returns:
      type: int
    description: "Set event to start measurement"

  trigger_port:
    scpi: "TGP {port},{terminal},{polarity},{type}"
    type: write
    params:
      port:
        type: int
