instrument:
  manufacturer: Quantifi Photonics
  model: LASER 1100
  class: laser
  description: Tunable Laser Source
protocol: scpi
identity:
  query: '*IDN?'
  pattern: Quantifi Photonics.*LASER.*
interfaces:
- type: ethernet
settings:
  timeout_ms: 5000
  terminator: '

    '
  opc_query: true
commands:
  clear:
    scpi: '*CLS'
    type: write
    description: Clear session message queues
  identify:
    scpi: '*IDN?'
    type: query
    returns:
      type: string
    description: Query the CohesionSCPI service identification
  operation_complete:
    scpi: '*OPC?'
    type: query
    returns:
      type: int
    description: Query the Operation Complete Status
  query_options:
    scpi: '*OPT?'
    type: query
    returns:
      type: string
    description: Query the modules managed by the CohesionSCPI service
  query_event_status:
    scpi: '*ESR?'
    type: query
    returns:
      type: int
    description: Query the Standard Event Status Register
  query_chassis:
    scpi: :SYSTEM:CHASSIS?
    type: query
    returns:
      type: string
    description: Query the Chassis Mode configuration
  query_chassis_list:
    scpi: :SYSTEM:CHASSIS? LIST
    type: query
    returns:
      type: string
    description: Query list of valid chassis index numbers
  query_chassis_mode:
    scpi: :SYSTEM:CHASSIS? MODE
    type: query
    returns:
      type: string
    description: Query current Chassis Mode
  set_chassis_mode:
    scpi: :SYSTEM:CHASSIS {mode}
    type: write
    params:
      mode:
        type: enum
        options:
        - SINGLE
        - MULTI
    description: Set the Chassis Mode configuration
  slot_operation_complete:
    scpi: :SLOT{slot}:OPC?
    type: query
    params:
      slot:
        type: int
        min: 1
        max: 18
    returns:
      type: int
    description: Query the Operation Complete Status of the module
  slot_options:
    scpi: :SLOT{slot}:OPTions?
    type: query
    params:
      slot:
        type: int
        min: 1
        max: 18
    returns:
      type: string
    description: Query the modules managed by the CohesionSCPI service
  slot_identify:
    scpi: :SLOT{slot}:IDN?
    type: query
    params:
      slot:
        type: int
        min: 1
        max: 18
    returns:
      type: string
    description: Query the slot identification
  output_state:
    getter: :OUTPut{source}:CHANnel{channel}:STATE?
    setter: :OUTPut{source}:CHANnel{channel}:STATE {state}
    type: property
    params:
      source:
        type: int
        min: 1
        max: 18
      channel:
        type: int
        min: 1
        max: 4
      state:
        type: enum
        options:
        - 'ON'
        - 'OFF'
    returns:
      type: string
    description: Set or query the optical output state of the laser
  power:
    getter: :SOURce{source}:CHANnel{channel}:POWer?
    setter: :SOURce{source}:CHANnel{channel}:POWer {value}
    type: property
    params:
      source:
        type: int
        min: 1
        max: 18
      channel:
        type: int
        min: 1
        max: 4
      value:
        type: float
        unit: dBm
    returns:
      type: float
      unit: dBm
    description: Set or query the laser output power
  power_min:
    scpi: :SOURce{source}:CHANnel{channel}:POWer? MIN
    type: query
    params:
      source:
        type: int
        min: 1
        max: 18
      channel:
        type: int
        min: 1
        max: 4
    returns:
      type: float
      unit: dBm
    description: Query minimum programmable power value
  power_max:
    scpi: :SOURce{source}:CHANnel{channel}:POWer? MAX
