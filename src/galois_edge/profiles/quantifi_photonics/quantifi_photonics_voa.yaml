instrument:
  manufacturer: Quantifi Photonics
  model: VOA
  class: voa
  description: Variable Optical Attenuator
protocol: scpi
identity:
  query: '*IDN?'
  pattern: Quantifi Photonics.*VOA.*
interfaces:
- type: ethernet
settings:
  timeout_ms: 5000
  terminator: '

    '
  opc_query: true
commands:
  clear_status:
    scpi: '*CLS'
    type: write
    description: Clear session message queues
  identify:
    scpi: '*IDN?'
    type: query
    returns:
      type: string
    description: Query the instrument identification
  operation_complete:
    scpi: '*OPC?'
    type: query
    returns:
      type: int
    description: Query the Operation Complete Status
  query_options:
    scpi: '*OPT?'
    type: query
    returns:
      type: string
    description: Query the modules installed in the instrument
  query_event_status:
    scpi: '*ESR?'
    type: query
    returns:
      type: int
      min: 0
      max: 255
    description: Query the Standard Event Status Register
  slot_operation_complete:
    scpi: :SLOT{slot}:OPC?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: int
    description: Query the Operation Complete Status of the module
  slot_options:
    scpi: :SLOT{slot}:OPTions?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: string
    description: Query installed modules
  slot_identify:
    scpi: :SLOT{slot}:IDN?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: string
    description: Query the module identification
  slot_test:
    scpi: :SLOT{slot}:TeST?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: int
    description: Query the module self-test status
  slot_reset:
    scpi: :SLOT{slot}:ReSeT
    type: write
    params:
      slot:
        type: int
        min: 1
    description: Reset the module to default power-on settings
  trigger_arm_state:
    getter: :TRIGger{trigger}:ARM?
    setter: :TRIGger{trigger}:ARM {state}
    type: property
    params:
      trigger:
        type: int
        min: 1
      state:
        type: enum
        options:
        - ENABLE
        - DISABLE
    returns:
      type: string
    description: Trigger ARMed state
  control_mode:
    getter: :CONTrol{slot}:CHANnel{channel}:MODE?
    setter: :CONTrol{slot}:CHANnel{channel}:MODE {mode}
    type: property
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      mode:
        type: enum
        options:
        - ATT
        - POW
    returns:
      type: string
    description: Control mode
  attenuation_mode:
    getter: :INPut{slot}:CHANnel{channel}:AMODE?
    setter: :INPut{slot}:CHANnel{channel}:AMODE {mode}
    type: property
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      mode:
        type: enum
        options:
        - ABS
        - REL
        - OFFSET
    returns:
      type: string
    description: Attenuation mode
  query_attenuation:
    scpi: :INPut{slot}:CHANnel{channel}:ATTenuation? {param}
    type: query
    streamable: true
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ACT
        - ALL
    returns:
      type: string
      unit: dB
    description: Query the attenuation
  set_attenuation:
    scpi: :INPut{slot}:CHANnel{channel}:ATTenuation {value} {unit}
    type: write
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      value:
        type: float
      unit:
        type: enum
        options:
        - DB
        - MDB
        default: DB
    description: Set the attenuation
  query_attenuation_offset:
    scpi: :INPut{slot}:CHANnel{channel}:OFFSet? {param}
    type: query
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ALL
    returns:
      type: string
      unit: dB
    description: Query the attenuation mode offset
  set_attenuation_offset:
    scpi: :INPut{slot}:CHANnel{channel}:OFFSet {value} {unit}
    type: write
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      value:
        type: float
      unit:
        type: enum
        options:
        - DB
        - MDB
        default: DB
    description: Set the attenuation mode offset
  query_input_power:
    scpi: :INPut{slot}:CHANnel{channel}:POWer? {param}
    type: query
    streamable: true
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ACT
        - ALL
    returns:
      type: string
      unit: dBm
    description: Query the input optical power
  query_input_wavelength:
    scpi: :INPut{slot}:CHANnel{channel}:WAVelength? {param}
    type: query
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ALL
    returns:
      type: string
      unit: nm
    description: Query the input optical wavelength configuration
  set_input_wavelength:
    scpi: :INPut{slot}:CHANnel{channel}:WAVelength {value} {unit}
    type: write
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      value:
        type: float
      unit:
        type: enum
        options:
        - NM
        - M
        - MM
        - UM
        - PM
        default: NM
    description: Set the input optical wavelength configuration
  query_output_offset:
    scpi: :OUTPut{slot}:CHANnel{channel}:OFFSet? {param}
    type: query
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ALL
    returns:
      type: string
      unit: dB
    description: Query the output power offset
  set_output_offset:
    scpi: :OUTPut{slot}:CHANnel{channel}:OFFSet {value} {unit}
    type: write
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      value:
        type: float
      unit:
        type: enum
        options:
        - DB
        - MDB
        default: DB
    description: Set the output power offset
  query_output_power:
    scpi: :OUTPut{slot}:CHANnel{channel}:POWer? {param}
    type: query
    streamable: true
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ACT
        - ALL
    returns:
      type: string
      unit: dBm
    description: Query the output optical power
  set_output_power:
    scpi: :OUTPut{slot}:CHANnel{channel}:POWer {value} {unit}
    type: write
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      value:
        type: float
      unit:
        type: enum
        options:
        - DB
        - MDB
        default: DB
    description: Set the output optical power
  query_averaging_time:
    scpi: :OUTPut{slot}:CHANnel{channel}:POWer:AVERagingtime? {param}
    type: query
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ALL
    returns:
      type: string
      unit: s
    description: Query the output power averaging time
  set_averaging_time:
    scpi: :OUTPut{slot}:CHANnel{channel}:POWer:AVERagingtime {value} {unit}
    type: write
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      value:
        type: float
      unit:
        type: enum
        options:
        - S
        - MS
        - US
        - NS
        default: S
    description: Set the output power averaging time
  perform_nulling:
    scpi: :OUTPut{slot}:CHANnel{channel}:POWer:NULLing
    type: write
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
    description: Perform dark current nulling on the channel
  query_nulling_time:
    scpi: :OUTPut{slot}:CHANnel{channel}:POWer:TIMEnulling?
    type: query
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
    returns:
      type: float
      unit: s
    description: Query the amount of time remaining for dark current nulling to complete
  query_trace_complete:
    scpi: :OUTPut{slot}:TRACE:CoMPlete?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: int
    description: Query the trace completion status
  query_trace_points:
    scpi: :OUTPut{slot}:TRACE:PoinTS? {param}
    type: query
    params:
      slot:
        type: int
        min: 1
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ALL
    returns:
      type: string
    description: Query the number of trace buffer data elements
  set_trace_points:
    scpi: :OUTPut{slot}:TRACE:PoinTS {value}
    type: write
    params:
      slot:
        type: int
        min: 1
      value:
        type: int
        min: 1
        max: 1024
    description: Set the number of trace buffer data elements
  query_trace_rate:
    scpi: :OUTPut{slot}:TRACE:RATE? {param}
    type: query
    params:
      slot:
        type: int
        min: 1
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ALL
    returns:
      type: string
      unit: Hz
    description: Query the trace buffer sampling rate
  set_trace_rate:
    scpi: :OUTPut{slot}:TRACE:RATE {value}
    type: write
    params:
      slot:
        type: int
        min: 1
      value:
        type: float
    description: Set the trace buffer sampling rate
  set_trace_trigger:
    scpi: :OUTPut{slot}:TRACE:TRIGger {mode}
    type: write
    params:
      slot:
        type: int
        min: 1
      mode:
        type: enum
        options:
        - STOP
        - IMMEDIATE
        - FORCE
    description: Set the trace trigger mode
  query_trace_data:
    scpi: :OUTPut{slot}:TRACE{channel}?
    type: query
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
    returns:
      type: string
      unit: dBm
    description: Query the trace buffer
subsystems:
  CONTrol:
    description: Control subsystem
    commands:
    - control_mode
  INPut:
    description: Input subsystem
    commands:
    - attenuation_mode
    - query_attenuation
    - set_attenuation
    - query_attenuation_offset
    - set_attenuation_offset
    - query_input_power
    - query_input_wavelength
    - set_input_wavelength
  OUTPut:
    description: Output subsystem
    commands:
    - query_output_offset
    - set_output_offset
    - query_output_power
    - set_output_power
    - query_averaging_time
    - set_averaging_time
    - perform_nulling
    - query_nulling_time
    - query_trace_complete
    - query_trace_points
    - set_trace_points
    - query_trace_rate
    - set_trace_rate
    - set_trace_trigger
    - query_trace_data
  SLOT:
    description: Slot subsystem
    commands:
    - slot_operation_complete
    - slot_options
    - slot_identify
    - slot_test
    - slot_reset
  TRIGger:
    description: Trigger subsystem
    commands:
    - trigger_arm_state
