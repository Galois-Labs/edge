instrument:
  manufacturer: Quantifi Photonics
  model: SWITCH
  class: switch
  description: Optical Switch
protocol: scpi
identity:
  query: '*IDN?'
  pattern: Quantifi Photonics,.*SWITCH.*
interfaces:
- type: ethernet
settings:
  timeout_ms: 5000
  terminator: '

    '
  opc_query: true
commands:
  clear_status:
    scpi: '*CLS'
    type: write
    description: Clear session message queues
  identify:
    scpi: '*IDN?'
    type: query
    returns:
      type: string
    description: Query the instrument identification
  operation_complete:
    scpi: '*OPC?'
    type: query
    returns:
      type: int
    description: Query the Operation Complete Status
  query_options:
    scpi: '*OPT?'
    type: query
    returns:
      type: string
    description: Query the modules installed in the instrument
  query_event_status:
    scpi: '*ESR?'
    type: query
    returns:
      type: int
      min: 0
      max: 255
    description: Query the Standard Event Status Register
  slot_operation_complete:
    scpi: :SLOT{slot}:OPC?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: int
    description: Query the Operation Complete Status of the module
  slot_options:
    scpi: :SLOT{slot}:OPTions?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: string
    description: Query installed modules
  slot_identify:
    scpi: :SLOT{slot}:IDN?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: string
    description: Query the module identification
  route_error:
    scpi: :ROUTe{route}:ERROR?
    type: query
    params:
      route:
        type: int
        min: 1
    returns:
      type: int
    description: Query the error status of the SWITCH
  channel_error:
    scpi: :ROUTe{route}:CHANnel{channel}:ERROR?
    type: query
    params:
      route:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
    returns:
      type: int
    description: Query the error status of the specified channel of the SWITCH
  channel_state:
    getter: :ROUTe{route}:CHANnel{channel}:STATE? {mode}
    setter: :ROUTe{route}:CHANnel{channel}:STATE {value}
    type: property
    streamable: true
    params:
      route:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      mode:
        type: enum
        options:
        - SET
        - ACT
        - ACTUAL
        - ALL
        default: SET
      value:
        type: int
    returns:
      type: string
    description: Query or set the routing state of the SWITCH
subsystems:
  Common:
    description: Common IEEE-488.2 commands
    commands:
    - clear_status
    - identify
    - operation_complete
    - query_options
    - query_event_status
  Slot:
    description: Slot management commands
    commands:
    - slot_operation_complete
    - slot_options
    - slot_identify
  Route:
    description: Routing configuration commands
    commands:
    - route_error
    - channel_error
    - channel_state
