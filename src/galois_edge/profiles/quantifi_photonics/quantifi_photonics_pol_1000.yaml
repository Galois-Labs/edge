instrument:
  manufacturer: Quantifi Photonics
  model: POL 1000
  class: polarization_controller
  description: Polarization Controller
protocol: scpi
identity:
  query: '*IDN?'
  pattern: Quantifi Photonics,.*POL.*
interfaces:
- type: ethernet
settings:
  timeout_ms: 5000
  terminator: '

    '
  opc_query: true
commands:
  clear_status:
    scpi: '*CLS'
    type: write
    description: Clear session message queues
  identify:
    scpi: '*IDN?'
    type: query
    returns:
      type: string
    description: Query the instrument identification
  operation_complete:
    scpi: '*OPC?'
    type: query
    returns:
      type: int
    description: Query the Operation Complete Status
  query_options:
    scpi: '*OPT?'
    type: query
    returns:
      type: string
    description: Query the modules installed in the instrument
  query_event_status:
    scpi: '*ESR?'
    type: query
    returns:
      type: int
      min: 0
      max: 255
    description: Query the Standard Event Status Register
  slot_operation_complete:
    scpi: :SLOT{slot}:OPC?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: int
    description: Query the Operation Complete Status of the module
  slot_options:
    scpi: :SLOT{slot}:OPTions?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: string
    description: Query installed modules
  slot_identify:
    scpi: :SLOT{slot}:IDN?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: string
    description: Query the module identification
  slot_reset:
    scpi: :SLOT{slot}:ReSeT
    type: write
    params:
      slot:
        type: int
        min: 1
    description: Reset the module to default power-on settings
  slot_test:
    scpi: :SLOT{slot}:TeST?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: int
    description: Query the module self-test status
  output_state:
    getter: :OUTPut{output}:CHANnel{channel}:STATE?
    setter: :OUTPut{output}:CHANnel{channel}:STATE {state}
    type: property
    params:
      output:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      state:
        type: enum
        options:
        - 'ON'
        - 'OFF'
        - '0'
        - '1'
    returns:
      type: string
    description: Set or query the state of the POL channel
  pol_mode:
    getter: :POL{pol}:CHANnel{channel}:MODE?
    setter: :POL{pol}:CHANnel{channel}:MODE {mode}
    type: property
    params:
      pol:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      mode:
        type: enum
        options:
        - MANUAL
        - SCRAMBLE
        - '0'
        - '1'
    returns:
      type: string
    description: Set or query the control mode of the POL channel
  manual_setpoint:
    getter: :POL{pol}:CHANnel{channel}:MANUal:SET{controller}?
    setter: :POL{pol}:CHANnel{channel}:MANUal:SET{controller} {value}
    type: property
    params:
      pol:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      controller:
        type: int
        min: 1
        max: 3
      value:
        type: float
        min: 0.0
        max: 1.0
    returns:
      type: float
    description: Set or query the set-point of one of the polarization controllers
  scramble_frequency:
    getter: :POL{pol}:CHANnel{channel}:SCRAmble:FREQuency{controller}?
    setter: :POL{pol}:CHANnel{channel}:SCRAmble:FREQuency{controller} {value}
    type: property
    params:
      pol:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      controller:
        type: int
        min: 1
        max: 3
      value:
        type: float
        min: 0.0
        max: 10.002
        unit: Hz
    returns:
      type: float
      unit: Hz
    description: Set or query the frequency of one of the polarization controllers
  scramble_function:
    getter: :POL{pol}:CHANnel{channel}:SCRAmble:FUNCtion{controller}?
    setter: :POL{pol}:CHANnel{channel}:SCRAmble:FUNCtion{controller} {function}
    type: property
    params:
      pol:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      controller:
        type: int
        min: 1
        max: 3
      function:
        type: enum
        options:
        - SINE
        - SIN
        - TRIANGLE
        - TRI
        - RANDOM
        - RAND
        - '0'
        - '1'
        - '2'
    returns:
      type: string
    description: Set or query the function of one of the polarization controllers
  scramble_phase:
    getter: :POL{pol}:CHANnel{channel}:SCRAmble:PHASe{controller}?
    setter: :POL{pol}:CHANnel{channel}:SCRAmble:PHASe{controller} {value}
    type: property
    params:
      pol:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      controller:
        type: int
        min: 1
        max: 3
      value:
        type: float
        min: 0.0
        max: 6.283
        unit: rad
    returns:
      type: float
      unit: rad
    description: Set or query the phase of one of the polarization controllers
subsystems:
  SLOT:
    description: Slot subsystem
    commands:
    - slot_operation_complete
    - slot_options
    - slot_identify
    - slot_reset
    - slot_test
  OUTPUT:
    description: Output subsystem
    commands:
    - output_state
  POL:
    description: Polarization control subsystem
    commands:
    - pol_mode
    - manual_setpoint
    - scramble_frequency
    - scramble_function
    - scramble_phase
