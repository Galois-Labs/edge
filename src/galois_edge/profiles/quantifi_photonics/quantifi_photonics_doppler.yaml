instrument:
  manufacturer: Quantifi Photonics
  model: DOPPLER
  class: power_meter
  description: Doppler MATRIQ Optical Power Meter
protocol: scpi
identity:
  query: '*IDN?'
  pattern: Quantifi Photonics.*DOPPLER.*
interfaces:
- type: ethernet
settings:
  timeout_ms: 5000
  terminator: '

    '
  opc_query: true
commands:
  clear:
    scpi: '*CLS'
    type: write
    description: Clear session message queues
  identify:
    scpi: '*IDN?'
    type: query
    returns:
      type: string
    description: Query the instrument identification
  operation_complete:
    scpi: '*OPC?'
    type: query
    returns:
      type: int
    description: Query the Operation Complete Status
  query_options:
    scpi: '*OPT?'
    type: query
    returns:
      type: string
    description: Query the modules installed in the instrument
  query_event_status:
    scpi: '*ESR?'
    type: query
    returns:
      type: int
      min: 0
      max: 255
    description: Query the Standard Event Status Register
  query_chassis:
    scpi: :SYSTEM:CHASSIS?
    type: query
    returns:
      type: string
    description: Query the Chassis Mode configuration
  query_chassis_list:
    scpi: :SYSTEM:CHASSIS? LIST
    type: query
    returns:
      type: string
    description: Query list of valid chassis index numbers
  query_chassis_mode:
    scpi: :SYSTEM:CHASSIS? MODE
    type: query
    returns:
      type: string
    description: Query current Chassis Mode
  set_chassis_mode:
    scpi: :SYSTEM:CHASSIS {mode}
    type: write
    params:
      mode:
        type: enum
        options:
        - SINGLE
        - MULTI
    description: Set the Chassis Mode configuration
  slot_operation_complete:
    scpi: :SLOT{slot}:OPC?
    type: query
    params:
      slot:
        type: int
        min: 1
        max: 18
    returns:
      type: int
    description: Query the Operation Complete Status of the module
  slot_options:
    scpi: :SLOT{slot}:OPTions?
    type: query
    params:
      slot:
        type: int
        min: 1
        max: 18
    returns:
      type: string
    description: Query installed modules
  slot_identify:
    scpi: :SLOT{slot}:IDN?
    type: query
    params:
      slot:
        type: int
        min: 1
        max: 18
    returns:
      type: string
    description: Query the module identification
  slot_test:
    scpi: :SLOT{slot}:TeST?
    type: query
    params:
      slot:
        type: int
        min: 1
        max: 18
    returns:
      type: int
    description: Query the module self-test status
  slot_reset:
    scpi: :SLOT{slot}:ReSeT
    type: write
    params:
      slot:
        type: int
        min: 1
        max: 18
    description: Reset the module to default power-on settings
  trigger_arm_state:
    getter: :TRIGger{slot}:ARM?
    setter: :TRIGger{slot}:ARM {state}
    type: property
    params:
      slot:
        type: int
        min: 1
        max: 18
      state:
        type: enum
        options:
        - ENABLE
        - DISABLE
    returns:
      type: string
    description: Trigger ARMed state
  control_mode:
    getter: :CONTrol{slot}:CHANnel{channel}:MODE?
    setter: :CONTrol{slot}:CHANnel{channel}:MODE {mode}
    type: property
    params:
      slot:
        type: int
        min: 1
        max: 18
      channel:
        type: int
        min: 1
      mode:
        type: enum
        options:
        - ATT
        - POW
    returns:
      type: string
    description: Control mode
  input_attenuation_mode:
    getter: :INPut{slot}:CHANnel{channel}:AMODE?
    setter: :INPut{slot}:CHANnel{channel}:AMODE {mode}
    type: property
    params:
      slot:
        type: int
        min: 1
        max: 18
      channel:
        type: int
        min: 1
      mode:
        type: enum
        options:
        - ABS
        - REL
        - OFFSET
    returns:
      type: string
    description: Attenuation mode
  query_input_attenuation:
    scpi: :INPut{slot}:CHANnel{channel}:ATTenuation? {param}
    type: query
    params:
      slot:
        type: int
        min: 1
        max: 18
      channel:
        type: int
        min: 1
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ACT
        - ALL
    returns:
      type: string
    description: Query the attenuation
  set_input_attenuation:
    scpi: :INPut{slot}:CHANnel{channel}:ATTenuation {value} {unit}
    type: write
    params:
      slot:
        type: int
        min: 1
        max: 18
      channel:
        type: int
        min: 1
      value:
        type: float
      unit:
        type: enum
        options:
        - DB
        - MDB
        default: DB
    description: Set the attenuation
  input_offset:
    getter: :INPut{slot}:CHANnel{channel}:OFFSet? {param}
    setter: :INPut{slot}:CHANnel{channel}:OFFSet {value} {unit}
    type: property
    params:
      slot:
        type: int
        min: 1
        max: 18
      channel:
        type: int
        min: 1
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ALL
      value:
        type: float
      unit:
        type: enum
        options:
        - DB
        - MDB
        default: DB
    returns:
      type: string
    description: Attenuation mode offset
  query_input_power:
    scpi: :INPut{slot}:CHANnel{channel}:POWer? {param}
    type: query
    params:
      slot:
        type: int
        min: 1
        max: 18
      channel:
        type: int
        min: 1
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ACT
        - ALL
    returns:
      type: string
      unit: dBm
    description: Query the input optical power
  input_wavelength:
    getter: :INPut{slot}:CHANnel{channel}:WAVelength? {param}
    setter: :INPut{slot}:CHANnel{channel}:WAVelength {value} {unit}
    type: property
    params:
      slot:
        type: int
        min: 1
        max: 18
      channel:
        type: int
        min: 1
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ALL
      value:
        type: float
      unit:
        type: enum
        options:
        - NM
        - M
        - MM
        - UM
        - PM
        default: NM
    returns:
      type: string
      unit: nm
    description: Input optical wavelength configuration
  output_offset:
    getter: :OUTPut{slot}:CHANnel{channel}:OFFSet? {param}
    setter: :OUTPut{slot}:CHANnel{channel}:OFFSet {value} {unit}
    type: property
    params:
      slot:
        type: int
        min: 1
        max: 18
      channel:
        type: int
        min: 1
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ALL
      value:
        type: float
      unit:
        type: enum
        options:
        - DB
        - MDB
        default: DB
    returns:
      type: string
    description: Output attenuation mode offset
  output_power:
    getter: :OUTPut{slot}:CHANnel{channel}:POWer? {param}
    setter: :OUTPut{slot}:CHANnel{channel}:POWer {value} {unit}
    type: property
    params:
      slot:
        type: int
        min: 1
        max: 18
      channel:
        type: int
        min: 1
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ACT
        - ALL
      value:
        type: float
      unit:
        type: enum
        options:
        - DB
        - MDB
        default: DB
    returns:
      type: string
      unit: dBm
    description: Constant power output
  output_averaging_time:
    getter: :OUTPut{slot}:CHANnel{channel}:POWer:AVERagingtime? {param}
    setter: :OUTPut{slot}:CHANnel{channel}:POWer:AVERagingtime {value} {unit}
    type: property
    params:
      slot:
        type: int
        min: 1
        max: 18
      channel:
        type: int
        min: 1
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ALL
      value:
        type: float
      unit:
        type: enum
        options:
        - S
        - MS
        - US
        - NS
        default: S
    returns:
      type: string
      unit: s
    description: Output power averaging time
  output_nulling:
    scpi: :OUTPut{slot}:CHANnel{channel}:POWer:NULLing
    type: write
    params:
      slot:
        type: int
        min: 1
        max: 18
      channel:
        type: int
        min: 1
    description: Perform dark current nulling on the channel
  query_nulling_time:
    scpi: :OUTPut{slot}:CHANnel{channel}:POWer:TIMEnulling?
    type: query
    params:
      slot:
        type: int
        min: 1
        max: 18
      channel:
        type: int
        min: 1
    returns:
      type: float
      unit: s
    description: Query the amount of time remaining for dark current nulling to complete
  query_trace_complete:
    scpi: :OUTPut{slot}:TRACE:CoMPlete?
    type: query
    params:
      slot:
        type: int
        min: 1
        max: 18
    returns:
      type: int
    description: Query the trace completion status
  trace_points:
    getter: :OUTPut{slot}:TRACE:PoinTS? {param}
    setter: :OUTPut{slot}:TRACE:PoinTS {value}
    type: property
    params:
      slot:
        type: int
        min: 1
        max: 18
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ALL
      value:
        type: int
        min: 1
        max: 1024
    returns:
      type: string
    description: Number of trace buffer data elements
  trace_rate:
    getter: :OUTPut{slot}:TRACE:RATE? {param}
    setter: :OUTPut{slot}:TRACE:RATE {value}
    type: property
    params:
      slot:
        type: int
        min: 1
        max: 18
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ALL
      value:
        type: float
        unit: Hz
    returns:
      type: string
      unit: Hz
    description: Trace buffer sampling rate
  trace_trigger:
    scpi: :OUTPut{slot}:TRACE:TRIGger {mode}
    type: write
    params:
      slot:
        type: int
        min: 1
        max: 18
      mode:
        type: enum
        options:
        - STOP
        - IMMEDIATE
        - FORCE
    description: Set the trace trigger mode
  query_trace_data:
    scpi: :OUTPut{slot}:TRACE{channel}?
    type: query
    params:
      slot:
        type: int
        min: 1
        max: 18
      channel:
        type: int
        min: 1
    returns:
      type: string
      unit: dBm
    description: Query the trace buffer
subsystems:
  SYSTEM:
    description: System configuration
    commands:
    - query_chassis
    - query_chassis_list
    - query_chassis_mode
    - set_chassis_mode
  SLOT:
    description: Module slot control
    commands:
    - slot_operation_complete
    - slot_options
    - slot_identify
    - slot_test
    - slot_reset
  TRIGger:
    description: Trigger control
    commands:
    - trigger_arm_state
  CONTrol:
    description: Control mode configuration
    commands:
    - control_mode
  INPut:
    description: Input configuration
    commands:
    - input_attenuation_mode
    - query_input_attenuation
    - set_input_attenuation
    - input_offset
    - query_input_power
    - input_wavelength
  OUTPut:
    description: Output configuration and trace control
    commands:
    - output_offset
    - output_power
    - output_averaging_time
    - output_nulling
    - query_nulling_time
    - query_trace_complete
    - trace_points
    - trace_rate
    - trace_trigger
    - query_trace_data
