instrument:
  manufacturer: Quantifi Photonics
  model: O2E
  class: power_meter
  description: Optical-to-Electrical Converter
protocol: scpi
identity:
  query: '*IDN?'
  pattern: Quantifi Photonics.*O2E.*
interfaces:
- type: ethernet
- type: pxi
settings:
  timeout_ms: 5000
  terminator: '

    '
  opc_query: false
commands:
  clear_status:
    scpi: '*CLS'
    type: write
    description: Clear session message queues
  identify:
    scpi: '*IDN?'
    type: query
    returns:
      type: string
    description: Query the instrument identification
  operation_complete:
    scpi: '*OPC?'
    type: query
    returns:
      type: int
    description: Query the Operation Complete Status
  query_options:
    scpi: '*OPT?'
    type: query
    returns:
      type: string
    description: Query the modules installed in the instrument
  query_event_status:
    scpi: '*ESR?'
    type: query
    returns:
      type: int
      min: 0
      max: 255
    description: Query the Standard Event Status Register
  slot_operation_complete:
    scpi: :SLOT{slot}:OPC?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: int
    description: Query the Operation Complete Status of the module
  slot_options:
    scpi: :SLOT{slot}:OPTions?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: string
    description: Query installed modules
  slot_identify:
    scpi: :SLOT{slot}:IDN?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: string
    description: Query the module identification
  trigger_arm_state:
    getter: :TRIGger{trigger}:ARM?
    setter: :TRIGger{trigger}:ARM {state}
    type: property
    params:
      trigger:
        type: int
        min: 1
      state:
        type: enum
        options:
        - ENABLE
        - DISABLE
    returns:
      type: string
    description: Trigger ARMed state
  input_power:
    scpi: :INPut{input}:CHANnel{channel}:PDPower? {param}
    type: query
    params:
      input:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 2
      param:
        type: enum
        options:
        - MIN
        - MAX
        - ACT
        - ALL
        default: ACT
    returns:
      type: float
      unit: dBm
    description: Query the input optical power
  perform_nulling:
    scpi: :INPut{input}:CHANnel{channel}:PDPower:NULLing
    type: write
    params:
      input:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 2
    description: Perform dark current nulling on the channel
  nulling_time_remaining:
    scpi: :INPut{input}:CHANnel{channel}:PDPower:TIMEnulling?
    type: query
    params:
      input:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 2
    returns:
      type: float
      unit: s
    description: Query the amount of time remaining for dark current nulling to complete
  averaging_time:
    getter: :INPut{input}:CHANnel{channel}:PDPower:AVERagingtime? {param}
    setter: :INPut{input}:CHANnel{channel}:PDPower:AVERagingtime {value}
    type: property
    params:
      input:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 2
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ALL
        default: SET
      value:
        type: float
        unit: s
    returns:
      type: float
      unit: s
    description: Measurement averaging time
  wavelength:
    getter: :INPut{input}:CHANnel{channel}:WAVelength? {param}
    setter: :INPut{input}:CHANnel{channel}:WAVelength {value} {unit}
    type: property
    params:
      input:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 2
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ALL
        default: SET
      value:
        type: float
      unit:
        type: enum
        options:
        - NM
        - M
        - MM
        - UM
        - PM
        default: NM
    returns:
      type: float
      unit: nm
    description: Input optical wavelength configuration
  calibration_data:
    scpi: :INPut{input}:CHANnel{channel}:CALibration? {wavelength},{param}
    type: query
    params:
      input:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 2
      wavelength:
        type: float
        unit: nm
      param:
        type: enum
        options:
        - PHASE
        - MAG
        - FREQ
    returns:
      type: string
    description: Query the S21 response calibration values
  rf_output:
    getter: :INPut{input}:CHANnel{channel}:RF?
    setter: :INPut{input}:CHANnel{channel}:RF {state}
    type: property
    params:
      input:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 2
      state:
        type: enum
        options:
        - 'ON'
        - 'OFF'
    returns:
      type: string
    description: RF output state
  trace_complete:
    scpi: :INPut{input}:TRACE:CoMPlete?
    type: query
    params:
      input:
        type: int
        min: 1
    returns:
      type: int
    description: Query the trace completion status
  trace_points:
    getter: :INPut{input}:TRACE:PoinTS? {param}
    setter: :INPut{input}:TRACE:PoinTS {value}
    type: property
    params:
      input:
        type: int
        min: 1
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ALL
        default: SET
      value:
        type: int
        min: 1
        max: 1024
    returns:
      type: int
    description: Number of trace buffer data elements
  trace_rate:
    getter: :INPut{input}:TRACE:RATE? {param}
    setter: :INPut{input}:TRACE:RATE {value}
    type: property
    params:
      input:
        type: int
        min: 1
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ALL
        default: SET
      value:
        type: float
        unit: Hz
    returns:
      type: float
      unit: Hz
    description: Trace buffer sampling rate
  trace_trigger:
    scpi: :INPut{input}:TRACE:TRIGger {mode}
    type: write
    params:
      input:
        type: int
        min: 1
      mode:
        type: enum
        options:
        - STOP
        - IMMEDIATE
        - FORCE
    description: Set the trace trigger mode
  trace_data:
    scpi: :INPut{input}:TRACE{channel}?
    type: query
    params:
      input:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 2
    returns:
      type: string
    description: Query the trace buffer
  output_gain:
    scpi: :OUTPut{output}:CHANnel{channel}:GAIN? {param}
    type: query
    params:
      output:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 2
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ALL
        default: SET
    returns:
      type: float
      unit: V/W
    description: Query the values for the conversion gain
subsystems:
  Common:
    description: IEEE 488.2 common commands
    commands:
    - clear_status
    - identify
    - operation_complete
    - query_options
    - query_event_status
  Slot:
    description: Slot management commands
    commands:
    - slot_operation_complete
    - slot_options
    - slot_identify
  Trigger:
    description: Trigger control
    commands:
    - trigger_arm_state
  Input:
    description: Input channel configuration and measurement
    commands:
    - input_power
    - perform_nulling
    - nulling_time_remaining
    - averaging_time
    - wavelength
    - calibration_data
    - rf_output
  Trace:
    description: Trace acquisition and control
    commands:
    - trace_complete
    - trace_points
    - trace_rate
    - trace_trigger
    - trace_data
  Output:
    description: Output channel configuration
    commands:
    - output_gain
