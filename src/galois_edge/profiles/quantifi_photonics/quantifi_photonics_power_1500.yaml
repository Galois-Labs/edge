instrument:
  manufacturer: Quantifi Photonics
  model: POWER 1500
  class: power_meter
  description: Power Meter 1500 Series
protocol: scpi
identity:
  query: '*IDN?'
  pattern: Quantifi Photonics.*POWER.?1500.*
interfaces:
- type: ethernet
settings:
  timeout_ms: 5000
  terminator: '

    '
  opc_query: false
commands:
  clear:
    scpi: '*CLS'
    type: write
    description: Clear session message queues
  identify:
    scpi: '*IDN?'
    type: query
    returns:
      type: string
    description: Query the instrument identification
  operation_complete:
    scpi: '*OPC?'
    type: query
    returns:
      type: int
    description: Query the Operation Complete Status
  query_options:
    scpi: '*OPT?'
    type: query
    returns:
      type: string
    description: Query the modules installed in the instrument
  slot_operation_complete:
    scpi: :SLOT{slot}:OPC?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: int
    description: Query the Operation Complete Status of the module
  slot_options:
    scpi: :SLOT{slot}:OPTions?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: string
    description: Query installed modules
  slot_identify:
    scpi: :SLOT{slot}:IDN?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: string
    description: Query the module identification
  slot_test:
    scpi: :SLOT{slot}:TeST?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: int
    description: Query the module self-test status
  slot_reset:
    scpi: :SLOT{slot}:ReSeT
    type: write
    params:
      slot:
        type: int
        min: 1
    description: Reset the module to default power-on settings
  trigger_arm_state:
    getter: :TRIGger{trigger}:ARM?
    setter: :TRIGger{trigger}:ARM {state}
    type: property
    params:
      trigger:
        type: int
        min: 1
      state:
        type: enum
        options:
        - ENABLE
        - DISABLE
    returns:
      type: string
    description: Trigger ARMed state
  analog_gain:
    scpi: :OUTPut{output}:CHANnel{channel}:ANALOG:GAIN?
    type: query
    params:
      output:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
    returns:
      type: float
      unit: dBm/V
    description: Query the applied analog gain
  analog_offset:
    scpi: :OUTPut{output}:CHANnel{channel}:ANALOG:OFFSet?
    type: query
    params:
      output:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
    returns:
      type: float
      unit: dBm
    description: Query the applied analog offset
  analog_rct:
    scpi: :OUTPut{output}:CHANnel{channel}:ANALOG:RCT?
    type: query
    params:
      output:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
    returns:
      type: string
    description: Query the analog residual correction table (RCT)
  measure_power:
    scpi: :SENSe{sense}:CHANnel{channel}:POWer? {param}
    type: query
    params:
      sense:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      param:
        type: enum
        options:
        - MIN
        - MAX
        - ACT
        - ALL
        default: ACT
    returns:
      type: string
      unit: dBm
    description: Query the measured power
  power_offset:
    getter: :SENSe{sense}:CHANnel{channel}:POWer:OFFSet? {param}
    setter: :SENSe{sense}:CHANnel{channel}:POWer:OFFSet {value}
    type: property
    params:
      sense:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ALL
        default: SET
      value:
        type: float
        unit: dB
        min: -100.0
        max: 100.0
    returns:
      type: string
      unit: dBm
    description: Power measurement offset
  power_nulling:
    scpi: :SENSe{sense}:CHANnel{channel}:POWer:NULLing
    type: write
    params:
      sense:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
    description: Perform dark current nulling on the channel
  time_nulling:
    scpi: :SENSe{sense}:CHANnel{channel}:POWer:TIMEnulling?
    type: query
    params:
      sense:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
    returns:
      type: float
      unit: s
    description: Query the amount of time remaining for dark current nulling to complete
  averaging_time:
    getter: :SENSe{sense}:CHANnel{channel}:POWer:AVERagingtime? {param}
    setter: :SENSe{sense}:CHANnel{channel}:POWer:AVERagingtime {value}{unit}
    type: property
    params:
      sense:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ALL
        default: SET
      value:
        type: float
        min: 0.0
        max: 10.0
      unit:
        type: enum
        options:
        - S
        - MS
        - US
        - NS
        default: S
    returns:
      type: string
      unit: s
    description: Measurement averaging time
  wavelength:
    getter: :SENSe{sense}:CHANnel{channel}:WAVelength? {param}
    setter: :SENSe{sense}:CHANnel{channel}:WAVelength {value}{unit}
    type: property
    params:
      sense:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ALL
        default: SET
      value:
        type: float
        min: 1271
        max: 1550
      unit:
        type: enum
        options:
        - NM
        - M
        - MM
        - UM
        - PM
        default: NM
    returns:
      type: string
      unit: nm
    description: Optical wavelength configuration
  trace_complete:
    scpi: :SENSe{sense}:TRACE:CoMPlete?
    type: query
    params:
      sense:
        type: int
        min: 1
    returns:
      type: int
    description: Query the trace completion status
  trace_points:
    getter: :SENSe{sense}:TRACE:PoinTS? {param}
    setter: :SENSe{sense}:TRACE:PoinTS {value}
    type: property
    params:
      sense:
        type: int
        min: 1
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ALL
        default: SET
      value:
        type: int
        min: 1
        max: 1024
    returns:
      type: string
    description: Number of trace buffer data elements
  trace_rate:
    getter: :SENSe{sense}:TRACE:RATE? {param}
    setter: :SENSe{sense}:TRACE:RATE {value}
    type: property
    params:
      sense:
        type: int
        min: 1
      param:
        type: enum
        options:
        - MIN
        - MAX
        - DEF
        - SET
        - ALL
        default: SET
      value:
        type: float
        min: 0.183
        max: 12000.0
    returns:
      type: string
      unit: Hz
    description: Trace buffer sampling rate
  trace_trigger:
    scpi: :SENSe{sense}:TRACE:TRIG {mode}
    type: write
    params:
      sense:
        type: int
        min: 1
      mode:
        type: enum
        options:
        - STOP
        - IMMEDIATE
        - FORCE
    description: Set the trace trigger mode
  query_trace:
    scpi: :SENSe{sense}:TRACE{channel}?
    type: query
    params:
      sense:
        type: int
        min: 1
      channel:
        type: int
        min: 1
        max: 4
    returns:
      type: string
      unit: dBm
    description: Query the trace buffer
subsystems:
  SLOT:
    description: Slot subsystem
    commands:
    - slot_operation_complete
    - slot_options
    - slot_identify
    - slot_test
    - slot_reset
  TRIGger:
    description: Trigger subsystem
    commands:
    - trigger_arm_state
  OUTPut:
    description: Output subsystem
    commands:
    - analog_gain
    - analog_offset
    - analog_rct
  SENSe:
    description: Sense subsystem
    commands:
    - measure_power
    - power_offset
    - power_nulling
    - time_nulling
    - averaging_time
    - wavelength
    - trace_complete
    - trace_points
    - trace_rate
    - trace_trigger
    - query_trace
