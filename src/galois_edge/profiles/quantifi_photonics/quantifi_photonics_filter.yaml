    - slot_temperature_unit
  FILTer:
    description: Filter configuration subsystem
    commands:
    - filter_wavelength
    - filter_wavelength_set
    - filter_wavelength_scan
    - filter_frequency
    - filter_frequency_set
    - channel_wavelength
    - channel_wavelength_min
    - channel_wavelength_max
    - channel_wavelength_default
    - channel_wavelength_set
    - channel_wavelength_all
    - channel_wavelength_step
    - channel_wavelength_scan
    - channel_frequency
