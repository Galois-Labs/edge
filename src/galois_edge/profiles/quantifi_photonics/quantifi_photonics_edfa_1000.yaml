instrument:
  manufacturer: Quantifi Photonics
  model: EDFA 1000
  class: edfa
  description: Erbium Doped Fiber Amplifier
protocol: scpi
identity:
  query: '*IDN?'
  pattern: Quantifi Photonics.*EDFA.*
interfaces:
- type: ethernet
settings:
  timeout_ms: 5000
  terminator: '

    '
  opc_query: false
commands:
  clear_status:
    scpi: '*CLS'
    type: write
    description: Clear session message queues
  identify:
    scpi: '*IDN?'
    type: query
    returns:
      type: string
    description: Query the instrument identification
  operation_complete:
    scpi: '*OPC?'
    type: query
    returns:
      type: int
    description: Query the Operation Complete Status
  query_options:
    scpi: '*OPT?'
    type: query
    returns:
      type: string
    description: Query the modules installed in the instrument
  query_event_status:
    scpi: '*ESR?'
    type: query
    returns:
      type: int
      min: 0
      max: 255
    description: Query the Standard Event Status Register
  slot_operation_complete:
    scpi: :SLOT{slot}:OPC?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: int
    description: Query the Operation Complete Status of the module
  slot_options:
    scpi: :SLOT{slot}:OPTions?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: string
    description: Query installed modules
  slot_identify:
    scpi: :SLOT{slot}:IDN?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: string
    description: Query the module identification
  slot_test:
    scpi: :SLOT{slot}:TeST?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: int
    description: Query the module self-test status
  slot_reset:
    scpi: :SLOT{slot}:ReSeT
    type: write
    params:
      slot:
        type: int
        min: 1
    description: Reset the module to default power-on settings
  query_control_mode:
    scpi: :CONTrol{slot}:CHANnel{channel}:MODE?
    type: query
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
    returns:
      type: int
    description: Query the EDFA output control mode
  set_control_mode:
    scpi: :CONTrol{slot}:CHANnel{channel}:MODE {mode}
    type: write
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
      mode:
        type: enum
        options:
        - CURRent
        - POWer
        - GAIN
        - 'OFF'
        - DEF
    description: Set the EDFA output control mode
  query_input_power:
    scpi: :INPut{slot}:CHANnel{channel}:POWer?
    type: query
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
    returns:
      type: float
      unit: dBm
    description: Query the input optical power
  query_safety_interlock:
    scpi: :OUTPut{slot}:SAFEty?
    type: query
    params:
      slot:
        type: int
        min: 1
    returns:
      type: int
    description: Query the safety interlock state for the EDFA optical output
  output_state:
    getter: :OUTPut{slot}:CHANnel{channel}:STATE?
    setter: :OUTPut{slot}:CHANnel{channel}:STATE {state}
    type: property
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
      state:
        type: enum
        options:
        - 'ON'
        - 'OFF'
        - DEF
        - '0'
        - '1'
    returns:
      type: int
    description: Optical output state of the EDFA
  query_temperature:
    scpi: :SOURce{slot}:CHANnel{channel}:TEMPerature?
    type: query
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
    returns:
      type: float
      unit: C
    description: Query the EDFA temperature
  query_temperature_alarm:
    scpi: :SOURce{slot}:CHANnel{channel}:TEMPerature:ALARm?
    type: query
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
    returns:
      type: int
    description: Query the EDFA Temperature Alarm status
  output_power:
    getter: :SOURce{slot}:CHANnel{channel}:POWer?
    setter: :SOURce{slot}:CHANnel{channel}:POWer {value}
    type: property
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
      value:
        type: float
        unit: dBm
    returns:
      type: float
      unit: dBm
    description: Output optical power control point
  output_current:
    getter: :SOURce{slot}:CHANnel{channel}:CURRent?
    setter: :SOURce{slot}:CHANnel{channel}:CURRent {value}
    type: property
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
      value:
        type: float
        unit: mA
    returns:
      type: float
      unit: mA
    description: Output current control point
  output_gain:
    getter: :SOURce{slot}:CHANnel{channel}:GAIN?
    setter: :SOURce{slot}:CHANnel{channel}:GAIN {value}
    type: property
    params:
      slot:
        type: int
        min: 1
      channel:
        type: int
        min: 1
      value:
        type: float
        unit: dB
    returns:
      type: float
      unit: dB
    description: Optical output gain control point
subsystems:
  CONTrol:
    description: Control subsystem
    commands:
    - query_control_mode
    - set_control_mode
  INPut:
    description: Input subsystem
    commands:
    - query_input_power
  OUTPut:
    description: Output subsystem
    commands:
    - query_safety_interlock
    - output_state
  SOURce:
    description: Source subsystem
    commands:
    - query_temperature
    - query_temperature_alarm
    - output_power
    - output_current
    - output_gain
  SLOT:
    description: Slot subsystem
    commands:
    - slot_operation_complete
    - slot_options
    - slot_identify
    - slot_test
    - slot_reset
