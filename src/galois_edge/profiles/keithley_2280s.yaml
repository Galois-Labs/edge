sequences:
  source_and_measure:
    description: "Set voltage/current and measure output"
    params:
      voltage:
        type: float
        unit: V
        default: 0
      current:
        type: float
        unit: A
        default: 0.1
    steps:
      - command: source_voltage
        args:
          value: "{voltage}"
      - command: source_current
        args:
          value: "{current}"
      - command: output_state
        args:
          state: "ON"
      - command: initiate
      - scpi: "*WAI"
      - command: fetch
        capture: result
    returns: result

  voltage_sweep:
    description: "Perform voltage sweep measurement"
    params:
      start_voltage:
        type: float
        unit: V
      stop_voltage:
        type: float
        unit: V
      points:
        type: int
      current_limit:
        type: float
        unit: A
        default: 1.0
    steps:
      - command: reset
      - command: source_current
        args:
          value: "{current_limit}"
      - command: list_voltage
        args:
          list: "1"
          values: "sweep_values"
      - command: list_save_internal
        args:
          list: "1"
      - command: list_recall
        args:
          list: "1"
      - command: trigger_count
        args:
          count: "{points}"
      - command: list_state
        args:
          state: "ON"
      - command: output_state
        args:
          state: "ON"
      - command: initiate
      - scpi: "*WAI"
      - command: trace_data
        capture: result
      - command: output_state
        args:
          state: "OFF"
    returns: result

  current_measurement:
    description: "Measure current at specified voltage"
    params:
      voltage:
        type: float
        unit: V
      current_limit:
        type: float
        unit: A
        default: 1.0
    steps:
      - command: reset
      - command: source_voltage
        args:
          value: "{voltage}"
      - command: source_current
        args:
          value: "{current_limit}"
      - command: sense_function
        args:
          function: "CURR:DC"
      - command: output_state
        args:
          state: "ON"
      - command: measure_current
        capture: current
      - command: output_state
        args:
          state: "OFF"
    returns: current

status:
  stb:
    bit0: MSB
    bit2: EAV
    bit3: QSB
    bit4: MAV
    bit5: ESB
    bit6: RQS
    bit7: OSB