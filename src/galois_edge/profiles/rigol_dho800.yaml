instrument:
  manufacturer: "RIGOL TECHNOLOGIES CO., LTD."
  model: "DHO800/DHO900"
  class: oscilloscope
  description: "Digital Oscilloscope - DHO800 Series (70/100 MHz), DHO900 Series (125/250 MHz)"

identity:
  query: "*IDN?"
  pattern: "RIGOL TECHNOLOGIES.*,DHO[89][0-9]{2}"

interfaces:
  - type: usb
  - type: ethernet
    port: 5025
  - type: gpib
    default_address: 1

settings:
  timeout_ms: 5000
  terminator: "\n"
  opc_query: false

commands:
  # IEEE-488.2 Common Commands
  identify:
    scpi: "*IDN?"
    type: query
    returns:
      type: string
    description: "Query instrument identification"

  reset:
    scpi: "*RST"
    type: write
    description: "Reset instrument to default state"

  clear_status:
    scpi: "*CLS"
    type: write
    description: "Clear status registers and error queue"

  event_status_enable:
    getter: "*ESE?"
    setter: "*ESE {mask}"
    type: property
    params:
      mask:
        type: int
        min: 0
        max: 255
    returns:
      type: int
    description: "Event status enable register"

  event_status_register:
    scpi: "*ESR?"
    type: query
    returns:
      type: int
    description: "Read and clear event status register"

  operation_complete:
    scpi: "*OPC"
    type: write
    description: "Set operation complete bit when operations finish"

  operation_complete_query:
    scpi: "*OPC?"
    type: query
    returns:
      type: int
    description: "Query operation complete status"

  recall_setup:
    scpi: "*RCL {location}"
    type: write
    params:
      location:
        type: int
    description: "Recall setup from memory"

  save_setup:
    scpi: "*SAV {location}"
    type: write
    params:
      location:
        type: int
    description: "Save current setup to memory"

  service_request_enable:
    getter: "*SRE?"
    setter: "*SRE {mask}"
    type: property
    params:
      mask:
        type: int
        min: 0
        max: 255
    returns:
      type: int
    description: "Service request enable register"

  status_byte:
    scpi: "*STB?"
    type: query
    returns:
      type: int
    description: "Read status byte register"

  wait:
    scpi: "*WAI"
    type: write
    description: "Wait until all operations complete"

  self_test:
    scpi: "*TST?"
    type: query
    returns:
      type: int
    description: "Perform self-test (0=pass)"

  # Run/Stop Commands
  run:
    scpi: ":RUN"
    type: write
    description: "Start waveform acquisition"

  stop:
    scpi: ":STOP"
    type: write
    description: "Stop waveform acquisition"

  single:
    scpi: ":SINGle"
    type: write
    description: "Set single acquisition mode"

  force_trigger:
    scpi: ":TFORce"
    type: write
    description: "Force a trigger event"

  clear:
    scpi: ":CLEar"
    type: write
    description: "Clear waveforms from display"

  # Autoset Commands
  autoset:
    scpi: ":AUToset"
    type: write
    description: "Perform automatic setup"

  autoset_peak:
    getter: ":AUToset:PEAK?"
    setter: ":AUToset:PEAK {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable peak detection in autoset"

  autoset_open_channel:
    getter: ":AUToset:OPENch?"
    setter: ":AUToset:OPENch {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable opening channel in autoset"

  autoset_overlap:
    getter: ":AUToset:OVERlap?"
    setter: ":AUToset:OVERlap {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable overlap mode in autoset"

  autoset_keep_coupling:
    getter: ":AUToset:KEEPcoup?"
    setter: ":AUToset:KEEPcoup {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Keep coupling settings during autoset"

  autoset_lock:
    getter: ":AUToset:LOCK?"
    setter: ":AUToset:LOCK {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Lock autoset settings"

  autoset_enable:
    getter: ":AUToset:ENAble?"
    setter: ":AUToset:ENAble {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable autoset function"

  # Acquisition Commands
  acquire_averages:
    getter: ":ACQuire:AVERages?"
    setter: ":ACQuire:AVERages {count}"
    type: property
    params:
      count:
        type: int
        options: ["2", "4", "8", "16", "32", "64", "128", "256", "512", "1024"]
    returns:
      type: int
    description: "Number of averages for average acquisition"

  acquire_memory_depth:
    getter: ":ACQuire:MDEPth?"
    setter: ":ACQuire:MDEPth {depth}"
    type: property
    params:
      depth:
        type: enum
        options: ["10k", "100k", "1M", "10M", "25M", "50M", "100M", "200M", "500M", "1G"]
    returns:
      type: string
    description: "Memory depth for acquisition"

  acquire_type:
    getter: ":ACQuire:TYPE?"
    setter: ":ACQuire:TYPE {type}"
    type: property
    params:
      type:
        type: enum
        options: ["NORM", "AVER", "PEAK", "HRES"]
    returns:
      type: string
    description: "Acquisition mode type"

  acquire_sample_rate:
    scpi: ":ACQuire:SRATe?"
    type: query
    returns:
      type: float
      unit: Sa/s
    description: "Query current sample rate"

  acquire_ultra_mode:
    getter: ":ACQuire:ULTRa:MODE?"
    setter: ":ACQuire:ULTRa:MODE {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["OFF", "SEGMented", "TRACk"]
    returns:
      type: string
    description: "UltraAcquire mode"

  acquire_ultra_timeout:
    getter: ":ACQuire:ULTRa:TIMeout?"
    setter: ":ACQuire:ULTRa:TIMeout {timeout}"
    type: property
    params:
      timeout:
        type: float
        unit: s
        min: 0.001
        max: 100
    returns:
      type: float
      unit: s
    description: "UltraAcquire timeout value"

  acquire_ultra_max_frames:
    getter: ":ACQuire:ULTRa:MAXFrame?"
    setter: ":ACQuire:ULTRa:MAXFrame {frames}"
    type: property
    params:
      frames:
        type: int
        min: 2
        max: 10000
    returns:
      type: int
    description: "Maximum frames for UltraAcquire"

  # Channel Commands
  channel_display:
    getter: ":CHANnel{n}:DISPlay?"
    setter: ":CHANnel{n}:DISPlay {state}"
    type: property
    params:
      n:
        type: int
        min: 1
        max: 4
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
        map:
          "ON": 1
          "OFF": 0
    returns:
      type: bool
    description: "Enable/disable channel display"

  channel_bandwidth_limit:
    getter: ":CHANnel{n}:BWLimit?"
    setter: ":CHANnel{n}:BWLimit {limit}"
    type: property
    params:
      n:
        type: int
        min: 1
        max: 4
      limit:
        type: enum
        options: ["OFF", "20M", "100M", "200M"]
    returns:
      type: string
    description: "Channel bandwidth limit"

  channel_coupling:
    getter: ":CHANnel{n}:COUPling?"
    setter: ":CHANnel{n}:COUPling {coupling}"
    type: property
    params:
      n:
        type: int
        min: 1
        max: 4
      coupling:
        type: enum
        options: ["AC", "DC", "GND"]
    returns:
      type: string
    description: "Channel coupling mode"

  channel_invert:
    getter: ":CHANnel{n}:INVert?"
    setter: ":CHANnel{n}:INVert {state}"
    type: property
    params:
      n:
        type: int
        min: 1
        max: 4
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable channel invert"

  channel_offset:
    getter: ":CHANnel{n}:OFFSet?"
    setter: ":CHANnel{n}:OFFSet {offset}"
    type: property
    params:
      n:
        type: int
        min: 1
        max: 4
      offset:
        type: float
        unit: V
    returns:
      type: float
      unit: V
    description: "Channel vertical offset"

  channel_scale:
    getter: ":CHANnel{n}:SCALe?"
    setter: ":CHANnel{n}:SCALe {scale}"
    type: property
    params:
      n:
        type: int
        min: 1
        max: 4
      scale:
        type: float
        unit: V/div
    returns:
      type: float
      unit: V/div
    description: "Channel vertical scale"

  channel_probe:
    getter: ":CHANnel{n}:PROBe?"
    setter: ":CHANnel{n}:PROBe {ratio}"
    type: property
    params:
      n:
        type: int
        min: 1
        max: 4
      ratio:
        type: float
    returns:
      type: float
    description: "Channel probe attenuation ratio"

  channel_label_show:
    getter: ":CHANnel{n}:LABel:SHOW?"
    setter: ":CHANnel{n}:LABel:SHOW {state}"
    type: property
    params:
      n:
        type: int
        min: 1
        max: 4
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Show/hide channel label"

  channel_label_content:
    getter: ":CHANnel{n}:LABel:CONTent?"
    setter: ":CHANnel{n}:LABel:CONTent \"{text}\""
    type: property
    params:
      n:
        type: int
        min: 1
        max: 4
      text:
        type: string
    returns:
      type: string
    description: "Channel label text"

  channel_units:
    getter: ":CHANnel{n}:UNITs?"
    setter: ":CHANnel{n}:UNITs {unit}"
    type: property
    params:
      n:
        type: int
        min: 1
        max: 4
      unit:
        type: enum
        options: ["VOLT", "WATT", "AMP", "UNKN"]
    returns:
      type: string
    description: "Channel measurement units"

  channel_vernier:
    getter: ":CHANnel{n}:VERNier?"
    setter: ":CHANnel{n}:VERNier {state}"
    type: property
    params:
      n:
        type: int
        min: 1
        max: 4
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable fine adjustment"

  channel_position:
    getter: ":CHANnel{n}:POSition?"
    setter: ":CHANnel{n}:POSition {position}"
    type: property
    params:
      n:
        type: int
        min: 1
        max: 4
      position:
        type: float
        unit: div
    returns:
      type: float
      unit: div
    description: "Channel vertical position"

  channel_tcalibrate:
    scpi: ":CHANnel{n}:TCALibrate"
    type: write
    params:
      n:
        type: int
        min: 1
        max: 4
    description: "Perform channel time calibration"

  # Timebase Commands
  timebase_delay_enable:
    getter: ":TIMebase:DELay:ENABle?"
    setter: ":TIMebase:DELay:ENABle {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable delayed sweep"

  timebase_delay_offset:
    getter: ":TIMebase:DELay:OFFSet?"
    setter: ":TIMebase:DELay:OFFSet {offset}"
    type: property
    params:
      offset:
        type: float
        unit: s
    returns:
      type: float
      unit: s
    description: "Delayed timebase offset"

  timebase_delay_scale:
    getter: ":TIMebase:DELay:SCALe?"
    setter: ":TIMebase:DELay:SCALe {scale}"
    type: property
    params:
      scale:
        type: float
        unit: s/div
    returns:
      type: float
      unit: s/div
    description: "Delayed timebase scale"

  timebase_offset:
    getter: ":TIMebase[:MAIN][:OFFSet]?"
    setter: ":TIMebase[:MAIN][:OFFSet] {offset}"
    type: property
    params:
      offset:
        type: float
        unit: s
    returns:
      type: float
      unit: s
    description: "Main timebase offset"

  timebase_scale:
    getter: ":TIMebase[:MAIN]:SCALe?"
    setter: ":TIMebase[:MAIN]:SCALe {scale}"
    type: property
    params:
      scale:
        type: float
        unit: s/div
    returns:
      type: float
      unit: s/div
    description: "Main timebase scale"

  timebase_mode:
    getter: ":TIMebase:MODE?"
    setter: ":TIMebase:MODE {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["MAIN", "XY", "ROLL"]
    returns:
      type: string
    description: "Horizontal timebase mode"

  timebase_href_mode:
    getter: ":TIMebase:HREFerence:MODE?"
    setter: ":TIMebase:HREFerence:MODE {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["CENTer", "TRIGger", "USER"]
    returns:
      type: string
    description: "Horizontal reference mode"

  timebase_href_position:
    getter: ":TIMebase:HREFerence:POSition?"
    setter: ":TIMebase:HREFerence:POSition {position}"
    type: property
    params:
      position:
        type: float
    returns:
      type: float
    description: "Horizontal reference position"

  timebase_vernier:
    getter: ":TIMebase:VERNier?"
    setter: ":TIMebase:VERNier {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable timebase fine adjustment"

  timebase_hotkeys:
    getter: ":TIMebase:HOTKeys?"
    setter: ":TIMebase:HOTKeys {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable hotkeys for timebase"

  timebase_roll:
    getter: ":TIMebase:ROLL?"
    setter: ":TIMebase:ROLL {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable roll mode"

  timebase_xy_enable:
    getter: ":TIMebase:XY:ENABle?"
    setter: ":TIMebase:XY:ENABle {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable XY mode"

  timebase_xy_x:
    getter: ":TIMebase:XY:X?"
    setter: ":TIMebase:XY:X {channel}"
    type: property
    params:
      channel:
        type: enum
        options: ["CHANnel1", "CHANnel2", "CHANnel3", "CHANnel4"]
    returns:
      type: string
    description: "X-axis channel for XY mode"

  timebase_xy_y:
    getter: ":TIMebase:XY:Y?"
    setter: ":TIMebase:XY:Y {channel}"
    type: property
    params:
      channel:
        type: enum
        options: ["CHANnel1", "CHANnel2", "CHANnel3", "CHANnel4"]
    returns:
      type: string
    description: "Y-axis channel for XY mode"

  timebase_xy_z:
    getter: ":TIMebase:XY:Z?"
    setter: ":TIMebase:XY:Z {channel}"
    type: property
    params:
      channel:
        type: enum
        options: ["CHANnel1", "CHANnel2", "CHANnel3", "CHANnel4", "OFF"]
    returns:
      type: string
    description: "Z-axis channel for XY mode"

  timebase_xy_grid:
    getter: ":TIMebase:XY:GRID?"
    setter: ":TIMebase:XY:GRID {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable grid in XY mode"

  # Trigger Commands
  trigger_mode:
    getter: ":TRIGger:MODE?"
    setter: ":TRIGger:MODE {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["EDGE", "PULS", "SLOP", "VID", "PATT", "DUR", "TIM", "RUNT", "WIND", "DEL", "SHOL", "NEDG", "RS232", "IIC", "SPI", "CAN", "LIN"]
    returns:
      type: string
    description: "Trigger mode type"

  trigger_coupling:
    getter: ":TRIGger:COUPling?"
    setter: ":TRIGger:COUPling {coupling}"
    type: property
    params:
      coupling:
        type: enum
        options: ["AC", "DC", "LFR", "HFR"]
    returns:
      type: string
    description: "Trigger coupling mode"

  trigger_status:
    scpi: ":TRIGger:STATus?"
    type: query
    returns:
      type: string
    description: "Query trigger status"

  trigger_sweep:
    getter: ":TRIGger:SWEep?"
    setter: ":TRIGger:SWEep {sweep}"
    type: property
    params:
      sweep:
        type: enum
        options: ["AUTO", "NORM", "SING"]
    returns:
      type: string
    description: "Trigger sweep mode"

  trigger_holdoff:
    getter: ":TRIGger:HOLDoff?"
    setter: ":TRIGger:HOLDoff {holdoff}"
    type: property
    params:
      holdoff:
        type: float
        unit: s
        min: 0.0000001
        max: 10
    returns:
      type: float
      unit: s
    description: "Trigger holdoff time"

  trigger_nreject:
    getter: ":TRIGger:NREJect?"
    setter: ":TRIGger:NREJect {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable noise reject"

  trigger_position:
    scpi: ":TRIGger:POSition?"
    type: query
    returns:
      type: float
    description: "Query trigger position"

  # Edge Trigger
  trigger_edge_source:
    getter: ":TRIGger:EDGE:SOURce?"
    setter: ":TRIGger:EDGE:SOURce {source}"
    type: property
    params:
      source:
        type: enum
        options: ["CHANnel1", "CHANnel2", "CHANnel3", "CHANnel4", "EXT", "D0", "D1", "D2", "D3", "D4", "D5", "D6", "D7", "D8", "D9", "D10", "D11", "D12", "D13", "D14", "D15"]
    returns:
      type: string
    description: "Edge trigger source"

  trigger_edge_slope:
    getter: ":TRIGger:EDGE:SLOPe?"
    setter: ":TRIGger:EDGE:SLOPe {slope}"
    type: property
    params:
      slope:
        type: enum
        options: ["POSitive", "NEGative", "RFALl"]
    returns:
      type: string
    description: "Edge trigger slope"

  trigger_edge_level:
    getter: ":TRIGger:EDGE:LEVel?"
    setter: ":TRIGger:EDGE:LEVel {level}"
    type: property
    params:
      level:
        type: float
        unit: V
    returns:
      type: float
      unit: V
    description: "Edge trigger level"

  # Pulse Trigger
  trigger_pulse_source:
    getter: ":TRIGger:PULSe:SOURce?"
    setter: ":TRIGger:PULSe:SOURce {source}"
    type: property
    params:
      source:
        type: enum
        options: ["CHANnel1", "CHANnel2", "CHANnel3", "CHANnel4", "D0", "D1", "D2", "D3", "D4", "D5", "D6", "D7", "D8", "D9", "D10", "D11", "D12", "D13", "D14", "D15"]
    returns:
      type: string
    description: "Pulse trigger source"

  trigger_pulse_polarity:
    getter: ":TRIGger:PULSe:POLarity?"
    setter: ":TRIGger:PULSe:POLarity {polarity}"
    type: property
    params:
      polarity:
        type: enum
        options: ["POSitive", "NEGative"]
    returns:
      type: string
    description: "Pulse trigger polarity"

  trigger_pulse_when:
    getter: ":TRIGger:PULSe:WHEN?"
    setter: ":TRIGger:PULSe:WHEN {when}"
    type: property
    params:
      when:
        type: enum
        options: ["GREater", "LESS", "GLESs"]
    returns:
      type: string
    description: "Pulse trigger condition"

  trigger_pulse_uwidth:
    getter: ":TRIGger:PULSe:UWIDth?"
    setter: ":TRIGger:PULSe:UWIDth {width}"
    type: property
    params:
      width:
        type: float
        unit: s
        max: 10
    returns:
      type: float
      unit: s
    description: "Pulse trigger upper width limit"

  trigger_pulse_lwidth:
    getter: ":TRIGger:PULSe:LWIDth?"
    setter: ":TRIGger:PULSe:LWIDth {width}"
    type: property
    params:
      width:
        type: float
        unit: s
        min: 0.000000001
    returns:
      type: float
      unit: s
    description: "Pulse trigger lower width limit"

  trigger_pulse_level:
    getter: ":TRIGger:PULSe:LEVel?"
    setter: ":TRIGger:PULSe:LEVel {level}"
    type: property
    params:
      level:
        type: float
        unit: V
    returns:
      type: float
      unit: V
    description: "Pulse trigger level"

  # Video Trigger
  trigger_video_source:
    getter: ":TRIGger:VIDeo:SOURce?"
    setter: ":TRIGger:VIDeo:SOURce {source}"
    type: property
    params:
      source:
        type: enum
        options: ["CHANnel1", "CHANnel2", "CHANnel3", "CHANnel4"]
    returns:
      type: string
    description: "Video trigger source"

  trigger_video_polarity:
    getter: ":TRIGger:VIDeo:POLarity?"
    setter: ":TRIGger:VIDeo:POLarity {polarity}"
    type: property
    params:
      polarity:
        type: enum
        options: ["POSitive", "NEGative"]
    returns:
      type: string
    description: "Video trigger polarity"

  trigger_video_mode:
    getter: ":TRIGger:VIDeo:MODE?"
    setter: ":TRIGger:VIDeo:MODE {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["ODDField", "EVENfield", "LINE", "ALINes"]
    returns:
      type: string
    description: "Video trigger sync type"

  trigger_video_line:
    getter: ":TRIGger:VIDeo:LINE?"
    setter: ":TRIGger:VIDeo:LINE {line}"
    type: property
    params:
      line:
        type: int
        min: 1
        max: 1125
    returns:
      type: int
    description: "Video trigger line number"

  trigger_video_standard:
    getter: ":TRIGger:VIDeo:STANdard?"
    setter: ":TRIGger:VIDeo:STANdard {standard}"
    type: property
    params:
      standard:
        type: enum
