instrument:
  manufacturer: "Tektronix"
  model: "AFG31000"
  class: function_generator
  description: "Arbitrary Function Generator - 25 MHz to 250 MHz, 14-bit resolution, 16 MS/CH memory"

identity:
  query: "*IDN?"
  pattern: "TEKTRONIX,AFG31[0-2][0-5][0-2]"

interfaces:
  - type: gpib
    default_address: 10
  - type: usb
  - type: ethernet
    port: 5025

settings:
  timeout_ms: 5000
  terminator: "\n"
  opc_query: true

commands:
  # IEEE-488.2 Common Commands
  reset:
    scpi: "*RST"
    type: write
    description: "Reset instrument to factory default settings"

  clear_status:
    scpi: "*CLS"
    type: write
    description: "Clear all event registers and queues"

  identify:
    scpi: "*IDN?"
    type: query
    returns:
      type: string
    description: "Return identification information"

  operation_complete:
    scpi: "*OPC"
    type: write
    description: "Set OPC bit after all pending operations complete"

  operation_complete_query:
    scpi: "*OPC?"
    type: query
    returns:
      type: int
    description: "Return 1 when all pending operations complete"

  self_test:
    scpi: "*TST?"
    type: query
    returns:
      type: int
    description: "Perform self-test and return result (0 = pass)"

  wait:
    scpi: "*WAI"
    type: write
    description: "Wait until all previous commands are executed"

  trigger:
    scpi: "*TRG"
    type: write
    description: "Generate trigger event"

  save_state:
    scpi: "*SAV {location}"
    type: write
    params:
      location:
        type: int
        min: 0
        max: 4
    description: "Save current settings to memory location"

  recall_state:
    scpi: "*RCL {location}"
    type: write
    params:
      location:
        type: int
        min: 0
        max: 4
    description: "Recall settings from memory location"

  event_status_enable:
    getter: "*ESE?"
    setter: "*ESE {mask}"
    type: property
    params:
      mask:
        type: int
        min: 0
        max: 255
    returns:
      type: int
    description: "Set or query Event Status Enable Register"

  event_status_register:
    scpi: "*ESR?"
    type: query
    returns:
      type: int
    description: "Read and clear Standard Event Status Register"

  service_request_enable:
    getter: "*SRE?"
    setter: "*SRE {mask}"
    type: property
    params:
      mask:
        type: int
        min: 0
        max: 255
    returns:
      type: int
    description: "Set or query Service Request Enable Register"

  status_byte:
    scpi: "*STB?"
    type: query
    returns:
      type: int
    description: "Read Status Byte Register"

  power_on_status_clear:
    getter: "*PSC?"
    setter: "*PSC {state}"
    type: property
    params:
      state:
        type: int
        min: 0
        max: 1
    returns:
      type: int
    description: "Set or query power-on status clear flag"

  options:
    scpi: "*OPT?"
    type: query
    returns:
      type: string
    description: "Query installed options"

  calibrate_query:
    scpi: "*CAL?"
    type: query
    returns:
      type: int
    description: "Perform internal calibration and return result"

  # Calibration and Diagnostic
  calibration:
    getter: "CALibration[:ALL]?"
    setter: "CALibration[:ALL]"
    type: property
    returns:
      type: int
    description: "Perform internal calibration"

  diagnostic:
    getter: "DIAGnostic[:ALL]?"
    setter: "DIAGnostic[:ALL]"
    type: property
    returns:
      type: int
    description: "Perform self-test"

  # Display Commands
  display_brightness:
    getter: "DISPlay:BRIGhtness?"
    setter: "DISPlay:BRIGhtness {brightness}"
    type: property
    params:
      brightness:
        type: float
        min: 0.0
        max: 1.0
    returns:
      type: float
    description: "Set or query LCD display brightness"

  display_saver_immediate:
    scpi: "DISPlay:SAVer:IMMediate"
    type: write
    description: "Enable screen saver immediately"

  display_saver_state:
    getter: "DISPlay:SAVer[:STATe]?"
    setter: "DISPlay:SAVer[:STATe] {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable or disable screen saver function"

  display_text:
    getter: "DISPlay[:WINDow]:TEXT[:DATA]?"
    setter: "DISPlay[:WINDow]:TEXT[:DATA] \"{text}\""
    type: property
    params:
      text:
        type: string
    returns:
      type: string
    description: "Display text message on screen"

  display_text_clear:
    scpi: "DISPlay[:WINDow]:TEXT:CLEar"
    type: write
    description: "Clear text message from screen"

  # Output Commands
  output_state:
    getter: "OUTPut[1|2][:STATe]?"
    setter: "OUTPut[1|2][:STATe] {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable or disable output for specified channel"

  output_impedance:
    getter: "OUTPut[1|2]:IMPedance?"
    setter: "OUTPut[1|2]:IMPedance {impedance}"
    type: property
    params:
      impedance:
        type: float
        unit: Ohm
        min: 1
        max: 10000
    returns:
      type: float
      unit: Ohm
    description: "Set or query output load impedance"

  output_polarity:
    getter: "OUTPut[1|2]:POLarity?"
    setter: "OUTPut[1|2]:POLarity {polarity}"
    type: property
    params:
      polarity:
        type: enum
        options: ["NORMal", "INVerted"]
    returns:
      type: string
    description: "Set or query output waveform polarity"

  output_trigger_mode:
    getter: "OUTPut:TRIGger:MODE?"
    setter: "OUTPut:TRIGger:MODE {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["TRIGger", "SYNC"]
    returns:
      type: string
    description: "Set or query trigger output mode"

  # Source Function Selection
  source_function:
    getter: "[SOURce[1|2]]:FUNCtion[:SHAPe]?"
    setter: "[SOURce[1|2]]:FUNCtion[:SHAPe] {shape}"
    type: property
    params:
      shape:
        type: enum
        options: ["SINusoid", "SQUare", "PULSe", "RAMP", "PRNoise", "DC", "SINC", "GAUSsian", "LORentz", "ERISe", "EDECay", "HAVersine", "EMEMory", "EMEMory2", "EFILe"]
    returns:
      type: string
    description: "Select output waveform shape"

  source_frequency:
    getter: "[SOURce[1|2]]:FREQuency[:CW|:FIXed]?"
    setter: "[SOURce[1|2]]:FREQuency[:CW|:FIXed] {frequency}"
    type: property
    params:
      frequency:
        type: float
        unit: Hz
        min: 0.000001
        max: 250000000
    returns:
      type: float
      unit: Hz
    description: "Set or query output frequency"

  source_amplitude:
    getter: "[SOURce[1|2]]:VOLTage[:LEVel][:IMMediate][:AMPLitude]?"
    setter: "[SOURce[1|2]]:VOLTage[:LEVel][:IMMediate][:AMPLitude] {amplitude}"
    type: property
    params:
      amplitude:
        type: float
        unit: Vpp
        min: 0.01
        max: 10
    returns:
      type: float
      unit: Vpp
    description: "Set or query output amplitude"

  source_offset:
    getter: "[SOURce[1|2]]:VOLTage[:LEVel][:IMMediate]:OFFSet?"
    setter: "[SOURce[1|2]]:VOLTage[:LEVel][:IMMediate]:OFFSet {voltage}"
    type: property
    params:
      voltage:
        type: float
        unit: V
        min: -5
        max: 5
    returns:
      type: float
      unit: V
    description: "Set or query DC offset voltage"

  source_voltage_high:
    getter: "[SOURce[1|2]]:VOLTage[:LEVel][:IMMediate]:HIGH?"
    setter: "[SOURce[1|2]]:VOLTage[:LEVel][:IMMediate]:HIGH {voltage}"
    type: property
    params:
      voltage:
        type: float
        unit: V
    returns:
      type: float
      unit: V
    description: "Set or query output high level voltage"

  source_voltage_low:
    getter: "[SOURce[1|2]]:VOLTage[:LEVel][:IMMediate]:LOW?"
    setter: "[SOURce[1|2]]:VOLTage[:LEVel][:IMMediate]:LOW {voltage}"
    type: property
    params:
      voltage:
        type: float
        unit: V
    returns:
      type: float
      unit: V
    description: "Set or query output low level voltage"

  voltage_unit:
    getter: "[SOURce[1|2]]:VOLTage:UNIT?"
    setter: "[SOURce[1|2]]:VOLTage:UNIT {unit}"
    type: property
    params:
      unit:
        type: enum
        options: ["VPP", "VRMS", "DBM"]
    returns:
      type: string
    description: "Set or query voltage amplitude units"

  voltage_limit_high:
    getter: "[SOURce[1|2]]:VOLTage:LIMit:HIGH?"
    setter: "[SOURce[1|2]]:VOLTage:LIMit:HIGH {voltage}"
    type: property
    params:
      voltage:
        type: float
        unit: V
    returns:
      type: float
      unit: V
    description: "Set or query upper limit of output amplitude"

  voltage_limit_low:
    getter: "[SOURce[1|2]]:VOLTage:LIMit:LOW?"
    setter: "[SOURce[1|2]]:VOLTage:LIMit:LOW {voltage}"
    type: property
    params:
      voltage:
        type: float
        unit: V
    returns:
      type: float
      unit: V
    description: "Set or query lower limit of output amplitude"

  voltage_concurrent:
    getter: "[SOURce[1|2]]:VOLTage:CONCurrent[:STATe]?"
    setter: "[SOURce[1|2]]:VOLTage:CONCurrent[:STATe] {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF"]
    returns:
      type: bool
    description: "Enable or disable concurrent voltage level changes"

  # Phase Commands
  source_phase:
    getter: "[SOURce[1|2]]:PHASe[:ADJust]?"
    setter: "[SOURce[1|2]]:PHASe[:ADJust] {phase}"
    type: property
    params:
      phase:
        type: float
        unit: deg
        min: -180
        max: 180
    returns:
      type: float
      unit: deg
    description: "Set or query output waveform phase"

  phase_initiate:
    scpi: "[SOURce[1|2]]:PHASe:INITiate"
    type: write
    description: "Synchronize phase of CH1 and CH2 output waveforms"

  phase_concurrent:
    getter: "[SOURce[1|2]]:PHASe:CONCurrent[:STATe]?"
    setter: "[SOURce[1|2]]:PHASe:CONCurrent[:STATe] {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF"]
    returns:
      type: bool
    description: "Enable or disable concurrent phase changes"

  frequency_concurrent:
    getter: "[SOURce[1|2]]:FREQuency:CONCurrent[:STATe]?"
    setter: "[SOURce[1|2]]:FREQuency:CONCurrent[:STATe] {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF"]
    returns:
      type: bool
    description: "Enable or disable concurrent frequency changes"

  # Ramp Function
  ramp_symmetry:
    getter: "[SOURce[1|2]]:FUNCtion:RAMP:SYMMetry?"
    setter: "[SOURce[1|2]]:FUNCtion:RAMP:SYMMetry {symmetry}"
    type: property
    params:
      symmetry:
        type: float
        unit: "%"
        min: 0.0
        max: 100.0
    returns:
      type: float
      unit: "%"
    description: "Set or query ramp waveform symmetry"

  # Pulse Configuration
  pulse_duty_cycle:
    getter: "[SOURce[1|2]]:PULSe:DCYCle?"
    setter: "[SOURce[1|2]]:PULSe:DCYCle {percent}"
    type: property
    params:
      percent:
        type: float
        unit: "%"
        min: 0.001
        max: 99.999
    returns:
      type: float
      unit: "%"
    description: "Set or query pulse waveform duty cycle"

  pulse_width:
    getter: "[SOURce[1|2]]:PULSe:WIDTh?"
    setter: "[SOURce[1|2]]:PULSe:WIDTh {seconds}"
    type: property
    params:
      seconds:
        type: float
        unit: s
    returns:
      type: float
      unit: s
    description: "Set or query pulse width"

  pulse_period:
    getter: "[SOURce[1|2]]:PULSe:PERiod?"
    setter: "[SOURce[1|2]]:PULSe:PERiod {period}"
    type: property
    params:
      period:
        type: float
        unit: s
    returns:
      type: float
      unit: s
    description: "Set or query pulse period"

  pulse_delay:
    getter: "[SOURce[1|2]]:PULSe:DELay?"
    setter: "[SOURce[1|2]]:PULSe:DELay {delay}"
    type: property
    params:
      delay:
        type: float
        unit: s
    returns:
      type: float
      unit: s
    description: "Set or query pulse lead delay"

  pulse_transition_leading:
    getter: "[SOURce[1|2]]:PULSe:TRANsition[:LEADing]?"
    setter: "[SOURce[1|2]]:PULSe:TRANsition[:LEADing] {seconds}"
    type: property
    params:
      seconds:
        type: float
        unit: s
    returns:
      type: float
      unit: s
    description: "Set or query pulse leading edge time"

  pulse_transition_trailing:
    getter: "[SOURce[1|2]]:PULSe:TRANsition:TRAiling?"
    setter: "[SOURce[1|2]]:PULSe:TRANsition:TRAiling {seconds}"
    type: property
    params:
      seconds:
        type: float
        unit: s
    returns:
      type: float
      unit: s
    description: "Set or query pulse trailing edge time"

  pulse_hold:
    getter: "[SOURce[1|2]]:PULSe:HOLD?"
    setter: "[SOURce[1|2]]:PULSe:HOLD {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["WIDTh", "DUTY"]
    returns:
      type: string
    description: "Set instrument to hold either pulse width or duty"

  # Amplitude Modulation
  am_state:
    getter: "[SOURce[1|2]]:AM:STATe?"
    setter: "[SOURce[1|2]]:AM:STATe {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF"]
    returns:
      type: bool
    description: "Enable or disable AM modulation"

  am_depth:
    getter: "[SOURce[1|2]]:AM[:DEPTh]?"
    setter: "[SOURce[1|2]]:AM[:DEPTh] {depth}"
    type: property
    params:
      depth:
        type: float
        unit: "%"
        min: 0.0
        max: 120.0
    returns:
      type: float
      unit: "%"
    description: "Set or query AM modulation depth"

  am_source:
    getter: "[SOURce[1|2]]:AM:SOURce?"
    setter: "[SOURce[1|2]]:AM:SOURce {source}"
    type: property
    params:
      source:
        type: enum
        options: ["INTernal", "EXTernal"]
    returns:
      type: string
    description: "Set or query AM modulation source"

  am_internal_frequency:
    getter: "[SOURce[1|2]]:AM:INTernal:FREQuency?"
    setter: "[SOURce[1|2]]:AM:INTernal:FREQuency {frequency}"
    type: property
    params:
      frequency:
        type: float
        unit: Hz
        min: 0.001
        max: 1000000
    returns:
      type: float
      unit: Hz
    description: "Set or query AM internal modulation frequency"

  am_internal_function:
    getter: "[SOURce[1|2]]:AM:INTernal:FUNCtion?"
    setter: "[SOURce[1|2]]:AM:INTernal:FUNCtion {shape}"
    type: property
    params:
      shape:
        type: enum
        options: ["SINusoid", "SQUare", "TRIangle", "RAMP", "NRAMp", "PRNoise", "EMEMory", "EMEMory2", "EFILe"]
    returns:
      type: string
    description: "Set or query AM internal modulation waveform"

  am_internal_function_efile:
    getter: "[SOURce[1|2]]:AM:INTernal:FUNCtion:EFILe?"
    setter: "[SOURce[1|2]]:AM:INTernal:FUNCtion:EFILe \"{file_name}\""
    type: property
    params:
      file_name:
        type: string
    returns:
      type: string
    description: "Set or query EFile for AM modulation"

  # Frequency Modulation
  fm_state:
    getter: "[SOURce[1|2]]:FM:STATe?"
    setter: "[SOURce[1|2]]:FM:STATe {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF"]
    returns:
      type: bool
    description: "Enable or disable FM modulation"

  fm_deviation:
    getter: "[SOURce[1|2]]:FM[:DEViation]?"
    setter: "[SOURce[1|2]]:FM[:DEViation] {deviation}"
    type: property
    params:
      deviation:
        type: float
        unit: Hz
    returns:
      type: float
      unit: Hz
    description: "Set or query FM peak frequency deviation"

  fm_source:
    getter: "[SOURce[1|2]]:FM:SOURce?"
    setter: "[SOURce[1|2]]:FM:SOURce {source}"
    type: property
    params:
      source:
        type: enum
        options: ["INTernal", "EXTernal"]
    returns:
      type: string
    description: "Set or query FM modulation source"

  fm_internal_frequency:
    getter: "[SOURce[1|2]]:FM:INTernal:FREQuency?"
    setter: "[SOURce[1|2]]:FM:INTernal:FREQuency {frequency}"
    type: property
    params:
      frequency:
        type: float
        unit: Hz
        min: 0.001
        max: 1000000
    returns:
      type: float
      unit: Hz
    description: "Set or query FM internal modulation frequency"

  fm_internal_function:
    getter: "[SOURce[1|2]]:FM:INTernal:FUNCtion?"
    setter: "[SOURce[1|2]]:FM:INTernal:FUNCtion {shape}"
    type: property
    params:
      shape:
        type: enum
        options: ["SINusoid", "SQUare", "TRIangle", "RAMP", "NRAMp", "PRNoise", "EMEMory", "EMEMory2", "EFILe"]
    returns:
      type: string
    description: "Set or query FM internal modulation waveform"

  fm_internal_function_efile:
    getter: "[SOURce[1|2]]:FM:INTernal:FUNCtion:EFILe?"
    setter: "[SOURce[1|2]]:FM:INTernal:FUNCtion:EFILe \"{file_name}\""
    type: property
    params:
      file_name:
        type: string
    returns:
      type: string
    description: "Set or query EFile for FM modulation"

  # Phase Modulation
  pm_state:
    getter: "[SOURce[1|2]]:PM:STATe?"
    setter: "[SOURce[1|2]]:PM:STATe {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF"]
    returns:
      type: bool
    description: "Enable or disable PM modulation"

  pm_deviation:
    getter: "[SOURce[1|2]]:PM[:DEViation]?"
    setter: "[SOURce[1|2]]:PM[:DEViation] {deviation}"
    type: property
    params:
      deviation:
        type: float
        unit: deg
        min: 0
        max: 180
    returns:
      type: float
      unit: deg
    description: "Set or query PM peak phase deviation"

  pm_source:
    getter: "[SOURce[1|2]]:PM:SOURce?"
    setter: "[SOURce[1|2]]:PM:SOURce {source}"
    type: property
    params:
      source:
        type: enum
        options: ["INTernal", "EXTernal"]
    returns:
      type: string
    description: "Set or query PM modulation source"

  pm_internal_frequency:
    getter: "[SOURce[1|2]]:PM:INTernal:FREQuency?"
    setter: "[SOURce[1|2]]:PM:INTernal:FREQuency {frequency}"
    type: property
    params:
      frequency:
        type: float
        unit: Hz
        min: 0.001
        max: 1000000
    returns:
      type: float
      unit: Hz
    description: "Set or query PM internal modulation frequency"

  pm_internal_function:
    getter: "[SOURce[1|2]]:PM:INTernal:FUNCtion?"
    setter: "[SOURce[1|2]]:PM:INTernal:FUNCtion {shape}"
    type: property
    params:
      shape:
        type: enum
        options: ["SINusoid", "SQUare", "TRIangle", "RAMP", "NRAMp", "PRNoise", "EMEMory", "EMEMory2", "EFILe"]
    returns:
      type: string
    description: "Set or query PM internal modulation waveform"

  pm_internal_function_efile:
    getter: "[SOURce[1|2]]:PM:INTernal:FUNCtion:EFILe?"
    setter: "[SOURce[1|2]]:PM:INTernal:FUNCtion:EFILe \"{file_name}\""
    type: property
    params:
      file_name:
        type: string
    returns:
      type: string
    description: "Set or query EFile for PM modulation"

  # FSK Modulation
  fsk_state:
    getter: "[SOURce[1|2]]:FSKey:STATe?"
    setter: "[SOURce[1|2]]:FSKey:STATe {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF"]
    returns:
      type: bool
    description: "Enable or disable FSK modulation"

  fsk_frequency:
    getter: "[SOURce[1|2]]:FSKey[:FREQuency]?"
    setter: "[SOURce[1|2]]:FSKey[:FREQuency] {frequency}"
    type: property
    params:
      frequency:
        type: float
        unit: Hz
    returns:
      type: float
      unit: Hz
    description: "Set or query FSK hop frequency"

  fsk_internal_rate:
    getter: "[SOURce[1|2]]:FSKey:INTernal:RATE?"
    setter: "[SOURce[1|2]]:FSKey:INTernal:RATE {rate}"
    type: property
    params:
      rate:
        type: float
        unit: Hz
    returns:
      type: float
      unit: Hz
    description: "Set or query FSK internal modulation rate"

  fsk_source:
    getter: "[SOURce[1|2]]:FSKey:SOURce?"
    setter: "[SOURce[1|2]]:FSKey:SOURce {source}"
    type: property
    params:
      source:
        type: enum
        options: ["INTernal", "EXTernal"]
    returns:
      type: string
    description: "Set or query FSK source"

  # PWM Modulation
  pwm_state:
    getter: "[SOURce[1|2]]:PWM:STATe?"
    setter: "[SOURce[1|2]]:PWM:STATe {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF"]
    returns:
      type: bool
    description: "Enable or disable PWM modulation"

  pwm_deviation_duty_cycle:
    getter: "[SOURce[1|2]]:PWM[:DEViation]:DCYCle?"
    setter: "[SOURce[1|2]]:PWM[:DEViation]:DCYCle {percent}"
    type: property
    params:
      percent:
        type: float
        unit: "%"
    returns:
      type: float
      unit: "%"
    description: "Set or query PWM deviation in percent"

  pwm_source:
    getter: "[SOURce[1|2]]:PWM:SOURce?"
    setter: "[SOURce[1|2]]:PWM:SOURce {source}"
    type: property
    params:
      source:
        type: enum
        options: ["INTernal", "EXTernal"]
    returns:
      type: string
    description: "Set or query PWM modulation source"

  pwm_internal_frequency:
    getter: "[SOURce[1|2]]:PWM:INTernal:FREQuency?"
    setter: "[SOURce[1|2]]:PWM:INTernal:FREQuency {frequency}"
    type: property
    params:
      frequency:
        type: float
        unit: Hz
        min: 0.001
        max: 1000000
    returns:
