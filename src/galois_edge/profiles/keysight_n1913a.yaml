sequences:
  quick_power_measurement:
    description: "Quick power measurement at current settings"
    steps:
      - command: sense_frequency
        args:
          value: "1000000000"
      - command: sense_average_count
        args:
          count: "16"
      - command: initiate
      - command: fetch_power
        capture: result
    returns: result

  calibrate_and_measure:
    description: "Zero, calibrate, and measure power"
    params:
      frequency:
        type: float
        unit: Hz
        default: 50000000
    steps:
      - command: calibrate_zero_auto
        args:
          state: "ONCE"
      - command: calibrate_auto
        args:
          state: "ONCE"
      - command: sense_frequency
        args:
          value: "{frequency}"
      - command: initiate
      - command: fetch_power
        capture: result
    returns: result

  frequency_sweep:
    description: "Perform frequency sweep measurement"
    params:
      start_freq:
        type: float
        unit: Hz
      stop_freq:
        type: float
        unit: Hz
      steps:
        type: int
        min: 2
        max: 2048
    steps:
      - command: sense_frequency_start
        args:
          value: "{start_freq}"
      - command: sense_frequency_stop
        args:
          value: "{stop_freq}"
      - command: sense_frequency_step
        args:
          value: "{steps}"
      - command: trigger