    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable keyclick"

  system_lfrequency:
    scpi: ":SYST:LFR?"
    type: query
    returns:
      type: float
      unit: Hz
    description: "Query power line frequency"

  trace_clear:
    scpi: ":TRAC:CLE"
    type: write
    description: "Clear readings from buffer"

  trace_free:
    scpi: ":TRAC:FREE?"
    type: query
    returns:
      type: array
      element_type: int
      separator: ","
    description: "Query bytes available and bytes in use"

  trace_points:
    getter: ":TRAC:POIN?"
    setter: ":TRAC:POIN {count}"
    type: property
    params:
      count:
        type: int
        min: 2
        max: 1024
    returns:
      type: int
    description: "Specify size of buffer"

  trace_feed:
    getter: ":TRAC:FEED?"
    setter: ":TRAC:FEED {source}"
    type: property
    params:
      source:
        type: enum
        options: ["SENSe", "SENSe1", "CALCulate", "CALCulate1", "NONE"]
    returns:
      type: string
    description: "Select source of readings stored in buffer"