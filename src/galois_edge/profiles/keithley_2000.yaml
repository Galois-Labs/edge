instrument:
  manufacturer: "Keithley"
  model: "2000"
  class: dmm
  description: "6½-digit High Performance Digital Multimeter with 0.002% basic accuracy"

identity:
  query: "*IDN?"
  pattern: "KEITHLEY INSTRUMENTS INC.,MODEL 2000"

interfaces:
  - type: gpib
    default_address: 16
  - type: serial
    port: 9600

settings:
  timeout_ms: 5000
  terminator: "\n"
  opc_query: false

commands:
  reset:
    scpi: "*RST"
    type: write
    description: "Reset instrument to default conditions"

  clear_status:
    scpi: "*CLS"
    type: write
    description: "Clear all event registers and Error Queue"

  identify:
    scpi: "*IDN?"
    type: query
    returns:
      type: string
    description: "Query instrument identification"

  operation_complete:
    scpi: "*OPC"
    type: write
    description: "Set OPC bit after all pending operations complete"

  operation_complete_query:
    scpi: "*OPC?"
    type: query
    returns:
      type: int
    description: "Query operation complete status"

  self_test:
    scpi: "*TST?"
    type: query
    returns:
      type: int
    description: "Perform self-test (0=pass, 1=fail)"

  trigger:
    scpi: "*TRG"
    type: write
    description: "Send bus trigger"

  wait:
    scpi: "*WAI"
    type: write
    description: "Wait for pending operations to complete"

  save_setup:
    scpi: "*SAV {location}"
    type: write
    params:
      location:
        type: int
        min: 0
        max: 0
    description: "Save present setup to memory"

  recall_setup:
    scpi: "*RCL {location}"
    type: write
    params:
      location:
        type: int
        min: 0
        max: 0
    description: "Recall setup from memory"

  event_status_enable:
    getter: "*ESE?"
    setter: "*ESE {mask}"
    type: property
    params:
      mask:
        type: int
        min: 0
        max: 255
    returns:
      type: int
    description: "Program Event Status Enable Register"

  event_status_register:
    scpi: "*ESR?"
    type: query
    returns:
      type: int
    description: "Read and clear Event Status Register"

  service_request_enable:
    getter: "*SRE?"
    setter: "*SRE {mask}"
    type: property
    params:
      mask:
        type: int
        min: 0
        max: 255
    returns:
      type: int
    description: "Program Service Request Enable Register"

  status_byte:
    scpi: "*STB?"
    type: query
    returns:
      type: int
    description: "Read Status Byte Register"

  configure_voltage_dc:
    scpi: ":CONF:VOLT:DC"
    type: write
    description: "Configure for DC voltage measurements"

  configure_voltage_ac:
    scpi: ":CONF:VOLT:AC"
    type: write
    description: "Configure for AC voltage measurements"

  configure_current_dc:
    scpi: ":CONF:CURR:DC"
    type: write
    description: "Configure for DC current measurements"

  configure_current_ac:
    scpi: ":CONF:CURR:AC"
    type: write
    description: "Configure for AC current measurements"

  configure_resistance:
    scpi: ":CONF:RES"
    type: write
    description: "Configure for 2-wire resistance measurements"

  configure_fresistance:
    scpi: ":CONF:FRES"
    type: write
    description: "Configure for 4-wire resistance measurements"

  configure_frequency:
    scpi: ":CONF:FREQ"
    type: write
    description: "Configure for frequency measurements"

  configure_period:
    scpi: ":CONF:PER"
    type: write
    description: "Configure for period measurements"

  configure_temperature:
    scpi: ":CONF:TEMP"
    type: write
    description: "Configure for temperature measurements"

  configure_diode:
    scpi: ":CONF:DIOD"
    type: write
    description: "Configure for diode testing"

  configure_continuity:
    scpi: ":CONF:CONT"
    type: write
    description: "Configure for continuity testing"

  fetch:
    scpi: ":FETC?"
    type: query
    returns:
      type: array
      element_type: float
      separator: ","
    description: "Request latest reading without triggering"
    streamable: true

  read:
    scpi: ":READ?"
    type: query
    returns:
      type: array
      element_type: float
      separator: ","
    description: "Trigger and acquire readings"

  measure_voltage_dc:
    scpi: ":MEAS:VOLT:DC?"
    type: query
    returns:
      type: float
      unit: V
    description: "Perform DC voltage measurement"
    streamable: true

  measure_voltage_ac:
    scpi: ":MEAS:VOLT:AC?"
    type: query
    returns:
      type: float
      unit: V
    description: "Perform AC voltage measurement"
    streamable: true

  measure_current_dc:
    scpi: ":MEAS:CURR:DC?"
    type: query
    returns:
      type: float
      unit: A
    description: "Perform DC current measurement"
    streamable: true

  measure_current_ac:
    scpi: ":MEAS:CURR:AC?"
    type: query
    returns:
      type: float
      unit: A
    description: "Perform AC current measurement"
    streamable: true

  measure_resistance:
    scpi: ":MEAS:RES?"
    type: query
    returns:
      type: float
      unit: Ohm
    description: "Perform 2-wire resistance measurement"
    streamable: true

  measure_fresistance:
    scpi: ":MEAS:FRES?"
    type: query
    returns:
      type: float
      unit: Ohm
    description: "Perform 4-wire resistance measurement"
    streamable: true

  measure_frequency:
    scpi: ":MEAS:FREQ?"
    type: query
    returns:
      type: float
      unit: Hz
    description: "Perform frequency measurement"
    streamable: true

  measure_period:
    scpi: ":MEAS:PER?"
    type: query
    returns:
      type: float
      unit: s
    description: "Perform period measurement"
    streamable: true

  measure_temperature:
    scpi: ":MEAS:TEMP?"
    type: query
    returns:
      type: float
      unit: C
    description: "Perform temperature measurement"
    streamable: true

  function:
    getter: ":FUNC?"
    setter: ":FUNC '{mode}'"
    type: property
    params:
      mode:
        type: enum
        options: ["VOLT:DC", "VOLT:AC", "CURR:DC", "CURR:AC", "RES", "FRES", "FREQ", "PER", "TEMP", "DIOD", "CONT"]
    returns:
      type: string
    description: "Select measurement function"

  sense_data:
    scpi: ":SENS:DATA?"
    type: query
    returns:
      type: float
    description: "Return latest instrument reading"
    streamable: true

  voltage_dc_nplc:
    getter: ":SENS:VOLT:DC:NPLC?"
    setter: ":SENS:VOLT:DC:NPLC {value}"
    type: property
    params:
      value:
        type: float
        min: 0.01
        max: 10
        default: 1.0
    returns:
      type: float
    description: "Set DCV integration rate in power line cycles"

  voltage_dc_range:
    getter: ":SENS:VOLT:DC:RANG?"
    setter: ":SENS:VOLT:DC:RANG {value}"
    type: property
    params:
      value:
        type: float
        unit: V
        min: 0
        max: 1010
    returns:
      type: float
      unit: V
    description: "Set DCV measurement range"

  voltage_dc_range_auto:
    getter: ":SENS:VOLT:DC:RANG:AUTO?"
    setter: ":SENS:VOLT:DC:RANG:AUTO {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable DCV auto-ranging"

  voltage_dc_reference:
    getter: ":SENS:VOLT:DC:REF?"
    setter: ":SENS:VOLT:DC:REF {value}"
    type: property
    params:
      value:
        type: float
        unit: V
        min: -1010
        max: 1010
    returns:
      type: float
      unit: V
    description: "Set DCV reference value for relative measurements"

  voltage_dc_reference_state:
    getter: ":SENS:VOLT:DC:REF:STAT?"
    setter: ":SENS:VOLT:DC:REF:STAT {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
      type: bool
    description: "Enable/disable DCV reference"

  voltage_dc_reference_acquire:
    scpi: ":SENS:VOLT:DC:REF:ACQ"
    type: write
    description: "Use input signal as DCV reference"

  voltage_dc_digits:
    getter: ":SENS:VOLT:DC:DIG?"
    setter: ":SENS:VOLT:DC:DIG {value}"
    type: property
    params:
      value:
        type: int
        min: 4
        max: 7
        default: 7
    returns:
      type: int
    description: "Set DCV display resolution"

  voltage_dc_filter_state:
    getter: ":SENS:VOLT:DC:AVER:STAT?"
    setter: ":SENS:VOLT:DC:AVER:STAT {state}"
    type: property
    params:
      state:
        type: enum
        options: ["ON", "OFF", "1", "0"]
    returns:
