    description: "Enable/disable DCV digital filter"

  voltage_dc_filter_type:
    getter: ":SENS:VOLT:DC:AVER:TCON?"
    setter: ":SENS:VOLT:DC:AVER:TCON {type}"
    type: property
    params:
      type:
        type: enum
        options: ["MOV", "REP"]
    returns:
      type: string
    description: "Set DCV filter type"

  voltage_dc_filter_count:
