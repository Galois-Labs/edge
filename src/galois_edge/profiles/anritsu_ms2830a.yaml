sequences:
  ber_single_measurement:
    description: "Perform single BER measurement"
    params:
      pattern:
        type: enum
        options: ["PN9", "PN11", "PN15", "PN20", "PN23"]
        default: "PN15"
      total_bits:
        type: int
        default: 1000000
    steps:
      - command: application_select
        args:
          app: "BER"
      - command: ber_pattern
        args:
          pattern: "{pattern}"
      - command: ber_total_bits
        args:
          bits: "{total_bits}"
      - command: ber_mode
        args:
          mode: "SINGle"
      - command: ber_stop_criteria
        args:
          mode: "NONE"
      - command: ber_initiate
      - command: wait
      - command: ber_ratio
        args:
          format: "EP"
        capture: ber_percent
      - command: ber_data_count
        capture: total_bits
      - command: ber_error_count
        capture: error_bits
    returns: ber_percent

  power_meter_reading:
    description: "Take power meter reading with averaging"
    params:
      frequency:
        type: float
        unit: Hz
      average_count:
        type: int
        default: 10
      offset:
        type: float
        unit: dB
        default: 0
    steps:
      - command: application_select
        args:
          app: "PMETer"
      - command: power_meter_configure
      - command: power_meter_frequency
        args:
          freq: "{frequency}"
      - command: power_meter_offset_value
        args:
          value: "{offset}"
      - command: power_meter_offset_state
        args:
          state: "ON"
      - command: power_meter_average_count
        args:
          count: "{average_count}"
      - command: power_meter_average_state
        args:
          state: "ON"
      - command: power_meter_zero_set
      - command: wait
      - command: power_meter_measure
        args:
          unit: "DBM"
        capture: power_dbm
    returns: power_dbm

status:
  stb:
    bit0: EESB0
    bit1: EESB1
    bit2: EESB2
    bit3: EESB3
    bit4: MAV
    bit5: ESB
    bit6: MSS_RQS
    bit7: EESB7
  esr:
    bit0: OPC
    bit2: QYE
    bit3: DDE
    bit4: EXE
    bit5: CME
    bit6: URQ
    bit7: PON