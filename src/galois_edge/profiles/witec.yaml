    description: "SpectrographCenterWavelength"
  spectrographlaserwavelength:
    scpi: "UserParameters|Spectrograph1|LaserWavelength"
    type: query
    returns:
      type: float
      unit: nm
    description: "SpectrographLaserWavelength"
  imagenameindex:
    scpi: "UserParameters|SequencerScanImage|Naming|DataNumber"
    type: query
    returns:
      type: float
    description: "ImageNameIndex"
  imagepointsperline:
