    description: "Ch1 - Range"
  ch1_offset:
    getter: ":INST 1;:VOLT:OFFS?"
    setter: ":INST 1;:VOLT:OFFS {value}"
    type: property
    params:
      value:
        type: float
        unit: V
        min: -1.0
        max: 1.0
    returns:
