    description: "Ch2 - Mode"
  ch2_function:
    getter: ":INST 2;:FUNC:SHAP?"
    setter: ":INST 2;:FUNC:SHAP {value}"
    type: property
    params:
      value:
        type: enum
        options: ["SIN", "TRI", "SQU", "RAMP", "SINC", "GAUS", "EXP", "NOIS", "DC"]
    returns:
      type: string
    description: "Ch2 - Function"
  ch2_frequency:
    getter: ":INST 2;:FREQ?"
    setter: ":INST 2;:FREQ {value}"
    type: property
    params:
      value:
        type: float
        unit: Hz
        min: 0.0
        max: 2500000000.0
    returns:
      type: float
      unit: Hz
    description: "Ch2 - Frequency"
  ch2_duty_cycle:
    getter: ":INST 2;:SQU:DCYC?"
    setter: ":INST 2;:SQU:DCYC {value}"
    type: property
    params:
      value:
        type: float
        unit: %
        min: 0.0
        max: 99.99
    returns:
      type: float
      unit: %
    description: "Ch2 - Duty cycle"
  ch2_range:
    getter: ":INST 2;:VOLT?"
    setter: ":INST 2;:VOLT {value}"
