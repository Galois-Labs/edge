      unit: V
    description: "Ch1 - Offset"
  ch1_sampling_mode:
    getter: ":INST 1;:OUTP:SAMP:FORM?"
    setter: ":INST 1;:OUTP:SAMP:FORM {value}"
    type: property
    params:
      value:
        type: enum
