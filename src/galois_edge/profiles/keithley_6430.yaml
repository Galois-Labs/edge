    setter: ":CALC2:CLIM:MODE {mode}"
    type: property
    params:
      mode:
        type: enum
        options: ["GRAD", "SORT"]
    returns:
      type: string
    description: "Set how limit results control Digital I/O lines"

  calculate2_composite_limits_clear:
    scpi: ":CALC2:CLIM:CLE:IMM"
    type: write
    description: "Clear latest limit test result and reset Digital I/O port"