[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "galois-edge"
version = "0.1.0"
description = "Galois edge daemon — laboratory instrument gateway (Python engine)"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.0",
    "pyvisa>=1.14.0",
    "pyvisa-py>=0.7.0",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pymodbus>=3.6,<3.8",
    "pyserial>=3.5",
    "smbus2>=0.4.0",
    "mcp>=1.27.0",
    "pydantic>=2.5",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.2.1",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
gpib = [
    "gpib-ctypes>=0.3.0; sys_platform == 'linux'",
]
usb = [
    "pyusb>=1.2.0",
]
discovery = [
    "zeroconf>=0.131.0",
]
streaming = [
    "pyzmq>=25.0.0",
    "msgpack>=1.0.0",
]
# SDK instrument optional dependencies
ocean-optics = [
    "seabreeze>=2.0.0",
]
ni-daq = [
    "nidaqmx>=0.9.0",
]
qd-ppms = [
    "MultiPyVu>=1.0.0; sys_platform == 'win32'",
]
digitizers = [
    "numpy>=1.20.0",
]
ni-scope = [
    "niscope>=1.4.0",
]
ni-fgen = [
    "nifgen>=1.4.0",
]
ni-dcpower = [
    "nidcpower>=1.4.0",
]
ni-dmm = [
    "nidmm>=1.4.0",
]
dps150 = [
    "pyserial>=3.5",
]
digilent = [
    "dwfpy>=1.1.0",
]
modbus = [
    "pymodbus>=3.6,<3.8",
]
spi = [
    "spidev>=3.6; sys_platform == 'linux'",
]
hotplug = [
    "pyudev>=0.24.0; sys_platform == 'linux'",
]
all = [
    "galois-edge[gpib,usb,discovery,streaming,hotplug,ocean-optics,ni-daq,qd-ppms,digitizers,ni-scope,ni-fgen,ni-dcpower,ni-dmm,dps150,digilent]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "build",
    "httpx>=0.27",
]
build = [
    "pyinstaller>=6.8",
    "pyinstaller-hooks-contrib>=2025.3",
]

[project.scripts]
galois-edge-daemon = "galois_edge.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/galois_edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
