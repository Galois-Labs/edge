[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "galois-edge"
version = "0.1.0"
description = "Galois edge daemon — laboratory instrument gateway (Python engine)"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.0",
    "pyvisa>=1.14.0",
    "pyvisa-py>=0.7.0",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
gpib = [
    "gpib-ctypes>=0.3.0; sys_platform == 'linux'",
]
usb = [
    "pyusb>=1.2.0",
]
discovery = [
    "zeroconf>=0.131.0",
]
streaming = [
    "pyzmq>=25.0.0",
    "msgpack>=1.0.0",
]
all = [
    "galois-edge[gpib,usb,discovery,streaming]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "build",
]

[project.scripts]
galois-edge-daemon = "galois_edge.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/galois_edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
